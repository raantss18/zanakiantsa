name: zanakiantsa
description: "A new Flutter project."
publish_to: 'none'
version: 0.11.1+12

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  cryptography: ^2.9.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  flutter_tts: ^4.2.5
  google_mlkit_digital_ink_recognition: ^0.16.1
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/audio/
    - assets/audio/sfx/
    - assets/art/
    - assets/echecs/
    - assets/livres/
    - assets/logo/
    - assets/livres/images/
  fonts:
    - family: Andika
      fonts:
        - asset: assets/fonts/Andika-Regular.ttf
        - asset: assets/fonts/Andika-Bold.ttf
          weight: 700
    # Titres et logo seulement (ADR 0027) ; la lecture reste en Andika, faite pour les lecteurs débutants.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    # Écriture cursive scolaire française (ADR 0031) : lettres attachées à reconnaître et à tracer.
    - family: PlaywriteFR
      fonts:
        - asset: assets/fonts/PlaywriteFR-Regular.ttf
