name: Site vitrine

# Publie le dossier site/ sur GitHub Pages (ADR 0055). Le site est reconstruit à chaque modification du site et à chaque
# version publiée : le numéro, la taille, l'empreinte et le lien de téléchargement viennent de la dernière version.
# Une fois par jour aussi, au cas où un déclenchement se serait perdu : une version doit toujours finir par se voir.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tool/build_site.py'
      - '.github/workflows/site.yml'
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # les domaines sont lus dans l'étiquette de la dernière version
          fetch-tags: true

      - name: Versions publiées
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases?per_page=30" > releases.json

      - name: Construire le site
        run: python3 tool/build_site.py --releases releases.json --out _site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v5
