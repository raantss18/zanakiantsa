name: Application

# Analyse, tests, contenu à jour et taille de l'APK (< 60 Mo, CLAUDE.md) à chaque modification.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, même épinglage que COMIMa
        with:
          channel: stable
          flutter-version: 3.47.7 # même version que le poste de développement (CLAUDE.md)
          cache: true

      - name: Contenu compilé à jour
        working-directory: app
        run: |
          flutter pub get
          dart run tool/build_content.dart --check

      - name: Analyse et tests
        working-directory: app
        run: |
          flutter analyze
          flutter test

      - name: Taille de l'APK (budget 60 Mo)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64
          size=$(stat -c %s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          echo "APK arm64 : $((size / 1048576)) Mo"
          test "$size" -lt $((60 * 1048576))
