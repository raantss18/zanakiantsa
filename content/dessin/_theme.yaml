id: dessin
titre: Dessiner
nom: "Le dessin"
# Pour le site vitrine, une phrase pour les parents (tool/build_site.py).
resume: "Dessiner un sujet précis. L'application regarde si elle le reconnaît et dit ce qu'il manque."
icone: "1f3a8"
ages: [3, 10]
# Dessin libre : pour tous les âges, jamais caché par le plancher de classe (ADR 0065).
sans_age: true
# Programme de l'école maternelle, version consolidée, « Arts visuels — Dessiner », p. 26-27. Consulté le 2026-11-03.
sources:
  c1: "https://eduscol.education.gouv.fr/sites/default/files/document/programme-cycle-1-consolide-127565.pdf"
ordre: [dessin-libre]

# Animation de méthode, jouée à la première ouverture du jour (ADR 0033).
intro:
  - texte: "Choisis une couleur."
    images: ["1f3a8"]
  - texte: "Dessine avec ton doigt, sans te presser."
    images: ["270f"]
  - texte: "Ton dessin va dans ton album !"
    images: ["1f4da"]

en:
  titre: "Drawing"
  nom: "Drawing"
  resume: "Draw a particular subject. The app looks to see if it recognises it and says what's missing."
  intro:
    - texte: "Choose a colour."
      images: ["1f3a8"]
    - texte: "Draw with your finger, and take your time."
      images: ["270f"]
    - texte: "Your drawing goes in your album!"
      images: ["1f4da"]
