id: lent-rapide
titre: "Un rythme lent ou rapide"
niveau: GS
prerequis: []
programme: { source: c1, texte: "Après plusieurs écoutes d’un extrait musical, décrire le rythme (lent, rapide)." }
activite: ecouter
# mots : [propriété du son « A », propriété du son « B »] ; la question demande l'un ou l'autre.
parametres: { dimension: tempo, mots: ["rapide", "lent"] }
idee: "Un rythme rapide va vite, comme quand on court. Un rythme lent va doucement."
phrases:
  consigne: "Écoute les deux sons. Tu peux les réécouter. Puis touche la carte du son demandé."
  question: "Quel son est le plus {mot} ?"
  indice: "Un rythme rapide va vite, comme quand on court. Un rythme lent va doucement, comme quand on marche."
  exemple: "Touche « Réécouter » pour entendre encore les deux sons."
  demonstration: "Écoute : le son {rep} est le plus {mot}."
  bravo: "Oui ! Le son {rep} est le plus {mot}."

en:
  mots: ["faster", "slower"]
  titre: "A slow or fast beat"
  idee: "A fast beat goes quickly, like when you run. A slow beat goes gently."
  phrases:
    consigne: "Listen to the two sounds. You can listen again. Then touch the card for the sound I ask for."
    question: "Which sound is {mot}?"
    indice: "A fast beat goes quickly, like when you run. A slow beat goes gently, like when you walk."
    exemple: "Touch “Listen again” to hear the two sounds once more."
    demonstration: "Listen: sound {rep} is {mot}."
    bravo: "Yes! Sound {rep} is {mot}."
