id: aigu-grave
titre: "Un son aigu ou grave"
niveau: MS
prerequis: []
programme: { source: c1, texte: "Reproduire avec sa voix, par imitation, des sons brefs, tenus, graves, aigus et avec des variations de volume." }
activite: ecouter
# mots : [propriété du son « A », propriété du son « B »] ; la question demande l'un ou l'autre.
parametres: { dimension: hauteur, mots: ["aigu", "grave"] }
idee: "Un son aigu est fin, comme un petit oiseau. Un son grave est gros, comme un ours."
phrases:
  consigne: "Écoute les deux sons. Tu peux les réécouter. Puis touche la carte du son demandé."
  question: "Quel son est le plus {mot} ?"
  indice: "Un son aigu est fin, comme un petit oiseau. Un son grave est gros, comme un ours."
  exemple: "Touche « Réécouter » pour entendre encore les deux sons."
  demonstration: "Écoute : le son {rep} est le plus {mot}."
  bravo: "Oui ! Le son {rep} est le plus {mot}."

en:
  mots: ["higher", "lower"]
  titre: "A high or low sound"
  idee: "A high sound is thin, like a little bird. A low sound is deep, like a bear."
  phrases:
    consigne: "Listen to the two sounds. You can listen again. Then touch the card for the sound I ask for."
    question: "Which sound is {mot}?"
    indice: "A high sound is thin, like a little bird. A low sound is deep, like a bear."
    exemple: "Touch “Listen again” to hear the two sounds once more."
    demonstration: "Listen: sound {rep} is {mot}."
    bravo: "Yes! Sound {rep} is {mot}."
