id: fort-doux
titre: "Un son fort ou doux"
niveau: MS
prerequis: []
programme: { source: c1, texte: "Produire le plus de sons différents avec un même instrument à percussion : doux avec la paume de la main, fort avec une mailloche." }
activite: ecouter
# mots : [propriété du son « A », propriété du son « B »] ; la question demande l'un ou l'autre.
parametres: { dimension: intensite, mots: ["fort", "doux"] }
idee: "Un son fort fait beaucoup de bruit. Un son doux est tout léger."
phrases:
  consigne: "Écoute les deux sons. Tu peux les réécouter. Puis touche la carte du son demandé."
  question: "Quel son est le plus {mot} ?"
  indice: "Un son fort fait beaucoup de bruit. Un son doux est tout léger."
  exemple: "Touche « Réécouter » pour entendre encore les deux sons."
  demonstration: "Écoute : le son {rep} est le plus {mot}."
  bravo: "Oui ! Le son {rep} est le plus {mot}."

en:
  mots: ["louder", "softer"]
  titre: "A loud or soft sound"
  idee: "A loud sound makes lots of noise. A soft sound is very gentle."
  phrases:
    consigne: "Listen to the two sounds. You can listen again. Then touch the card for the sound I ask for."
    question: "Which sound is {mot}?"
    indice: "A loud sound makes lots of noise. A soft sound is very gentle."
    exemple: "Touch “Listen again” to hear the two sounds once more."
    demonstration: "Listen: sound {rep} is {mot}."
    bravo: "Yes! Sound {rep} is {mot}."
