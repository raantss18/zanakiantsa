id: roi
titre: "Déplacer le roi"
niveau: GS
prerequis: [dame]
programme: { source: fide, texte: "The king may move by moving to an adjoining square." }
activite: echecs
parametres: { mode: etoiles, piece: k, etoiles: 3 }
idee: "Le roi avance d'une seule case, dans toutes les directions."
phrases:
  consigne: "Le roi avance d'une seule case, dans toutes les directions. Touche la case où il va. Attrape toutes les étoiles."
  question: "Attrape toutes les étoiles avec le roi."
  indice: "Le roi avance d'une seule case, dans toutes les directions. Les points montrent où aller."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde les cases entourées d'or : c'est là que le roi peut aller."
  bravo: "Bravo ! Tu as attrapé toutes les étoiles."

en:
  titre: "Moving the king"
  idee: "The king moves just one square, in any direction."
  phrases:
    consigne: "The king moves just one square, in any direction. Touch the square where he goes. Catch all the stars."
    question: "Catch all the stars with the king."
    indice: "The king moves just one square, in any direction. The dots show where to go."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the squares circled in gold: that's where the king can go."
    bravo: "Well done! You caught all the stars."
