id: tour
titre: "Déplacer la tour"
niveau: GS
prerequis: []
programme: { source: fide, texte: "The rook may move to any square along the file or the rank on which it stands." }
activite: echecs
parametres: { mode: etoiles, piece: r, etoiles: 3 }
idee: "La tour avance tout droit, en ligne ou en colonne, aussi loin qu'elle veut."
phrases:
  consigne: "La tour va tout droit, en ligne ou en colonne, aussi loin qu'elle veut. Touche la case où elle va. Attrape toutes les étoiles."
  question: "Attrape toutes les étoiles avec la tour."
  indice: "La tour avance tout droit, en ligne ou en colonne, aussi loin qu'elle veut. Les points montrent où aller."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde les cases entourées d'or : c'est là que la tour peut aller."
  bravo: "Bravo ! Tu as attrapé toutes les étoiles."

en:
  titre: "Moving the rook"
  idee: "The rook moves straight, along a row or a column, as far as it likes."
  phrases:
    consigne: "The rook goes straight, along a row or a column, as far as it likes. Touch the square where it goes. Catch all the stars."
    question: "Catch all the stars with the rook."
    indice: "The rook moves straight, along a row or a column, as far as it likes. The dots show where to go."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the squares circled in gold: that's where the rook can go."
    bravo: "Well done! You caught all the stars."
