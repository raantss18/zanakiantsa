id: echec-cavalier
titre: "Faire échec avec le cavalier"
niveau: GS
prerequis: [echec-dame]
programme: { source: fide, texte: "3.9.1 : the king is said to be 'in check' if it is attacked by one or more of the opponent's pieces." }
activite: echecs
parametres: { mode: echec, piece: n, etoiles: 3 }
idee: "Le cavalier met en échec en attaquant le roi en forme de L."
phrases:
  consigne: "Le roi est en échec quand une pièce pourrait le prendre au coup suivant. Touche le cavalier, puis la case d'où il attaque le roi noir."
  question: "Joue un coup du cavalier qui met le roi noir en échec."
  indice: "Le cavalier attaque les cases où il pourrait sauter au coup suivant, en forme de L."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde le coup entouré d'or."
  bravo: "Bravo ! Le roi noir est en échec."
