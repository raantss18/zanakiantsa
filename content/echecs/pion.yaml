id: pion
titre: "Déplacer le pion"
niveau: GS
prerequis: [cavalier]
programme: { source: fide, texte: "3.7.1–3.7.2 : the pawn may move forward to the square immediately in front of it on the same file ; on its first move it may advance two squares along the same file, provided that both squares are unoccupied." }
activite: echecs
parametres: { mode: etoiles, piece: p, etoiles: 3 }
idee: "Le pion avance tout droit d'une case. À son premier coup, il peut avancer de deux cases."
phrases:
  consigne: "Le pion avance tout droit d'une case ; à son premier coup, il peut avancer de deux. Touche la case où il va."
  question: "Attrape les étoiles avec le pion."
  indice: "Le pion avance seulement tout droit, jamais en arrière. Les points montrent où aller."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde les cases entourées d'or : c'est là que le pion peut aller."
  bravo: "Bravo ! Tu as attrapé toutes les étoiles."

en:
  titre: "Moving the pawn"
  idee: "The pawn moves straight forward one square. On its first move, it can move forward two squares."
  phrases:
    consigne: "The pawn moves straight forward one square; on its first move, it can move forward two. Touch the square where it goes."
    question: "Catch the stars with the pawn."
    indice: "The pawn only moves straight forward, never backwards. The dots show where to go."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the squares circled in gold: that's where the pawn can go."
    bravo: "Well done! You caught all the stars."
