id: roque
titre: "Le roque : mettre son roi à l'abri"
niveau: CP
prerequis: [mat-tour]
programme: { source: fide, texte: "3.8.2 : castling — a move of the king and either rook of the same colour along the player's first rank." }
activite: probleme
parametres: { theme: roque }
idee: "Le roque, c'est un coup spécial : le roi va de deux cases vers la tour, et la tour saute par-dessus lui. Interdit si le roi ou la tour a déjà bougé, si le roi est en échec, ou s'il traverse une case attaquée."
phrases:
  consigne: "Touche ton roi, puis la case à deux pas de lui, vers la tour. La tour sautera toute seule."
  question: "{texte}"
  indice: "Le roi va de deux cases vers la tour. Il ne traverse jamais une case attaquée."
  exemple: "Regarde bien où le roi et la tour arrivent."
  demonstration: "Regarde : {explication}"
  bravo: "Bravo ! {explication}"
items:
  - texte: "Fais le petit roque, du côté de la tour la plus proche."
    fen: "4k3/8/8/8/8/8/5PPP/4K2R w K - 0 1"
    coups: [e1g1]
    explication: "Le roi va en g1, la tour saute en f1 : le roi est à l'abri derrière ses pions."
  - texte: "Fais le grand roque, du côté de la dame."
    fen: "4k3/8/8/8/8/8/PPP5/R3K3 w Q - 0 1"
    coups: [e1c1]
    explication: "Le roi va en c1, la tour saute en d1."
  - texte: "Un seul roque est permis ici. Lequel ?"
    fen: "4k3/8/8/8/6b1/8/5PPP/R3K2R w KQ - 0 1"
    coups: [e1g1]
    explication: "Le fou noir attaque d1 : le roi ne peut pas la traverser. Le petit roque, lui, est permis."
  - texte: "Un seul roque est permis ici. Lequel ?"
    fen: "4k3/8/8/8/2b5/8/P4PPP/R3K2R w KQ - 0 1"
    coups: [e1c1]
    explication: "Le fou noir attaque f1 : pas de petit roque. Le grand roque, lui, est permis."

en:
  titre: "Castling: keeping your king safe"
  idee: "Castling is a special move: the king moves two squares towards the rook, and the rook jumps over him. You can't castle if the king or the rook has already moved, if the king is in check, or if he crosses an attacked square."
  phrases:
    consigne: "Touch your king, then the square two steps away from him, towards the rook. The rook will jump by itself."
    question: "{texte}"
    indice: "The king moves two squares towards the rook. He never crosses an attacked square."
    exemple: "Look carefully at where the king and the rook end up."
    demonstration: "Look: {explication}"
    bravo: "Well done! {explication}"
  items:
    - texte: "Castle kingside, on the side of the nearest rook."
      fen: "4k3/8/8/8/8/8/5PPP/4K2R w K - 0 1"
      coups: [e1g1]
      explication: "The king goes to g1, the rook jumps to f1: the king is safe behind his pawns."
    - texte: "Castle queenside, on the queen's side."
      fen: "4k3/8/8/8/8/8/PPP5/R3K3 w Q - 0 1"
      coups: [e1c1]
      explication: "The king goes to c1, the rook jumps to d1."
    - texte: "Only one way of castling is allowed here. Which one?"
      fen: "4k3/8/8/8/6b1/8/5PPP/R3K2R w KQ - 0 1"
      coups: [e1g1]
      explication: "The black bishop attacks d1: the king can't cross it. But castling kingside is allowed."
    - texte: "Only one way of castling is allowed here. Which one?"
      fen: "4k3/8/8/8/2b5/8/P4PPP/R3K2R w KQ - 0 1"
      coups: [e1c1]
      explication: "The black bishop attacks f1: no castling kingside. But castling queenside is allowed."
