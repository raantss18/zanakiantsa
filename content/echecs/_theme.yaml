id: echecs
titre: Les échecs — un cours pas à pas
nom: "Les échecs"
# Pour le site vitrine, une phrase pour les parents (tool/build_site.py).
resume: "Les leçons pas à pas, puis de vraies parties contre le robot ou à deux."
icone: "265f"
ages: [5, 12]
# Les échecs se jouent et s'apprennent à tout âge : jamais cachés par le plancher de classe (ADR 0065).
sans_age: true
# Règles officielles : FIDE Laws of Chess (1er janvier 2023), article 3 « The moves of the pieces ». Hors programme
# scolaire : le cours suit l'ordre usuel des initiations (une pièce à la fois, attraper des étoiles), observé sur
# https://lichess.org/learn (idée seulement, aucun code ni dessin repris, CLAUDE.md règle 7).
sources:
  fide: "https://handbook.fide.com/chapter/E012023"
  # Tactiques (fourchette, pièce non protégée, mat du couloir) : pas de programme officiel trouvé (FFE). Chaque
  # position est vérifiée par le moteur de l'app : app/test/problems_test.dart (ADR 0040).
  moteur: "https://github.com/raantss18/zanakiantsa/blob/main/app/test/problems_test.dart"
  # Clouage, enfilade, découverte, double échec, mats de l'escalier et du baiser (thèmes mat, clouage, enfilade,
  # decouverte, double) : positions vérifiées aussi avec python-chess (légalité, coups gagnants = « coups »). Règle du
  # carré : pas de source officielle trouvée ; chaque réponse est calculée par une recherche complète de la course
  # roi contre pion. Articles FIDE cités relus le 2026-11-07.
ordre: [tour, fou, dame, roi, cavalier, pion, pion-prise, prise-tour, prise-cavalier, echec-dame, echec-cavalier, mat-dame, mat-tour, roque, promotion, en-passant, piece-gratuite, fourchette, mat-couloir, mat-escalier, mat-baiser, clouage, enfilade, ouverture, decouverte, double-echec, regle-carre]

# Animation de méthode, jouée à la première ouverture du jour (ADR 0033).
intro:
  - texte: "Chaque pièce a sa façon d'avancer."
    images: ["265f"]
  - texte: "La tour va tout droit, le fou va en biais."
    images: []
    grand: "↕ ↔   ↗"
  - texte: "Les points te montrent où ta pièce peut aller."
    images: ["2b50"]

en:
  titre: "Chess — a step-by-step course"
  nom: "Chess"
  resume: "Step-by-step lessons, then real games against the robot or with a friend."
  intro:
    - texte: "Each piece has its own way of moving."
      images: ["265f"]
    - texte: "The rook goes straight, the bishop goes diagonally."
      images: []
      grand: "↕ ↔   ↗"
    - texte: "The dots show you where your piece can go."
      images: ["2b50"]
