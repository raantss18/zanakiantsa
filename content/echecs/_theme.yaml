id: echecs
titre: Les échecs — un cours pas à pas
nom: "Les échecs"
# Pour le site vitrine, une phrase pour les parents (tool/build_site.py).
resume: "Les leçons pas à pas, puis de vraies parties contre le robot ou à deux."
icone: "265f"
ages: [5, 18]
# Les échecs ne s'apprennent pas à l'école (ADR 0069) : tout débutant, quel que soit son âge, commence par la marche des
# pièces ; « Je sais déjà » saute ce qu'il connaît.
hors_ecole: true
# Les échecs se jouent et s'apprennent à tout âge : jamais cachés par le plancher de classe (ADR 0065).
sans_age: true
# Règles officielles : FIDE Laws of Chess (1er janvier 2023), article 3 « The moves of the pieces ». Hors programme
# scolaire : le cours suit l'ordre usuel des initiations (une pièce à la fois, attraper des étoiles), observé sur
# https://lichess.org/learn (idée seulement, aucun code ni dessin repris, CLAUDE.md règle 7).
sources:
  fide: "https://handbook.fide.com/chapter/E012023"
  # Tactiques (fourchette, pièce non protégée, mat du couloir) : pas de programme officiel trouvé (FFE). Chaque
  # position est vérifiée par le moteur de l'app : app/test/problems_test.dart (ADR 0040).
  moteur: "https://github.com/raantss18/zanakiantsa/blob/main/app/test/problems_test.dart"
  # Clouage, enfilade, découverte, double échec, mats de l'escalier et du baiser (thèmes mat, clouage, enfilade,
  # decouverte, double) : positions vérifiées aussi avec python-chess (légalité, coups gagnants = « coups »). Règle du
  # carré : pas de source officielle trouvée ; chaque réponse est calculée par une recherche complète de la course
  # roi contre pion. Articles FIDE cités relus le 2026-11-07.
  # Collège (2026-11-07) : mat à l'étouffée (thème mat), attaque double de la dame (thème fourchette), déviation (thème
  # deviation : échec, toutes les réponses noires prennent la pièce offerte, puis mat en un ; c'est aussi le seul coup qui
  # force le mat en deux) : légalité et solutions vérifiées avec python-chess 1.11. Roi et tour contre roi : chaque mat et
  # chaque pat cité vérifié avec python-chess ; « le mat se fait au bord » vérifié sur toutes les positions (216 mats).
  # La méthode (la boîte) n'a pas de source officielle : vocabulaire usuel des joueurs.
  # Lycée (2026-11-11) : roi et dame contre roi, opposition, cases clés, pion tour, mauvais fou, règle des 50 coups. Pas
  # de Stockfish ni de python-chess sur le poste : chaque position et chaque réponse ont été calculées par une analyse
  # rétrograde complète (finales R+D/R+T/R+P contre R, et R+F+pion a contre R) qui s'appuie sur le générateur de coups
  # de l'app (app/lib/core/game.dart). Mats les plus longs calculés : 10 coups (dame), 16 coups (tour). Opposition,
  # cases clés, « mauvais fou » : vocabulaire usuel des joueurs, pas de source officielle ; seules les règles (pat 5.2.1,
  # promotion 3.7.3.3, 50 et 75 coups 9.3 et 9.6.2) viennent de la FIDE, relues le 2026-11-11.
ordre: [tour, fou, dame, roi, cavalier, pion, pion-prise, prise-tour, prise-cavalier, echec-dame, echec-cavalier, mat-dame, mat-tour, roque, promotion, en-passant, piece-gratuite, fourchette, mat-couloir, mat-escalier, mat-baiser, clouage, enfilade, ouverture, decouverte, double-echec, regle-carre, finale-tour-roi, mat-etouffee, attaque-double-dame, deviation, finale-dame-roi, opposition, cases-cles, pion-tour, mauvais-fou, cinquante-coups]

