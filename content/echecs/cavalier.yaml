id: cavalier
titre: "Déplacer le cavalier"
niveau: GS
prerequis: [roi]
programme: { source: fide, texte: "The knight may move to one of the squares nearest to that on which it stands but not on the same rank, file or diagonal." }
activite: echecs
parametres: { mode: etoiles, piece: n, etoiles: 3 }
idee: "Le cavalier saute en L : deux cases tout droit, puis une sur le côté. Il saute par-dessus les pièces."
phrases:
  consigne: "Le cavalier saute en L : deux cases tout droit, puis une sur le côté. Touche la case où il va. Attrape toutes les étoiles."
  question: "Attrape toutes les étoiles avec le cavalier."
  indice: "Le cavalier saute en forme de L : deux cases tout droit, puis une case sur le côté. Les points montrent où aller."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde les cases entourées d'or : c'est là que le cavalier peut aller."
  bravo: "Bravo ! Tu as attrapé toutes les étoiles."

en:
  titre: "Moving the knight"
  idee: "The knight jumps in an L: two squares straight, then one to the side. It jumps over other pieces."
  phrases:
    consigne: "The knight jumps in an L: two squares straight, then one to the side. Touch the square where it goes. Catch all the stars."
    question: "Catch all the stars with the knight."
    indice: "The knight jumps in the shape of an L: two squares straight, then one square to the side. The dots show where to go."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the squares circled in gold: that's where the knight can go."
    bravo: "Well done! You caught all the stars."
