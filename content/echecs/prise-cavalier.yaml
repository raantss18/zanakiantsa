id: prise-cavalier
titre: "Prendre avec le cavalier"
niveau: GS
prerequis: [prise-tour]
programme: { source: fide, texte: "3.1.1 : if a piece moves to a square occupied by an opponent's piece the latter is captured and removed. 3.6 : the knight moves in an L." }
activite: echecs
parametres: { mode: prise, piece: n, etoiles: 3 }
idee: "Le cavalier prend en sautant en L, même par-dessus d'autres pièces."
phrases:
  consigne: "Le cavalier saute en L, même par-dessus les pièces. Va sur la case d'un pion noir pour le prendre. Prends-les tous."
  question: "Prends tous les pions noirs avec le cavalier."
  indice: "Le cavalier fait un L : deux cases tout droit, puis une sur le côté."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde les cases entourées d'or : c'est là que le cavalier peut aller."
  bravo: "Bravo ! Tu as pris tous les pions noirs."

en:
  titre: "Capturing with the knight"
  idee: "The knight captures by jumping in an L, even over other pieces."
  phrases:
    consigne: "The knight jumps in an L, even over pieces. Move onto a black pawn's square to capture it. Capture them all."
    question: "Capture all the black pawns with the knight."
    indice: "The knight makes an L: two squares straight, then one to the side."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the squares circled in gold: that's where the knight can go."
    bravo: "Well done! You took all the black pawns."
