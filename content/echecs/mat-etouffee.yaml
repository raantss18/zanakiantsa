id: mat-etouffee
titre: "Le mat à l’étouffée"
niveau: 5e
prerequis: [mat-couloir]
programme: { source: fide, texte: "3.1 : It is not permitted to move a piece to a square occupied by a piece of the same colour." }
activite: probleme
parametres: { theme: mat }
idee: "Le roi noir est entouré de ses propres pièces : elles l’étouffent. Un seul échec de cavalier suffit, car le cavalier saute et on ne peut pas se mettre entre lui et le roi."
phrases:
  consigne: "Le roi noir est collé à ses propres pièces. Trouve le saut du cavalier qui lui fait échec sur une case où personne ne peut le prendre."
  question: "{texte}"
  indice: "Compte les cases autour du roi noir : elles sont toutes occupées par des pièces noires. Cherche la case d’où ton cavalier touche le roi."
  exemple: "Regarde les cases autour du roi noir, puis les sauts de ton cavalier."
  demonstration: "Regarde : {explication}"
  bravo: "Bravo ! {explication}"
items:
  - texte: "Étouffe le roi noir avec ton cavalier !"
    fen: "6rk/6pp/8/6N1/8/8/5PPP/6K1 w - - 0 1"
    coups: [g5f7]
    explication: "Le cavalier saute en f7 : échec. Le roi noir est entouré par sa tour en g8, son pion en g7 et son pion en h7. Il ne peut aller nulle part : mat."
  - texte: "Étouffe le roi noir avec ton cavalier !"
    fen: "kr6/pp6/8/1N6/8/8/PPP5/1K6 w - - 0 1"
    coups: [b5c7]
    explication: "Le cavalier saute en c7 : échec. Le roi noir est entouré par sa tour en b8, son pion en a7 et son pion en b7. Il ne peut aller nulle part : mat."
  - texte: "Étouffe le roi noir avec ton cavalier !"
    fen: "6rk/6pp/3N4/8/8/8/6PP/Q5K1 w - - 0 1"
    coups: [d6f7]
    explication: "Le cavalier saute en f7 : échec. Le roi noir est entouré par sa tour en g8, son pion en g7 et son pion en h7. Il ne peut aller nulle part : mat."
  - texte: "Étouffe le roi noir avec ton cavalier !"
    fen: "kr6/pp6/4N3/8/8/8/5PPP/3R2K1 w - - 0 1"
    coups: [e6c7]
    explication: "Le cavalier saute en c7 : échec. Le roi noir est entouré par sa tour en b8, son pion en a7 et son pion en b7. Il ne peut aller nulle part : mat."
  - texte: "Étouffe le roi noir avec ton cavalier !"
