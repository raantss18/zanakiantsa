en:
  titre: "The smothered mate"
  idee: "The black king is surrounded by its own pieces: they smother it. A single knight check is enough, because the knight jumps and nothing can be put between it and the king."
  phrases:
    consigne: "The black king is stuck against its own pieces. Find the knight jump that checks it on a square where nobody can take the knight."
    question: "{texte}"
    indice: "Count the squares around the black king: they are all taken by black pieces. Look for the square from which your knight touches the king."
    exemple: "Look at the squares around the black king, then at your knight’s jumps."
    demonstration: "Look: {explication}"
    bravo: "Well done! {explication}"
  items:
    - texte: "Smother the black king with your knight!"
      fen: "6rk/6pp/8/6N1/8/8/5PPP/6K1 w - - 0 1"
      coups: [g5f7]
      explication: "The knight jumps to f7: check. The black king is surrounded by its rook on g8, its pawn on g7 and its pawn on h7. It cannot go anywhere: checkmate."
