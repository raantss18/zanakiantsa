      fen: "7k/3n4/8/8/3R4/8/1B6/6K1 w - - 0 1"
      coups: [d4d7]
      explication: "The rook takes the knight on d7. As it moves away, it uncovers the bishop on b2, which gives check: the king has to deal with it, and the capture is won."
    - texte: "Make a discovered check that captures a piece!"
      fen: "7k/8/8/1r6/8/2N5/8/Q5K1 w - - 0 1"
      coups: [c3b5]
      explication: "The knight takes the rook on b5. As it moves away, it uncovers the queen on a1, which gives check: the king has to deal with it, and the capture is won."
    - texte: "Make a discovered check that captures a piece!"
      fen: "8/4q3/8/R1B4k/8/8/8/K7 w - - 0 1"
      coups: [c5e7]
      explication: "The bishop takes the queen on e7. As it moves away, it uncovers the rook on a5, which gives check: the king has to deal with it, and the capture is won."
    - texte: "Make a discovered check that captures a piece!"
      fen: "8/7k/8/3n4/4P3/8/8/1B4K1 w - - 0 1"
      coups: [e4d5]
      explication: "The pawn takes the knight on d5. As it moves away, it uncovers the bishop on b1, which gives check: the king has to deal with it, and the capture is won."
