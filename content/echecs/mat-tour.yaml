id: mat-tour
titre: "Échec et mat avec la tour"
niveau: GS
prerequis: [mat-dame]
programme: { source: fide, texte: "5.1.1 : the game is won by the player who has checkmated his/her opponent's king." }
activite: echecs
parametres: { mode: mat, piece: r, etoiles: 3 }
idee: "La tour attaque toute la rangée du bord. Ton roi garde les cases devant le roi noir : il ne peut plus s'échapper."
phrases:
  consigne: "Échec et mat : le roi noir est attaqué et ne peut aller sur aucune case. Touche ta pièce, puis la case du coup gagnant."
  question: "Trouve le coup qui fait échec et mat."
  indice: "Le roi noir est au bord. Ta tour attaque toute la rangée du bord ; ton roi garde les cases devant lui."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde le coup entouré d'or."
  bravo: "Échec et mat ! Bravo, tu as gagné la partie."

en:
  titre: "Checkmate with the rook"
  idee: "The rook attacks the whole edge row. Your king guards the squares in front of the black king: he can't escape any more."
  phrases:
    consigne: "Checkmate: the black king is attacked and can't go to any square. Touch your piece, then the square for the winning move."
    question: "Find the move that gives checkmate."
    indice: "The black king is on the edge. Your rook attacks the whole edge row; your king guards the squares in front of him."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the move circled in gold."
    bravo: "Checkmate! Well done, you won the game."
