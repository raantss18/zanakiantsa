id: dame
titre: "Déplacer la dame"
niveau: GS
prerequis: [fou]
programme: { source: fide, texte: "The queen may move to any square along the file, the rank or a diagonal on which it stands." }
activite: echecs
parametres: { mode: etoiles, piece: q, etoiles: 3 }
idee: "La dame avance tout droit ou en biais : elle bouge comme la tour et le fou."
phrases:
  consigne: "La dame va tout droit ou en diagonale, aussi loin qu'elle veut. Touche la case où elle va. Attrape toutes les étoiles."
  question: "Attrape toutes les étoiles avec la dame."
  indice: "La dame avance tout droit ou en diagonale, aussi loin qu'elle veut. Les points montrent où aller."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde les cases entourées d'or : c'est là que la dame peut aller."
  bravo: "Bravo ! Tu as attrapé toutes les étoiles."

en:
  titre: "Moving the queen"
  idee: "The queen moves straight or on a slant: she moves like the rook and the bishop."
  phrases:
    consigne: "The queen goes straight or diagonally, as far as she likes. Touch the square where she goes. Catch all the stars."
    question: "Catch all the stars with the queen."
    indice: "The queen moves straight or diagonally, as far as she likes. The dots show where to go."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the squares circled in gold: that's where the queen can go."
    bravo: "Well done! You caught all the stars."
