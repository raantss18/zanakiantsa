id: fou
titre: "Déplacer le fou"
niveau: GS
prerequis: [tour]
programme: { source: fide, texte: "The bishop may move to any square along a diagonal on which it stands." }
activite: echecs
parametres: { mode: etoiles, piece: b, etoiles: 3 }
idee: "Le fou avance en biais, sur sa diagonale, aussi loin qu'il veut."
phrases:
  consigne: "Le fou va en diagonale, aussi loin qu'il veut. Touche la case où il va. Attrape toutes les étoiles."
  question: "Attrape toutes les étoiles avec le fou."
  indice: "Le fou avance en diagonale, en biais, aussi loin qu'il veut. Les points montrent où aller."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde les cases entourées d'or : c'est là que le fou peut aller."
  bravo: "Bravo ! Tu as attrapé toutes les étoiles."

en:
  titre: "Moving the bishop"
  idee: "The bishop moves on a slant, along its diagonal, as far as it likes."
  phrases:
    consigne: "The bishop goes diagonally, as far as it likes. Touch the square where it goes. Catch all the stars."
    question: "Catch all the stars with the bishop."
    indice: "The bishop moves diagonally, on a slant, as far as it likes. The dots show where to go."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the squares circled in gold: that's where the bishop can go."
    bravo: "Well done! You caught all the stars."
