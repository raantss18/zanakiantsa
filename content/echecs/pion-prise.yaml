id: pion-prise
titre: "Le pion prend en diagonale"
niveau: GS
prerequis: [pion]
programme: { source: fide, texte: "3.7.3 : the pawn may move to a square occupied by an opponent's piece diagonally in front of it." }
activite: echecs
parametres: { mode: prise, piece: p, etoiles: 3 }
idee: "Le pion avance tout droit, mais il prend en biais, une case en avant sur le côté."
phrases:
  consigne: "Le pion prend en diagonale, une case en avant sur le côté. Touche le pion noir à prendre."
  question: "Prends les pions noirs avec ton pion."
  indice: "Le pion avance tout droit, mais il prend en biais, vers l'avant."
  exemple: "Touche une case avec un point."
  demonstration: "Regarde les cases entourées d'or : c'est là que le pion peut aller."
  bravo: "Bravo ! Tu as pris tous les pions noirs."

en:
  titre: "The pawn captures diagonally"
  idee: "The pawn moves straight forward, but it captures on a slant, one square forward and to the side."
  phrases:
    consigne: "The pawn captures diagonally, one square forward and to the side. Touch the black pawn to capture."
    question: "Capture the black pawns with your pawn."
    indice: "The pawn moves straight forward, but it captures on a slant, going forwards."
    exemple: "Touch a square with a dot."
    demonstration: "Look at the squares circled in gold: that's where the pawn can go."
    bravo: "Well done! You took all the black pawns."
