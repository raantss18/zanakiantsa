# Phrases communes à toutes les activités (ADR 0006, 0008). Pas de mot « faux » ni « échec ».
phrases:
  encore: "Pas encore. Essaie encore une fois."
  encouragements:
    - "Tu as bien cherché !"
    - "Bravo pour ton effort."
    - "Tu as bien réfléchi !"
    - "Continue comme ça !"
  apres_indice: "Voici un petit indice."
  pas_compris: "Je n'ai pas bien vu ton chiffre. Écris-le encore, bien grand."
  fin_seance: "Bravo, la partie est finie. Ton histoire avance !"
  bienvenue: "Bonjour ! On joue avec les nombres ?"
  nouvel_autocollant: "Bravo ! Tu as gagné un nouvel autocollant pour ton album."
  demande_adulte: "Demande à un adulte de préparer l'application."
  choisis_univers: "Choisis ton monde !"
  # Journée en 3 activités (ADR 0018)
  aujourdhui: "Aujourd'hui, au programme :"
  commence: "Touche la première carte pour commencer."
  pause: "Cette activité est finie ! Fais une pause : bouge un peu et bois de l'eau."
  journee_finie: "Ta journée est finie. Bravo ! À demain !"
# Anglais (ADR 0064) : mêmes clés, même ton ; aucun mot « wrong » ni « fail ».
en:
  phrases:
    encore: "Not yet. Have another go."
    encouragements:
      - "You looked carefully!"
      - "Well done for trying so hard."
      - "Good thinking!"
      - "Keep it up!"
    apres_indice: "Here is a little clue."
    pas_compris: "I couldn't quite see your number. Write it again, nice and big."
    fin_seance: "Well done, the game is over. Your story moves on!"
    bienvenue: "Hello! Shall we play with numbers?"
    nouvel_autocollant: "Well done! You won a new sticker for your album."
    demande_adulte: "Ask a grown-up to set up the app."
    choisis_univers: "Choose your world!"
    aujourdhui: "Today's plan:"
    commence: "Touch the first card to start."
    pause: "This activity is finished! Take a break: move about and drink some water."
    journee_finie: "Your day is finished. Well done! See you tomorrow!"

