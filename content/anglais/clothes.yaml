    indice: "Listen carefully: the word is something we wear or carry."
    exemple: "Look: hat is the hat. Listen to the word again, then touch its picture."
    demonstration: "Look: {texte} is {bonne}."
    bravo: "Yes! {explication}"
    erreur: "That is {choisi}. Listen again: {texte}."
