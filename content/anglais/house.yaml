    indice: "Look at the last word of the sentence: it is the thing in the house."
    exemple: "Look: “I sit on a chair”. The word chair is the chair."
    demonstration: "Look: {texte} That is {bonne}."
    bravo: "Yes! {explication}"
    erreur: "That is {choisi}. Listen again: {texte}"
  items:
