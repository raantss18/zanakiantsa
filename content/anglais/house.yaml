      bonne: ["1fa91", "the chair"]
      autres: [["1f6cf", "the bed"], ["1f4fa", "the television"]]
      explication: "chair — well done!"
    - texte: "I have a shower."
      bonne: ["1f6bf", "the shower"]
      autres: [["1f6aa", "the door"], ["1f4bb", "the computer"]]
      explication: "shower — well done!"
    - texte: "I watch television."
      bonne: ["1f4fa", "the television"]
      autres: [["1f4bb", "the computer"], ["1fa9e", "the mirror"]]
      explication: "television — well done!"
    - texte: "I play on the computer."
      bonne: ["1f4bb", "the computer"]
      autres: [["1f4fa", "the television"], ["1f3e0", "the house"]]
      explication: "computer — well done!"
    - texte: "I look in the mirror."
      bonne: ["1fa9e", "the mirror"]
      autres: [["1f6bf", "the shower"], ["1f6aa", "the door"]]
      explication: "mirror — well done!"
