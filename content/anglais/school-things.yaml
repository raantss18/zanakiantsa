    question: "Touch: {texte}."
    indice: "Listen to the last word: it is the name of the thing."
    exemple: "An example: “It's a ruler.” Listen to the sentence again, then try another picture."
    demonstration: "Look: {texte} is {bonne}."
    bravo: "Yes! {explication}"
    erreur: "That is {choisi}. Listen again: {texte}."
  items:
    - texte: "It's a school bag"
      bonne: ["1f392", "the school bag"]
      autres: [["1f4d6", "the book"], ["1fa91", "the chair"]]
      explication: "It's a school bag — well done!"
    - texte: "It's a book"
      bonne: ["1f4d6", "the book"]
      autres: [["1f4d4", "the notebook"], ["270f", "the pencil"]]
