    - texte: "It's a notebook"
      bonne: ["1f4d4", "the notebook"]
      autres: [["1f4bb", "the computer"], ["1f4d6", "the book"]]
      explication: "It's a notebook — well done!"
    - texte: "It's a computer"
      bonne: ["1f4bb", "the computer"]
      autres: [["1f6aa", "the door"], ["1f4d4", "the notebook"]]
      explication: "It's a computer — well done!"
    - texte: "It's a chair"
      bonne: ["1fa91", "the chair"]
      autres: [["1f392", "the school bag"], ["1f6aa", "the door"]]
      explication: "It's a chair — well done!"
    - texte: "It's the door"
      bonne: ["1f6aa", "the door"]
      autres: [["1fa91", "the chair"], ["1f4bb", "the computer"]]
      explication: "It's the door — well done!"
    - texte: "They're my paints"
