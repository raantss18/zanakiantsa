id: colours
titre: "Les couleurs en anglais"
niveau: CP
prerequis: []
programme: { source: lver, texte: "Reconnaître des mots simples en s’appuyant sur les indices visuels ; exemple cité : les goûts, couleurs préférées." }
activite: choisir
# Les mots entre « » sont dits par la voix anglaise (ADR 0022).
parametres: { langue: en }
phrases:
  consigne: "Écoute le mot anglais et touche la bonne couleur."
  question: "Touche : « {texte} »."
  indice: "Écoute bien le mot anglais : il dit une couleur."
  exemple: "Écoute encore le mot anglais, puis essaie une autre image."
  demonstration: "Regarde : « {texte} », c'est {bonne}."
  bravo: "Oui ! {explication}"
  erreur: "Ça, c'est {choisi}. Écoute encore : « {texte} »."
items:
  - texte: "red"
    bonne: ["1f534", "rouge"]
    autres: [["1f7e1", "jaune"], ["1f7e2", "vert"]]
    explication: "« red », c'est rouge."
  - texte: "blue"
    bonne: ["1f535", "bleu"]
    autres: [["1f7e0", "orange"], ["26ab", "noir"]]
    explication: "« blue », c'est bleu."
  - texte: "green"
    bonne: ["1f7e2", "vert"]
    autres: [["1f534", "rouge"], ["26aa", "blanc"]]
    explication: "« green », c'est vert."
  - texte: "yellow"
    bonne: ["1f7e1", "jaune"]
    autres: [["26aa", "blanc"], ["1f7e3", "violet"]]
    explication: "« yellow », c'est jaune."
  - texte: "orange"
    bonne: ["1f7e0", "orange"]
    autres: [["1f534", "rouge"], ["1f7e2", "vert"]]
    explication: "« orange », c'est orange."
  - texte: "purple"
    bonne: ["1f7e3", "violet"]
    autres: [["1f7e0", "orange"], ["1f534", "rouge"]]
    explication: "« purple », c'est violet."
  - texte: "black"
    bonne: ["26ab", "noir"]
    autres: [["1f7e0", "orange"], ["1f535", "bleu"]]
    explication: "« black », c'est noir."
  - texte: "white"
    bonne: ["26aa", "blanc"]
    autres: [["1f534", "rouge"], ["26ab", "noir"]]
    explication: "« white », c'est blanc."
en:
  titre: "Colours in English"
  phrases:
    consigne: "Listen to the word and touch the right colour."
    question: "Touch: {texte}."
    indice: "Listen carefully: the word is a colour."
    exemple: "Listen to the word again, then try another picture."
    demonstration: "Look: {texte} is {bonne}."
    bravo: "Yes! {explication}"
    erreur: "That is {choisi}. Listen again: {texte}."
  items:
    - texte: "red"
      bonne: ["1f534", "red"]
      autres: [["1f7e1", "yellow"], ["1f7e2", "green"]]
      explication: "red — well done!"
    - texte: "blue"
      bonne: ["1f535", "blue"]
      autres: [["1f7e0", "orange"], ["26ab", "black"]]
      explication: "blue — well done!"
    - texte: "green"
      bonne: ["1f7e2", "green"]
      autres: [["1f534", "red"], ["26aa", "white"]]
      explication: "green — well done!"
    - texte: "yellow"
      bonne: ["1f7e1", "yellow"]
      autres: [["26aa", "white"], ["1f7e3", "purple"]]
      explication: "yellow — well done!"
    - texte: "orange"
      bonne: ["1f7e0", "orange"]
      autres: [["1f534", "red"], ["1f7e2", "green"]]
      explication: "orange — well done!"
    - texte: "purple"
      bonne: ["1f7e3", "purple"]
      autres: [["1f7e0", "orange"], ["1f534", "red"]]
      explication: "purple — well done!"
    - texte: "black"
      bonne: ["26ab", "black"]
      autres: [["1f7e0", "orange"], ["1f535", "blue"]]
      explication: "black — well done!"
    - texte: "white"
      bonne: ["26aa", "white"]
      autres: [["1f534", "red"], ["26ab", "black"]]
      explication: "white — well done!"
