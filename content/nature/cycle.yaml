id: cycle
titre: Les étapes de la vie
niveau: GS
prerequis: [oeufs]
programme: { source: c1, texte: "Nommer et ordonner les étapes du cycle de vie d’une plante ou d’un animal (naissance, éclosion, germination – larve, nymphe, métamorphose, etc.)." }
activite: choisir
parametres: {}
idee: "Les êtres vivants grandissent et changent : l'œuf devient poussin, la graine devient plante."
phrases:
  consigne: "Écoute la question, puis touche la bonne image."
  question: "{texte}"
  indice: "Pense à ce qui se passe quand on grandit."
  exemple: "Essaie une autre image."
  demonstration: "Regarde : c'est {bonne}. {explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "D'où sort le poussin ?"
    bonne: ["1f95a", "l'œuf"]
    autres: [["1fad8", "la graine"], ["1f41b", "la chenille"]]
    explication: "Le poussin sort de l'œuf : c'est l'éclosion."
  - texte: "Que devient le poussin en grandissant ?"
    bonne: ["1f414", "la poule"]
    autres: [["1f98b", "le papillon"], ["1f41f", "le poisson"]]
    explication: "Le poussin devient une poule ou un coq."
  - texte: "Que devient la chenille ?"
    bonne: ["1f98b", "le papillon"]
    autres: [["1f40c", "l'escargot"], ["1f426", "l'oiseau"]]
    explication: "La chenille se transforme en papillon : c'est la métamorphose."
  - texte: "Qu'est-ce qui sort de la graine dans la terre ?"
    bonne: ["1f331", "la pousse"]
    autres: [["1f423", "le poussin"], ["1f41b", "la chenille"]]
    explication: "La graine germe et une petite pousse sort."
  - texte: "Que devient la petite pousse ?"
    bonne: ["1fab4", "la plante"]
    autres: [["1f95a", "l'œuf"], ["1f41b", "la chenille"]]
    explication: "En grandissant, la pousse devient une plante."
  - texte: "Avant le papillon, qu'y avait-il ?"
    bonne: ["1f41b", "la chenille"]
    autres: [["1f95a", "l'œuf de poule"], ["1f331", "la pousse"]]
    explication: "Avant d'être papillon, il était chenille."
  - texte: "Que devient l'œuf de la poule s'il est couvé ?"
    bonne: ["1f423", "le poussin"]
    autres: [["1f98b", "le papillon"], ["1f331", "la pousse"]]
    explication: "Le poussin sort de l'œuf couvé."
  - texte: "Que devient la fleur du pommier ?"
    bonne: ["1f34e", "la pomme"]
    autres: [["1f41b", "la chenille"], ["1f95a", "l'œuf"]]
    explication: "La fleur du pommier devient une pomme."
  - texte: "Qu'est-ce qu'on plante pour avoir un haricot ?"
    bonne: ["1fad8", "la graine"]
    autres: [["1f95a", "l'œuf"], ["1f41b", "la chenille"]]
    explication: "On plante une graine de haricot."

en:
  titre: "The stages of life"
  idee: "Living things grow and change: an egg becomes a chick, a seed becomes a plant."
  phrases:
    consigne: "Listen to the question, then touch the right picture."
    question: "{texte}"
    indice: "Think about what happens when you grow up."
    exemple: "Try another picture."
    demonstration: "Look: it's {bonne}. {explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Where does a chick come out of?"
      bonne: ["1f95a", "an egg"]
      autres: [["1fad8", "a seed"], ["1f41b", "a caterpillar"]]
      explication: "The chick comes out of the egg: it hatches."
    - texte: "What does a chick become when it grows up?"
      bonne: ["1f414", "a hen"]
      autres: [["1f98b", "a butterfly"], ["1f41f", "a fish"]]
      explication: "A chick grows into a hen or a cockerel."
    - texte: "What does a caterpillar become?"
      bonne: ["1f98b", "a butterfly"]
      autres: [["1f40c", "a snail"], ["1f426", "a bird"]]
      explication: "A caterpillar changes into a butterfly: it's called metamorphosis."
    - texte: "What comes out of a seed in the soil?"
      bonne: ["1f331", "a shoot"]
      autres: [["1f423", "a chick"], ["1f41b", "a caterpillar"]]
      explication: "The seed sprouts and a little shoot comes out."
    - texte: "What does the little shoot become?"
      bonne: ["1fab4", "a plant"]
      autres: [["1f95a", "an egg"], ["1f41b", "a caterpillar"]]
      explication: "As it grows, the shoot becomes a plant."
    - texte: "Before the butterfly, what was there?"
      bonne: ["1f41b", "a caterpillar"]
      autres: [["1f95a", "a hen's egg"], ["1f331", "a shoot"]]
      explication: "Before it was a butterfly, it was a caterpillar."
    - texte: "What does a hen's egg become if she sits on it?"
      bonne: ["1f423", "a chick"]
      autres: [["1f98b", "a butterfly"], ["1f331", "a shoot"]]
      explication: "A chick comes out of the warm egg."
    - texte: "What does an apple blossom become?"
      bonne: ["1f34e", "an apple"]
      autres: [["1f41b", "a caterpillar"], ["1f95a", "an egg"]]
      explication: "The apple tree's flower becomes an apple."
    - texte: "What do we plant to grow a bean?"
      bonne: ["1fad8", "a seed"]
      autres: [["1f95a", "an egg"], ["1f41b", "a caterpillar"]]
      explication: "We plant a bean seed."
