id: oeufs
titre: Pondre des œufs ou porter son petit
niveau: MS
prerequis: []
programme: { source: c1, texte: "Citer plusieurs espèces d’animaux qui pondent des œufs et d’autres espèces qui portent leur petit." }
activite: choisir
parametres: {}
idee: "Certains animaux pondent des œufs. D'autres portent leur petit dans leur ventre."
phrases:
  consigne: "Écoute la question, puis touche le bon animal."
  question: "{texte}"
  indice: "Pense aux animaux de la ferme et à leurs bébés."
  exemple: "Essaie un autre animal."
  demonstration: "Regarde : c'est {bonne}. {explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Qui pond des œufs ?"
    bonne: ["1f414", "la poule"]
    autres: [["1f404", "la vache"], ["1f408", "le chat"]]
    explication: "La poule pond des œufs."
  - texte: "Qui pond des œufs ?"
    bonne: ["1f422", "la tortue"]
    autres: [["1f415", "le chien"], ["1f40e", "le cheval"]]
    explication: "La tortue pond des œufs."
  - texte: "Qui pond des œufs ?"
    bonne: ["1f986", "le canard"]
    autres: [["1f411", "le mouton"], ["1f407", "le lapin"]]
    explication: "La cane, la maman canard, pond des œufs."
  - texte: "Qui porte son petit dans son ventre ?"
    bonne: ["1f404", "la vache"]
    autres: [["1f414", "la poule"], ["1f422", "la tortue"]]
    explication: "La vache porte son veau dans son ventre."
  - texte: "Qui porte son petit dans son ventre ?"
    bonne: ["1f408", "le chat"]
    autres: [["1f986", "le canard"], ["1f40a", "le crocodile"]]
    explication: "La chatte porte ses chatons dans son ventre."
  - texte: "Qui pond des œufs ?"
    bonne: ["1f426", "l'oiseau"]
    autres: [["1f415", "le chien"], ["1f404", "la vache"]]
    explication: "Les oiseaux pondent des œufs."
  - texte: "Qui pond des œufs ?"
    bonne: ["1f40a", "le crocodile"]
    autres: [["1f411", "le mouton"], ["1f407", "le lapin"]]
    explication: "Le crocodile pond des œufs."
  - texte: "Qui pond des œufs ?"
    bonne: ["1f438", "la grenouille"]
    autres: [["1f408", "le chat"], ["1f40e", "le cheval"]]
    explication: "La grenouille pond des œufs dans l'eau."
  - texte: "Qui pond des œufs ?"
    bonne: ["1f98b", "le papillon"]
    autres: [["1f415", "le chien"], ["1f411", "le mouton"]]
    explication: "Le papillon pond des œufs."
  - texte: "Qui porte son petit dans son ventre ?"
    bonne: ["1f40e", "le cheval"]
    autres: [["1f414", "la poule"], ["1f40a", "le crocodile"]]
    explication: "La jument porte son poulain dans son ventre."
  - texte: "Qui porte son petit dans son ventre ?"
    bonne: ["1f415", "le chien"]
    autres: [["1f422", "la tortue"], ["1f426", "l'oiseau"]]
    explication: "La chienne porte ses chiots dans son ventre."
  - texte: "Qui porte son petit dans son ventre ?"
    bonne: ["1f411", "le mouton"]
    autres: [["1f438", "la grenouille"], ["1f414", "la poule"]]
    explication: "La brebis porte son agneau dans son ventre."

