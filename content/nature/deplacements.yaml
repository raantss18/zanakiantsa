id: deplacements
titre: Comment se déplacent les animaux
niveau: MS
prerequis: []
programme: { source: c1, texte: "Savoir dire si un animal vole, marche, rampe, saute, grimpe, court ou nage." }
activite: choisir
parametres: {}
idee: "Les animaux se déplacent de façons différentes : ils volent, nagent, rampent, sautent, grimpent ou courent."
phrases:
  consigne: "Écoute la question, puis touche le bon animal."
  question: "{texte}"
  indice: "Regarde bien : a-t-il des ailes, des nageoires, des pattes ?"
  exemple: "Essaie un autre animal."
  demonstration: "Regarde : c'est {bonne}. {explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Qui vole avec ses ailes ?"
    bonne: ["1f426", "l'oiseau"]
    autres: [["1f40c", "l'escargot"], ["1f41f", "le poisson"]]
    explication: "L'oiseau vole avec ses ailes."
  - texte: "Qui nage avec ses nageoires ?"
    bonne: ["1f41f", "le poisson"]
    autres: [["1f98b", "le papillon"], ["1f40c", "l'escargot"]]
    explication: "Le poisson nage avec ses nageoires."
  - texte: "Qui rampe sur le sol ?"
    bonne: ["1f40c", "l'escargot"]
    autres: [["1f426", "l'oiseau"], ["1f40e", "le cheval"]]
    explication: "L'escargot rampe, il n'a pas de pattes."
  - texte: "Qui fait de grands sauts ?"
    bonne: ["1f998", "le kangourou"]
    autres: [["1f40c", "l'escargot"], ["1f40d", "le serpent"]]
    explication: "Le kangourou saute avec ses grandes pattes arrière."
  - texte: "Qui grimpe aux arbres ?"
    bonne: ["1f412", "le singe"]
    autres: [["1f41f", "le poisson"], ["1f40e", "le cheval"]]
    explication: "Le singe grimpe avec ses mains et ses pieds."
  - texte: "Qui court vite sur ses quatre pattes ?"
    bonne: ["1f40e", "le cheval"]
    autres: [["1f41f", "le poisson"], ["1f40c", "l'escargot"]]
    explication: "Le cheval court vite sur ses quatre pattes."
  - texte: "Qui vole de fleur en fleur ?"
    bonne: ["1f98b", "le papillon"]
    autres: [["1f40c", "l'escargot"], ["1f41f", "le poisson"]]
    explication: "Le papillon vole avec ses ailes."
  - texte: "Qui nage dans la rivière ?"
    bonne: ["1f40a", "le crocodile"]
    autres: [["1f40c", "l'escargot"], ["1f98b", "le papillon"]]
    explication: "Le crocodile nage avec sa queue et ses pattes."
  - texte: "Qui rampe sans pattes ?"
    bonne: ["1f40d", "le serpent"]
    autres: [["1f426", "l'oiseau"], ["1f40e", "le cheval"]]
    explication: "Le serpent rampe : il n'a pas de pattes."
  - texte: "Qui saute avec ses longues pattes arrière ?"
    bonne: ["1f438", "la grenouille"]
    autres: [["1f40c", "l'escargot"], ["1f40d", "le serpent"]]
    explication: "La grenouille saute avec ses longues pattes arrière."
  - texte: "Qui vole et fait du miel ?"
    bonne: ["1f41d", "l'abeille"]
    autres: [["1f40c", "l'escargot"], ["1f41f", "le poisson"]]
    explication: "L'abeille vole avec ses ailes."
  - texte: "Qui marche lentement avec sa carapace ?"
    bonne: ["1f422", "la tortue"]
    autres: [["1f426", "l'oiseau"], ["1f41f", "le poisson"]]
    explication: "La tortue marche lentement, sa carapace sur le dos."

en:
  titre: "How animals move"
  idee: "Animals move in different ways: they fly, swim, crawl, jump, climb or run."
  phrases:
    consigne: "Listen to the question, then touch the right animal."
    question: "{texte}"
    indice: "Look carefully: does it have wings, fins or legs?"
    exemple: "Try another animal."
    demonstration: "Look: it's {bonne}. {explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Who flies with its wings?"
      bonne: ["1f426", "the bird"]
      autres: [["1f40c", "the snail"], ["1f41f", "the fish"]]
      explication: "The bird flies with its wings."
    - texte: "Who swims with its fins?"
      bonne: ["1f41f", "the fish"]
      autres: [["1f98b", "the butterfly"], ["1f40c", "the snail"]]
      explication: "The fish swims with its fins."
    - texte: "Who crawls along the ground?"
      bonne: ["1f40c", "the snail"]
      autres: [["1f426", "the bird"], ["1f40e", "the horse"]]
      explication: "The snail crawls: it has no legs."
    - texte: "Who makes big jumps?"
      bonne: ["1f998", "the kangaroo"]
      autres: [["1f40c", "the snail"], ["1f40d", "the snake"]]
      explication: "The kangaroo jumps with its big back legs."
    - texte: "Who climbs trees?"
      bonne: ["1f412", "the monkey"]
      autres: [["1f41f", "the fish"], ["1f40e", "the horse"]]
      explication: "The monkey climbs with its hands and feet."
    - texte: "Who runs fast on four legs?"
      bonne: ["1f40e", "the horse"]
      autres: [["1f41f", "the fish"], ["1f40c", "the snail"]]
      explication: "The horse runs fast on its four legs."
    - texte: "Who flies from flower to flower?"
      bonne: ["1f98b", "the butterfly"]
      autres: [["1f40c", "the snail"], ["1f41f", "the fish"]]
      explication: "The butterfly flies with its wings."
    - texte: "Who swims in the river?"
      bonne: ["1f40a", "the crocodile"]
      autres: [["1f40c", "the snail"], ["1f98b", "the butterfly"]]
      explication: "The crocodile swims with its tail and legs."
    - texte: "Who crawls with no legs?"
      bonne: ["1f40d", "the snake"]
      autres: [["1f426", "the bird"], ["1f40e", "the horse"]]
      explication: "The snake crawls: it has no legs."
    - texte: "Who jumps with its long back legs?"
      bonne: ["1f438", "the frog"]
      autres: [["1f40c", "the snail"], ["1f40d", "the snake"]]
      explication: "The frog jumps with its long back legs."
    - texte: "Who flies and makes honey?"
      bonne: ["1f41d", "the bee"]
      autres: [["1f40c", "the snail"], ["1f41f", "the fish"]]
      explication: "The bee flies with its wings."
    - texte: "Who walks slowly with its shell?"
      bonne: ["1f422", "the tortoise"]
      autres: [["1f426", "the bird"], ["1f41f", "the fish"]]
      explication: "The tortoise walks slowly, with its shell on its back."
