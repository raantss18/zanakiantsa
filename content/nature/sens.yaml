id: sens
titre: Les cinq sens
niveau: MS
prerequis: []
programme: { source: c1, texte: "Associer les yeux et la vue, le nez et l’odorat, la langue et le gout, la peau et le toucher, l’oreille et l’audition." }
activite: choisir
parametres: {}
idee: "Nous avons cinq sens : la vue, l'ouïe, l'odorat, le goût et le toucher. Chacun a sa partie du corps."
phrases:
  consigne: "Écoute la question, puis touche la bonne image."
  question: "{texte}"
  indice: "Pense à ton corps : quelle partie fait cela ?"
  exemple: "Essaie une autre image."
  demonstration: "Regarde : c'est {bonne}. {explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Avec quoi voit-on ?"
    bonne: ["1f441", "l'œil"]
    autres: [["1f442", "l'oreille"], ["1f445", "la langue"]]
    explication: "On voit avec les yeux."
  - texte: "Avec quoi entend-on ?"
    bonne: ["1f442", "l'oreille"]
    autres: [["1f443", "le nez"], ["1f441", "l'œil"]]
    explication: "On entend avec les oreilles."
  - texte: "Avec quoi sent-on les odeurs ?"
    bonne: ["1f443", "le nez"]
    autres: [["270b", "la main"], ["1f442", "l'oreille"]]
    explication: "On sent les odeurs avec le nez."
  - texte: "Avec quoi goûte-t-on ?"
    bonne: ["1f445", "la langue"]
    autres: [["1f441", "l'œil"], ["1f443", "le nez"]]
    explication: "On goûte avec la langue."
  - texte: "Avec quoi touche-t-on ?"
    bonne: ["270b", "la main"]
    autres: [["1f442", "l'oreille"], ["1f441", "l'œil"]]
    explication: "On touche avec la peau, par exemple celle des mains."
  - texte: "Avec quoi sens-tu le parfum d'une fleur ?"
    bonne: ["1f443", "le nez"]
    autres: [["270b", "la main"], ["1f442", "l'oreille"]]
    explication: "On sent les odeurs avec le nez."
  - texte: "Avec quoi entends-tu la musique ?"
    bonne: ["1f442", "l'oreille"]
    autres: [["1f441", "l'œil"], ["1f445", "la langue"]]
    explication: "On entend avec les oreilles."
  - texte: "Avec quoi vois-tu les couleurs ?"
    bonne: ["1f441", "l'œil"]
    autres: [["1f443", "le nez"], ["270b", "la main"]]
    explication: "On voit avec les yeux."
  - texte: "Avec quoi sens-tu que l'eau est chaude ?"
    bonne: ["270b", "la main"]
    autres: [["1f442", "l'oreille"], ["1f441", "l'œil"]]
    explication: "On sent le chaud et le froid avec la peau."
  - texte: "Avec quoi sens-tu que le gâteau est sucré ?"
    bonne: ["1f445", "la langue"]
    autres: [["1f442", "l'oreille"], ["270b", "la main"]]
    explication: "On goûte avec la langue."
  - texte: "Avec quoi regardes-tu un livre ?"
    bonne: ["1f441", "l'œil"]
    autres: [["1f445", "la langue"], ["1f442", "l'oreille"]]
    explication: "On voit avec les yeux."
  - texte: "Avec quoi écoutes-tu une histoire ?"
    bonne: ["1f442", "l'oreille"]
    autres: [["1f443", "le nez"], ["270b", "la main"]]
    explication: "On entend avec les oreilles."
  - texte: "Avec quoi sens-tu qu'un tissu est doux ?"
    bonne: ["270b", "la main"]
    autres: [["1f441", "l'œil"], ["1f443", "le nez"]]
    explication: "On touche avec la peau, par exemple celle des mains."
  - texte: "Avec quoi reconnais-tu l'odeur du pain ?"
    bonne: ["1f443", "le nez"]
    autres: [["1f445", "la langue"], ["1f441", "l'œil"]]
    explication: "On sent les odeurs avec le nez."
  - texte: "Avec quoi sens-tu que le citron est acide ?"
    bonne: ["1f445", "la langue"]
    autres: [["1f443", "le nez"], ["1f442", "l'oreille"]]
    explication: "On goûte avec la langue."

en:
  titre: "The five senses"
  idee: "We have five senses: sight, hearing, smell, taste and touch. Each one has its own part of the body."
  phrases:
    consigne: "Listen to the question, then touch the right picture."
    question: "{texte}"
    indice: "Think about your body: which part does that?"
    exemple: "Try another picture."
    demonstration: "Look: it's {bonne}. {explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "What do we see with?"
      bonne: ["1f441", "the eye"]
      autres: [["1f442", "the ear"], ["1f445", "the tongue"]]
      explication: "We see with our eyes."
    - texte: "What do we hear with?"
      bonne: ["1f442", "the ear"]
      autres: [["1f443", "the nose"], ["1f441", "the eye"]]
      explication: "We hear with our ears."
    - texte: "What do we smell with?"
      bonne: ["1f443", "the nose"]
      autres: [["270b", "the hand"], ["1f442", "the ear"]]
      explication: "We smell with our nose."
    - texte: "What do we taste with?"
      bonne: ["1f445", "the tongue"]
      autres: [["1f441", "the eye"], ["1f443", "the nose"]]
      explication: "We taste with our tongue."
    - texte: "What do we touch with?"
      bonne: ["270b", "the hand"]
      autres: [["1f442", "the ear"], ["1f441", "the eye"]]
      explication: "We touch with our skin, like the skin on our hands."
    - texte: "What do you use to smell a flower?"
      bonne: ["1f443", "the nose"]
      autres: [["270b", "the hand"], ["1f442", "the ear"]]
      explication: "We smell with our nose."
    - texte: "What do you use to hear music?"
      bonne: ["1f442", "the ear"]
      autres: [["1f441", "the eye"], ["1f445", "the tongue"]]
      explication: "We hear with our ears."
    - texte: "What do you use to see colours?"
      bonne: ["1f441", "the eye"]
      autres: [["1f443", "the nose"], ["270b", "the hand"]]
      explication: "We see with our eyes."
    - texte: "What do you use to feel that the water is hot?"
      bonne: ["270b", "the hand"]
      autres: [["1f442", "the ear"], ["1f441", "the eye"]]
      explication: "We feel hot and cold with our skin."
    - texte: "What do you use to tell that the cake is sweet?"
      bonne: ["1f445", "the tongue"]
      autres: [["1f442", "the ear"], ["270b", "the hand"]]
      explication: "We taste with our tongue."
    - texte: "What do you use to look at a book?"
      bonne: ["1f441", "the eye"]
      autres: [["1f445", "the tongue"], ["1f442", "the ear"]]
      explication: "We see with our eyes."
    - texte: "What do you use to listen to a story?"
      bonne: ["1f442", "the ear"]
      autres: [["1f443", "the nose"], ["270b", "the hand"]]
      explication: "We hear with our ears."
    - texte: "What do you use to feel that a fabric is soft?"
      bonne: ["270b", "the hand"]
      autres: [["1f441", "the eye"], ["1f443", "the nose"]]
      explication: "We touch with our skin, like the skin on our hands."
    - texte: "What do you use to recognise the smell of bread?"
      bonne: ["1f443", "the nose"]
      autres: [["1f445", "the tongue"], ["1f441", "the eye"]]
      explication: "We smell with our nose."
    - texte: "What do you use to tell that a lemon is sour?"
      bonne: ["1f445", "the tongue"]
      autres: [["1f443", "the nose"], ["1f442", "the ear"]]
      explication: "We taste with our tongue."
