id: etats-eau
titre: "L'eau liquide et l'eau solide"
niveau: CP
prerequis: [besoins]
programme: { source: c2, texte: "Reconnaître et nommer les trois états physiques de l'eau et leur manifestation dans divers phénomènes naturels et dans la vie courante." }
activite: choisir
parametres: {}
idee: "L'eau coule quand elle est liquide : la pluie, la mer, la douche. Quand il fait très froid, elle devient solide : la glace, la neige."
phrases:
  consigne: "Écoute la question, puis touche la bonne image."
  question: "{texte}"
  indice: "L'eau liquide coule. L'eau solide est dure et froide : on peut la tenir dans la main."
  exemple: "Essaie une autre image."
  demonstration: "Regarde : c'est {bonne}. {explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Où l'eau est-elle solide ?"
    bonne: ["1f9ca", "le glaçon"]
    autres: [["1f327", "la pluie"], ["1f30a", "la mer"]]
    explication: "Le glaçon, c'est de l'eau solide : de la glace."
  - texte: "Où l'eau est-elle liquide ?"
    bonne: ["1f327", "la pluie"]
    autres: [["1f9ca", "le glaçon"], ["2744", "le flocon de neige"]]
    explication: "La pluie, c'est de l'eau liquide qui tombe des nuages."
  - texte: "Qu'est-ce qui est de l'eau solide ?"
    bonne: ["2744", "le flocon de neige"]
    autres: [["1f4a7", "la goutte d'eau"], ["1f6bf", "la douche"]]
    explication: "La neige, c'est de l'eau solide."
  - texte: "Qu'est-ce qui est de l'eau liquide ?"
    bonne: ["1f30a", "la mer"]
    autres: [["2603", "le bonhomme de neige"], ["1f9ca", "le glaçon"]]
    explication: "L'eau de la mer est liquide : elle bouge et fait des vagues."
  - texte: "Qui est fait d'eau solide ?"
    bonne: ["2603", "le bonhomme de neige"]
    autres: [["1f6bf", "la douche"], ["1f4a7", "la goutte d'eau"]]
    explication: "Le bonhomme de neige est fait de neige : de l'eau solide."
  - texte: "Où trouve-t-on de la glace et de la neige, même l'été ?"
    bonne: ["1f3d4", "en haut des hautes montagnes"]
    autres: [["1f6bf", "dans la douche"], ["1f327", "dans la pluie"]]
    explication: "Là-haut, il fait si froid que la glace reste toute l'année."
  - texte: "D'où tombe la pluie ?"
    bonne: ["2601", "du nuage"]
    autres: [["2600", "du soleil"], ["1f3d4", "de la montagne"]]
    explication: "La pluie tombe des nuages."
  - texte: "Quelle eau coule pour te laver ?"
    bonne: ["1f6bf", "la douche"]
    autres: [["1f9ca", "le glaçon"], ["2744", "le flocon de neige"]]
    explication: "L'eau de la douche est liquide : elle coule."

en:
  titre: "Liquid water and solid water"
  idee: "When water is liquid, it flows: rain, the sea, the shower. When it is very cold, water turns solid: ice, snow."
  phrases:
    consigne: "Listen to the question, then touch the right picture."
    question: "{texte}"
    indice: "Liquid water flows. Solid water is hard and cold: you can hold it in your hand."
    exemple: "Try another picture."
    demonstration: "Look: it's {bonne}. {explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Where is the water solid?"
      bonne: ["1f9ca", "the ice cube"]
      autres: [["1f327", "the rain"], ["1f30a", "the sea"]]
      explication: "An ice cube is solid water: ice."
    - texte: "Where is the water liquid?"
      bonne: ["1f327", "the rain"]
      autres: [["1f9ca", "the ice cube"], ["2744", "the snowflake"]]
      explication: "Rain is liquid water falling from the clouds."
    - texte: "Which one is solid water?"
      bonne: ["2744", "the snowflake"]
      autres: [["1f4a7", "the drop of water"], ["1f6bf", "the shower"]]
      explication: "Snow is solid water."
    - texte: "Which one is liquid water?"
      bonne: ["1f30a", "the sea"]
      autres: [["2603", "the snowman"], ["1f9ca", "the ice cube"]]
      explication: "Sea water is liquid: it moves and makes waves."
    - texte: "Which one is made of solid water?"
      bonne: ["2603", "the snowman"]
      autres: [["1f6bf", "the shower"], ["1f4a7", "the drop of water"]]
      explication: "A snowman is made of snow: solid water."
    - texte: "Where can you find ice and snow, even in summer?"
      bonne: ["1f3d4", "at the top of high mountains"]
      autres: [["1f6bf", "in the shower"], ["1f327", "in the rain"]]
      explication: "Up there, it's so cold that the ice stays all year round."
    - texte: "Where does rain fall from?"
      bonne: ["2601", "the cloud"]
      autres: [["2600", "the sun"], ["1f3d4", "the mountain"]]
      explication: "Rain falls from the clouds."
    - texte: "Which water flows to wash you?"
      bonne: ["1f6bf", "the shower"]
      autres: [["1f9ca", "the ice cube"], ["2744", "the snowflake"]]
      explication: "Shower water is liquid: it flows."
