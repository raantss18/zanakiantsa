id: explorer
titre: Explorer en 3D
nom: "Explorer"
# Nom selon la tranche d'âge (ADR 0066) : à 17 ans, plus de « Lire et écrire » sur l'accueil.
noms: {moyens: "Histoire et monde", grands: "Histoire-géographie"}
# Pour le site vitrine, une phrase pour les parents (tool/build_site.py).
resume: "Le corps humain, la Terre et l'espace, les solides, puis l'histoire et la géographie jusqu'en Terminale."
icone: "1f52d"
ages: [4, 17]
# Corps : maternelle consolidée p. 59-60. Solides : programme de mathématiques du cycle 2 (CP), « Les solides ».
# Planètes : NASA Science, « Planets » (ordre, tailles), consulté le 2026-11-03 ; thème du programme de cycle 3
# (« situer la Terre dans le système solaire »), texte du programme non relu. Scènes 3D : ADR 0024.
sources:
  c1: "https://eduscol.education.gouv.fr/sites/default/files/document/programme-cycle-1-consolide-127565.pdf"
  cycle2: "https://www.education.gouv.fr/sites/default/files/document/Annexe%204%20%E2%80%93%20Programme%20de%20math%C3%A9matiques%20du%20cycle%202-403821.pdf"
  nasa: "https://science.nasa.gov/solar-system/planets/"
  # Programme de sciences et technologie du cycle 2 (BO n° 24 du 11 juin 2026, annexe 1), « Le corps humain et la santé », CE2.
  # Lu le 2026-11-07. En application au CE2 à la rentrée 2027-2028 (arrêté du 5-6-2026, art. 3).
  c2s: "https://www.education.gouv.fr/sites/default/files/document/annexe-1-programme-de-sciences-et-technologie-du-cycle-2-519020.pdf"
  # Programme de sciences et technologie du cycle 3 (BO n° 24 du 11 juin 2026, annexe 2), « Différents types de mouvement »,
  # CM2 et 6e. Lu le 2026-11-07. En application au CM2 et en 6e à la rentrée 2027-2028.
  c3s: "https://www.education.gouv.fr/sites/default/files/document/annexe-2-programme-de-sciences-et-technologie-du-cycle-3-519023.pdf"
  # Programme du cycle 3 en vigueur à la rentrée 2023 (BOEN n° 31 du 30 juillet 2020 et n° 25 du 22 juin 2023), Éduscol,
  # « Histoire et géographie », p. 67-76. Lu le 2026-11-07. ⚠ Un nouveau programme d'histoire-géographie (BO n° 22 du
  # 28 mai 2026) s'applique au CM1 dès 2026-2027 ; son texte n'a pas pu être lu (page du BO bloquée) : à relire.
  c3hg: "https://eduscol.education.fr/document/50990/download"
  # Programme du cycle 4 en vigueur à la rentrée 2020 (BOEN n° 31 du 30 juillet 2020), Éduscol : histoire et géographie
  # p. 79-91, physique-chimie p. 98-104. Lu le 2026-11-07.
  c4: "https://eduscol.education.fr/document/621/download"
  # Lycée, programmes d'histoire-géographie du BO spécial n° 1 du 22 janvier 2019 (2de : annexe 1 ; 1re générale : annexe 2).
  # Les pages du BO renvoient 403 aux robots : texte lu dans des copies fidèles des annexes publiées par le SNES-FSU
  # (en-tête et pied de page du ministère), le 2026-11-07. Aucun nouveau programme de lycée trouvé à cette date.
  hg2de: "https://www.snes.edu/IMG/pdf/hist-geog_annexe-1_2e_bo.pdf"
  hg1re: "https://www.snes.edu/wp-content/uploads/hist-geog_annexe-2_1eg_bo.pdf"
  # Cycle 2, « Questionner l'espace et le temps » (programme du cycle 2 en vigueur à la rentrée 2020, d'après le BOEN n° 31
  # du 30 juillet 2020, p. 51-55 : se situer dans l'espace, dans le temps, explorer les organisations du monde). Éduscol
  # (eduscol.education.gouv.fr/4770, page non lue : 403) indique que cet ancien programme reste en vigueur au CE1 en
  # 2026-2027 (information relevée dans un moteur de recherche, non vérifiée). Texte lu le 2026-11-08 dans la copie publiée
  # par la circonscription de Montbéliard 1 (académie de Besançon), en-tête et pied de page Éduscol ; l'original Éduscol
  # n'a pas pu être téléchargé.
  c2qm: "https://montbeliard1.circo25.ac-besancon.fr/wp-content/uploads/sites/20/2020/08/Cycle-2-avec-modifications-apparentes.pdf"
  # Terminale générale : programme d'histoire-géographie, annexe 1 de l'arrêté du BO spécial n° 8 du 25 juillet 2019
  # (PDF Éduscol). Lu le 2026-11-08 : thème 2 d'histoire (1945-années 1970), thème 4 chapitre 3 (la République française),
  # thème 1 de géographie (mers et océans). Aucun programme plus récent trouvé à cette date.
  hgtle: "https://eduscol.education.fr/document/23416/download"
  # Leçons de collège ajoutées le 2026-11-11 (sources des faits, lues ce jour-là). Ressources Éduscol « S'approprier les
  # différents thèmes du programme » (mars 2016, rédigées pour le programme de 2015 dont les thèmes sont repris en 2020) :
  ed6h1: "https://eduscol.education.fr/document/16750/download"    # 6e, histoire, thème 1 (Néolithique, premiers États)
  ed6g1: "https://eduscol.education.fr/document/16777/download"    # 6e, géographie, thème 1 (habiter une métropole)
  ed4h2: "https://eduscol.education.fr/document/17854/download"    # 4e, histoire, thème 2 (révolution industrielle)
  ed4g1: "https://eduscol.education.fr/document/17878/download"    # 4e, géographie, thème 1 (urbanisation du monde)
  ed3h1: "https://eduscol.education.fr/document/17860/download"    # 3e, histoire, thème 1 (guerres totales)
  ed3h1b: "https://eduscol.education.fr/document/29242/download"   # 3e, fiche « Démocraties fragilisées… » (docx)
  # ONU : World Population Prospects 2024 (communiqué du 11 juillet 2024) et World Urbanization Prospects 2018.
  onu_wpp: "https://www.un.org/sustainabledevelopment/blog/2024/07/press-release-wpp2024/"
  onu_wup: "https://www.un.org/development/desa/en/news/population/2018-revision-of-world-urbanization-prospects.html"
  # ONU, objectifs de développement durable 2 (faim), 6 (eau) et 7 (énergie), pages en français.
  onu_odd2: "https://www.un.org/sustainabledevelopment/fr/hunger/"
  onu_odd6: "https://www.un.org/sustainabledevelopment/fr/water-and-sanitation/"
  onu_odd7: "https://www.un.org/sustainabledevelopment/fr/energy/"
  # Transition démographique : Grand dictionnaire terminologique (Office québécois de la langue française).
  oqlf: "https://vitrinelinguistique.oqlf.gouv.qc.ca/fiche-gdt/fiche/17570398/transition-demographique"
  # Insee : définition des énergies renouvelables ; fiche « déplacements domicile-travail » (navettes, migrations alternantes).
  insee_enr: "https://www.insee.fr/fr/metadonnees/definition/c1898"
  insee_nav: "https://www.insee.fr/fr/statistiques/fichier/2383177/fiche-depl-dom-travail.pdf"
  # Textes : Constitution du 4 octobre 1958 (Conseil constitutionnel), loi du 9 décembre 1905, loi du 15 mars 2004.
  constitution: "https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur"
  loi1905: "https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006070169"
  loi2004: "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000417977"
  # Front populaire : Assemblée nationale (accords de Matignon, lois de juin 1936) ; Cnam (loi du 20 juin 1936, 15 jours).
  an1936: "https://www.assemblee-nationale.fr/dyn/histoire/il-y-a-90-ans-le-front-populaire-et-les-lois-sociales-de-la-republique/des-accords-de-matignon-aux-cinq-premieres-lois-adoptees"
  cnam1936: "https://www.cnam.fr/actualites/institutionnel/les-conges-payes-ont-90-ans"
ordre: [corps-parties, jour-semaine-saisons, terre-mer-globe, solides-nommer, solides-reconnaitre, calendrier-generations, paysages-proches-lointains, france-carte, planetes, muscles-articulations, coeur-souffle, grandes-periodes, continents-oceans, lire-carte, terre-soleil, jour-nuit, saisons, premiers-etats-ecritures, habiter-metropole, moyen-age, univers-distances, croissance-demographique, ressources-limitees, revolution-empire, republique-xixe, revolution-industrielle, urbanisation-monde, guerres-mondiales, france-outre-mer, regimes-totalitaires, laicite-republique, mediterranee-antique-medievale, renaissance-humanisme, societes-environnements, mobilites-migrations, europe-revolutions, grande-guerre-lycee, metropolisation, monde-bipolaire, cinquieme-republique, mers-oceans]

