  - texte: "Tourne les objets avec ton doigt."
    images: ["1f446", "1f30d"]
  - texte: "Regarde-les bien de tous les côtés."
    images: ["1f52d"]
  - texte: "Puis touche la bonne réponse !"
    images: ["2b50"]

en:
  titre: "Exploring in 3D"
  nom: "Explore"
  noms: {moyens: "The world", grands: "History and geography"}
