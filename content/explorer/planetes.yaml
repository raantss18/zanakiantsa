id: planetes
titre: "Les planètes du système solaire"
niveau: CE2
prerequis: []
programme: { source: nasa, texte: "Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune (ordre depuis le Soleil). Jupiter is the largest planet in our solar system. Mercury is the planet nearest to the Sun, and the smallest planet in our solar system." }
activite: planetes
# Distances et tailles dessinées pas à l'échelle ; seul l'ordre des tailles est respecté (ADR 0024).
parametres: {}
idee: "Huit planètes tournent autour du Soleil. Dans l'ordre : Mercure, Vénus, la Terre, Mars, Jupiter, Saturne, Uranus, Neptune."
phrases:
  consigne: "Tourne le système solaire avec ton doigt : le Soleil est au milieu. Puis touche la planète demandée."
  question: "{texte}"
  indice: "Compte les planètes en partant du Soleil : une, deux, trois…"
  exemple: "Essaie une autre planète."
  demonstration: "Regarde : {explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Touche la planète la plus proche du Soleil."
    cible: mercure
    explication: "C'est Mercure, la planète la plus proche du Soleil."
  - texte: "Touche la plus grande planète."
    cible: jupiter
    explication: "C'est Jupiter, la plus grande planète du système solaire."
  - texte: "Touche la plus petite planète."
    cible: mercure
    explication: "C'est Mercure, la plus petite planète."
  - texte: "Touche la Terre : c'est la troisième planète en partant du Soleil."
    cible: terre
    explication: "C'est la Terre, notre planète, la troisième en partant du Soleil."
  - texte: "Touche la planète la plus loin du Soleil."
    cible: neptune
    explication: "C'est Neptune, la huitième planète en partant du Soleil."
  - texte: "Touche Saturne : c'est la sixième planète en partant du Soleil."
    cible: saturne
    explication: "C'est Saturne, la sixième planète."
  - texte: "Touche Mars : c'est la quatrième planète en partant du Soleil."
    cible: mars
    explication: "C'est Mars, la quatrième planète."

en:
  titre: "The planets of the solar system"
  idee: "Eight planets go round the Sun. In order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune."
  phrases:
    consigne: "Turn the solar system with your finger: the Sun is in the middle. Then touch the planet I ask for."
    question: "{texte}"
    indice: "Count the planets starting from the Sun: one, two, three…"
    exemple: "Try another planet."
    demonstration: "Look: {explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Touch the planet closest to the Sun."
      cible: mercure
      explication: "It's Mercury, the planet closest to the Sun."
    - texte: "Touch the biggest planet."
      cible: jupiter
      explication: "It's Jupiter, the biggest planet in the solar system."
    - texte: "Touch the smallest planet."
      cible: mercure
      explication: "It's Mercury, the smallest planet."
    - texte: "Touch the Earth: it's the third planet from the Sun."
      cible: terre
      explication: "It's the Earth, our planet, the third one from the Sun."
    - texte: "Touch the planet furthest from the Sun."
      cible: neptune
      explication: "It's Neptune, the eighth planet from the Sun."
    - texte: "Touch Saturn: it's the sixth planet from the Sun."
      cible: saturne
      explication: "It's Saturn, the sixth planet."
    - texte: "Touch Mars: it's the fourth planet from the Sun."
      cible: mars
      explication: "It's Mars, the fourth planet."
