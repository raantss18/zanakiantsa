id: construction-europeenne
titre: "La construction européenne depuis les années 1990"
niveau: Terminale
prerequis: [monde-bipolaire]
programme: { source: hgtle, texte: "La construction européenne entre élargissement, approfondissement et remises en question. Ce chapitre vise à contextualiser les évolutions, les avancées et les crises de la construction européenne." }
activite: quiz
parametres: {}
idee: "Depuis 1990, l'Europe s'élargit et s'approfondit : traité de Maastricht, euro, entrée de pays d'Europe centrale et orientale. Elle est aussi contestée : « non » français de 2005, départ du Royaume-Uni."
phrases:
  consigne: "Lis la question, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Repères : 3 octobre 1990, réunification allemande ; 1992, traité de Maastricht ; 2002, billets et pièces en euros ; 2004, dix nouveaux pays ; 2005, « non » au traité constitutionnel ; 2007, traité de Lisbonne ; 2020, départ du Royaume-Uni."
  exemple: "Exemple : le tunnel sous la Manche, projet franco-britannique, relie Paris à Londres. Mais le Royaume-Uni reste hors de l'espace Schengen : une vraie frontière existe à la gare du Nord et à Saint-Pancras."
  demonstration: "{explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Quel événement du 3 octobre 1990 change l'équilibre de la construction européenne ?"
    nom: "La réunification de l'Allemagne."
    explication: "Après la fin du bloc soviétique, l'Allemagne réunifiée devient potentiellement la première puissance économique du continent."
    pieges:
      - { texte: "La sortie du Royaume-Uni de l'Union.", pourquoi: "Elle a lieu bien plus tard, le 31 janvier 2020." }
      - { texte: "La mise en circulation des pièces en euros.", pourquoi: "Les billets et les pièces en euros arrivent le 1er janvier 2002." }
  - texte: "Que crée le traité de Maastricht, signé le 7 février 1992 ?"
    nom: "L'Union européenne, avec une citoyenneté européenne et le projet de monnaie unique."
    explication: "Le traité entre en vigueur le 1er novembre 1993 : l'Union européenne est officiellement créée."
    pieges:
      - { texte: "Le tunnel sous la Manche.", pourquoi: "Le tunnel est un projet franco-britannique, pas un traité européen." }
      - { texte: "L'OTAN.", pourquoi: "L'OTAN est une alliance militaire autour des États-Unis ; Maastricht crée l'Union européenne." }
  - texte: "Quand les billets et les pièces en euros entrent-ils dans la vie quotidienne ?"
    nom: "Le 1er janvier 2002, dans 12 pays de l'Union."
    explication: "Ce jour-là, les billets et les pièces en euros deviennent la monnaie légale dans 12 pays."
    pieges:
      - { texte: "En 1999, dans tous les pays de l'Union.", pourquoi: "En 1999, l'euro existe seulement pour les opérations commerciales et financières, dans 11 pays." }
      - { texte: "Dès 1992, avec le traité de Maastricht.", pourquoi: "Le traité prévoit la monnaie unique ; les pièces n'arrivent que dix ans plus tard." }
  - texte: "Pourquoi l'euro est-il un choix politique fort, et pas seulement économique ?"
    nom: "Parce que les États abandonnent leur politique monétaire, un attribut essentiel de leur souveraineté."
    explication: "Avec l'euro, ce n'est plus chaque État qui conduit sa politique monétaire, mais la Banque centrale européenne."
    pieges:
      - { texte: "Parce qu'il remplace les drapeaux nationaux.", pourquoi: "L'euro est une monnaie : il ne touche pas aux drapeaux des États." }
      - { texte: "Parce que tous les pays du monde doivent l'utiliser.", pourquoi: "Il concerne les pays qui l'ont adopté, pas le monde entier." }
  - texte: "Selon ses statuts, quelle est la mission prioritaire de la Banque centrale européenne ?"
    nom: "Lutter contre l'inflation, pour garder une monnaie stable."
    explication: "Pour la même raison, ses statuts lui interdisent de financer directement les dettes publiques des États membres."
    pieges:
      - { texte: "Financer directement les dettes des États.", pourquoi: "Ses statuts le lui interdisent." }
      - { texte: "Fixer les impôts de chaque pays.", pourquoi: "La fiscalité reste aux États : il n'existe pas de convergence fiscale entre eux." }
  - texte: "En 2004, combien de pays entrent dans l'Union européenne ?"
    nom: "Dix : Chypre, Malte et huit pays d'Europe centrale et orientale."
    explication: "Les huit sont la Tchéquie, l'Estonie, la Hongrie, la Lettonie, la Lituanie, la Pologne, la Slovaquie et la Slovénie."
    pieges:
      - { texte: "Deux : la Bulgarie et la Roumanie.", pourquoi: "Elles entrent en 2007, ce qui porte l'Union à 27 membres." }
      - { texte: "Un seul : la Croatie.", pourquoi: "La Croatie entre en 2013, comme 28e État membre." }
  - texte: "En 2005, que devient le traité établissant une Constitution pour l'Europe ?"
    nom: "Les électeurs français et néerlandais le rejettent par référendum."
    explication: "Le projet de constitution échoue ; en 2007, les 27 signent le traité de Lisbonne, en vigueur le 1er décembre 2009."
    pieges:
      - { texte: "Il est approuvé par référendum dans tous les pays.", pourquoi: "Les Français et les Néerlandais votent « non » : il ne peut pas entrer en vigueur." }
      - { texte: "Il crée la monnaie unique.", pourquoi: "La monnaie unique vient du traité de Maastricht, en 1992." }
  - texte: "Que décident les électeurs britanniques lors du référendum du 23 juin 2016 ?"
    nom: "De quitter l'Union européenne, à 52 % des voix."
    explication: "Le Royaume-Uni quitte l'Union le 31 janvier 2020. Pendant les négociations, les autres pays de l'Union restent unis."
    pieges:
      - { texte: "D'adopter l'euro.", pourquoi: "Le vote porte sur la sortie de l'Union, pas sur la monnaie." }
      - { texte: "D'entrer dans l'espace Schengen.", pourquoi: "Le Royaume-Uni restait hors de Schengen ; le vote porte sur l'appartenance à l'Union." }

en:
  titre: "European integration since the 1990s"
  idee: "Since 1990, Europe has grown wider and deeper: the Maastricht Treaty, the euro, Central and Eastern European countries joining. It is also challenged: the French « no » of 2005, the UK's departure."
  phrases:
    consigne: "Read the question, then touch the right answer."
    question: "{texte}"
    indice: "Landmarks: 3 October 1990, German reunification; 1992, Maastricht Treaty; 2002, euro notes and coins; 2004, ten new countries; 2005, « no » to the constitutional treaty; 2007, Treaty of Lisbon; 2020, the UK leaves."
    exemple: "Example: the Channel Tunnel, a Franco-British project, links Paris and London. But the UK stays outside the Schengen area: there is a real border at the Gare du Nord and at St Pancras."
    demonstration: "{explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Which event on 3 October 1990 changes the balance of European integration?"
      nom: "The reunification of Germany."
      explication: "After the end of the Soviet bloc, reunified Germany potentially becomes the leading economic power on the continent."
      pieges:
        - { texte: "The UK leaving the Union.", pourquoi: "That happens much later, on 31 January 2020." }
        - { texte: "Euro coins coming into circulation.", pourquoi: "Euro notes and coins arrive on 1 January 2002." }
    - texte: "What does the Maastricht Treaty, signed on 7 February 1992, create?"
      nom: "The European Union, with European citizenship and the plan for a single currency."
      explication: "The treaty comes into force on 1 November 1993: the European Union is officially created."
      pieges:
        - { texte: "The Channel Tunnel.", pourquoi: "The tunnel is a Franco-British project, not a European treaty." }
        - { texte: "NATO.", pourquoi: "NATO is a military alliance around the United States; Maastricht creates the European Union." }
    - texte: "When do euro notes and coins come into daily life?"
      nom: "On 1 January 2002, in 12 EU countries."
      explication: "On that day, euro notes and coins become legal tender in 12 countries."
      pieges:
        - { texte: "In 1999, in every EU country.", pourquoi: "In 1999, the euro exists only for commercial and financial transactions, in 11 countries." }
        - { texte: "In 1992, with the Maastricht Treaty.", pourquoi: "The treaty plans the single currency; the coins only arrive ten years later." }
    - texte: "Why is the euro a strong political choice, and not just an economic one?"
      nom: "Because states give up their monetary policy, an essential feature of their sovereignty."
      explication: "With the euro, it is no longer each state that runs its monetary policy, but the European Central Bank."
      pieges:
        - { texte: "Because it replaces national flags.", pourquoi: "The euro is a currency: it doesn't affect states' flags." }
        - { texte: "Because every country in the world must use it.", pourquoi: "It concerns the countries that have adopted it, not the whole world." }
    - texte: "According to its statutes, what is the European Central Bank's main task?"
      nom: "Fighting inflation, to keep the currency stable."
      explication: "For the same reason, its statutes forbid it to fund member states' public debts directly."
      pieges:
        - { texte: "Funding states' debts directly.", pourquoi: "Its statutes forbid it." }
        - { texte: "Setting each country's taxes.", pourquoi: "Taxation stays with the states: there is no tax convergence between them." }
    - texte: "In 2004, how many countries join the European Union?"
      nom: "Ten: Cyprus, Malta and eight Central and Eastern European countries."
      explication: "The eight are Czechia, Estonia, Hungary, Latvia, Lithuania, Poland, Slovakia and Slovenia."
      pieges:
        - { texte: "Two: Bulgaria and Romania.", pourquoi: "They join in 2007, bringing the Union to 27 members." }
        - { texte: "Just one: Croatia.", pourquoi: "Croatia joins in 2013, as the 28th member state." }
    - texte: "In 2005, what happens to the treaty establishing a Constitution for Europe?"
      nom: "French and Dutch voters reject it in referendums."
      explication: "The constitution project fails; in 2007, the 27 sign the Treaty of Lisbon, which comes into force on 1 December 2009."
      pieges:
        - { texte: "It is approved by referendum in every country.", pourquoi: "The French and the Dutch vote « no »: it cannot come into force." }
        - { texte: "It creates the single currency.", pourquoi: "The single currency comes from the Maastricht Treaty, in 1992." }
    - texte: "What do British voters decide in the referendum of 23 June 2016?"
      nom: "To leave the European Union, with 52% of the vote."
      explication: "The UK leaves the Union on 31 January 2020. During the negotiations, the other EU countries stay united."
      pieges:
        - { texte: "To adopt the euro.", pourquoi: "The vote is about leaving the Union, not about the currency." }
        - { texte: "To join the Schengen area.", pourquoi: "The UK was already outside Schengen; the vote is about membership of the Union." }
