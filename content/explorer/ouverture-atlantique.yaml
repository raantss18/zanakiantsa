id: ouverture-atlantique
titre: "L'ouverture atlantique et le « Nouveau Monde »"
niveau: 2de
prerequis: [mediterranee-antique-medievale]
programme: { source: hg2de, texte: "Ce chapitre vise à montrer le basculement des échanges de la Méditerranée vers l’Atlantique après 1453 et 1492, ainsi que le début d’une forme de mondialisation." }
activite: quiz
parametres: {}
idee: "Après 1453 et 1492, les échanges basculent de la Méditerranée vers l'Atlantique. Conquêtes, or et argent, sucre et esclavage relient Amériques, Afrique et Europe : une première mondialisation."
phrases:
  consigne: "Lis la question, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Repères : 1453, prise de Constantinople ; 1492, Colomb aux Amériques ; conquistadores, marchands, missionnaires ; choc microbien ; économie sucrière et traite ; Las Casas face à Sepúlveda."
  exemple: "Exemple : dans l'encomienda, un conquérant reçoit de la Couronne le droit de faire travailler un groupe d'Indiens, qu'il doit en échange évangéliser. C'est une forme de travail forcé."
  demonstration: "{explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Après 1453 et 1492, vers quel espace les grands échanges européens basculent-ils ?"
    nom: "Vers l'océan Atlantique."
    explication: "Les échanges basculent de la Méditerranée vers l'Atlantique : c'est le début d'une forme de mondialisation."
    pieges:
      - { texte: "Vers la mer Méditerranée.", pourquoi: "C'est le point de départ : la Méditerranée était le centre des échanges, et le mouvement s'en éloigne." }
      - { texte: "Vers l'océan Arctique.", pourquoi: "Les nouvelles routes relient l'Europe, l'Afrique, les Amériques et l'Asie par l'Atlantique." }
  - texte: "Que cherchaient d'abord les navigateurs partis vers l'ouest à partir de 1492 ?"
    nom: "De nouvelles routes maritimes vers les Indes."
    explication: "Ils voulaient atteindre les Indes par la mer, et non découvrir un « nouveau monde » dont ils ignoraient l'existence."
    pieges:
      - { texte: "Un continent qu'ils savaient déjà exister.", pourquoi: "Ils ignoraient l'existence de l'Amérique : ils visaient l'Asie." }
      - { texte: "Des terres vides à peupler.", pourquoi: "Les Amériques étaient habitées, avec des peuples et des empires." }
  - texte: "Pourquoi les historiens écrivent-ils « Nouveau Monde » entre guillemets ?"
    nom: "Parce que l'expression traduit le seul regard des Européens."
    explication: "Pour les peuples d'Amérique, ce monde n'avait rien de nouveau : les guillemets rappellent qu'il ne faut pas s'en tenir au regard européen."
    pieges:
      - { texte: "Parce que l'Amérique est apparue récemment sur la Terre.", pourquoi: "Le continent existait bien avant : c'est sa découverte par les Européens qui est récente." }
      - { texte: "Parce que ce nom a été choisi par les Amérindiens.", pourquoi: "C'est une expression européenne, pas celle des peuples d'Amérique." }
  - texte: "Pourquoi les empires américains s'effondrent-ils face aux conquérants européens ?"
    nom: "Surtout à cause de faiblesses politiques et du choc microbien."
    explication: "Les historiens insistent moins sur les armes que sur les faiblesses politiques et les effets dramatiques des maladies sur les populations."
    pieges:
      - { texte: "Seulement parce que les armes européennes étaient meilleures.", pourquoi: "Ce déséquilibre était en partie compensé par le grand nombre de combattants amérindiens." }
      - { texte: "Parce que les Amérindiens n'ont jamais résisté.", pourquoi: "Il y a eu des affrontements et des résistances pendant la conquête." }
  - texte: "Qu'appelle-t-on le « choc microbien » ?"
    nom: "Les maladies apportées par les Européens, qui frappent durement les Amérindiens."
    explication: "Le mot « microbien » parle de microbes : ces maladies contribuent à l'effondrement de la population amérindienne."
    pieges:
      - { texte: "Un tremblement de terre.", pourquoi: "Un séisme n'a rien à voir avec les microbes." }
      - { texte: "Une famine due à la sécheresse.", pourquoi: "Le choc microbien désigne des maladies, pas un manque de nourriture." }
  - texte: "Au Brésil, pourquoi l'économie sucrière développe-t-elle la traite des esclaves africains ?"
    nom: "Parce qu'elle demande une main-d'œuvre nombreuse et peu coûteuse."
    explication: "Les plantations de canne à sucre réclament beaucoup de bras : la traite négrière amène de force des Africains, depuis des comptoirs d'Afrique, pour y travailler."
    pieges:
      - { texte: "Parce que les Africains cultivaient déjà le sucre au Brésil.", pourquoi: "Ils y sont amenés de force, depuis des comptoirs africains." }
      - { texte: "Parce que le sucre se récoltait avec des machines.", pourquoi: "Si des machines faisaient le travail, il ne faudrait pas une main-d'œuvre si nombreuse." }
  - texte: "Lors de la controverse de Valladolid, que défend Bartolomé de Las Casas face à Sepúlveda ?"
    nom: "L'égale dignité de tous les hommes, Amérindiens compris."
    explication: "Le dominicain Las Casas, ancien colon, s'oppose à Sepúlveda : le débat porte sur la légitimité de la conquête et la manière de considérer les peuples d'Amérique."
    pieges:
      - { texte: "Que certains hommes sont esclaves par nature.", pourquoi: "C'est la thèse de Sepúlveda, inspirée d'Aristote, que Las Casas combat." }
      - { texte: "Qu'il faut abandonner l'Amérique pour commercer avec l'Asie.", pourquoi: "Le débat porte sur les peuples d'Amérique, pas sur les routes commerciales." }
  - texte: "Pourquoi l'or et l'argent des Amériques sont-ils un bon exemple de première mondialisation ?"
    nom: "Parce que des flottes les transportent vers l'Europe, sur des routes qui relient plusieurs continents."
    explication: "Ces flottes transportent l'or et l'argent, mais aussi des esclaves et des denrées tropicales : l'Europe, l'Afrique et l'Amérique sont reliées."
    pieges:
      - { texte: "Parce qu'ils restent dans les Amériques.", pourquoi: "Ils traversent l'Atlantique jusqu'en Europe : c'est un échange entre continents." }
      - { texte: "Parce qu'ils viennent tous d'Asie.", pourquoi: "Ici, les métaux précieux viennent des gisements des Amériques." }

en:
  titre: "Opening to the Atlantic and the « New World »"
  idee: "After 1453 and 1492, trade shifts from the Mediterranean to the Atlantic. Conquests, gold and silver, sugar and slavery link the Americas, Africa and Europe: a first globalisation."
  phrases:
    consigne: "Read the question, then touch the right answer."
    question: "{texte}"
    indice: "Landmarks: 1453, fall of Constantinople; 1492, Columbus in the Americas; conquistadors, merchants, missionaries; the microbial shock; the sugar economy and the slave trade; Las Casas against Sepúlveda."
    exemple: "Example: under the encomienda, a conqueror receives from the Crown the right to make a group of Indians work for him, and in return he must convert them. It is a form of forced labour."
    demonstration: "{explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "After 1453 and 1492, towards which area does major European trade shift?"
      nom: "Towards the Atlantic Ocean."
      explication: "Trade shifts from the Mediterranean to the Atlantic: this is the start of a form of globalisation."
      pieges:
        - { texte: "Towards the Mediterranean Sea.", pourquoi: "That is the starting point: the Mediterranean was the centre of trade, and the movement goes away from it." }
        - { texte: "Towards the Arctic Ocean.", pourquoi: "The new routes link Europe, Africa, the Americas and Asia across the Atlantic." }
    - texte: "What were the sailors who headed west from 1492 looking for first?"
      nom: "New sea routes to the Indies."
      explication: "They wanted to reach the Indies by sea, not to discover a « new world » they did not know existed."
      pieges:
        - { texte: "A continent they already knew existed.", pourquoi: "They did not know America existed: they were aiming for Asia." }
        - { texte: "Empty land to settle.", pourquoi: "The Americas were inhabited, with peoples and empires." }
    - texte: "Why do historians put « New World » in quotation marks?"
      nom: "Because the phrase reflects only the Europeans' point of view."
      explication: "For the peoples of America, this world was not new at all: the quotation marks remind us not to stick to the European view."
      pieges:
        - { texte: "Because America appeared on Earth recently.", pourquoi: "The continent existed long before: it is its discovery by Europeans that is recent." }
        - { texte: "Because the name was chosen by Native Americans.", pourquoi: "It is a European phrase, not one used by the peoples of America." }
    - texte: "Why do the American empires collapse in front of the European conquerors?"
      nom: "Mainly because of political weaknesses and the microbial shock."
      explication: "Historians stress weapons less than political weaknesses and the dramatic effects of diseases on the population."
      pieges:
        - { texte: "Only because European weapons were better.", pourquoi: "This imbalance was partly made up for by the large numbers of Native American fighters." }
        - { texte: "Because Native Americans never resisted.", pourquoi: "There were battles and resistance during the conquest." }
    - texte: "What is the « microbial shock »?"
      nom: "The diseases brought by Europeans, which hit Native Americans very hard."
      explication: "« Microbial » is about microbes: these diseases played a part in the collapse of the Native American population."
      pieges:
        - { texte: "An earthquake.", pourquoi: "An earthquake has nothing to do with microbes." }
        - { texte: "A famine caused by drought.", pourquoi: "The microbial shock means diseases, not a lack of food." }
    - texte: "In Brazil, why does the sugar economy develop the trade in African slaves?"
      nom: "Because it needs a large and cheap workforce."
      explication: "Sugar cane plantations need many hands: the slave trade brings Africans there by force, from trading posts in Africa, to work."
      pieges:
        - { texte: "Because Africans were already growing sugar in Brazil.", pourquoi: "They are taken there by force, from African trading posts." }
        - { texte: "Because sugar was harvested by machines.", pourquoi: "If machines did the work, such a large workforce would not be needed." }
    - texte: "In the Valladolid debate, what does Bartolomé de Las Casas defend against Sepúlveda?"
      nom: "The equal dignity of all people, Native Americans included."
      explication: "The Dominican Las Casas, a former colonist, opposes Sepúlveda: the debate is about whether the conquest is legitimate and how to regard the peoples of America."
      pieges:
        - { texte: "That some people are slaves by nature.", pourquoi: "That is Sepúlveda's view, taken from Aristotle, which Las Casas fights." }
        - { texte: "That America should be abandoned to trade with Asia.", pourquoi: "The debate is about the peoples of America, not about trade routes." }
    - texte: "Why are the gold and silver of the Americas a good example of a first globalisation?"
      nom: "Because fleets carry them to Europe, on routes that link several continents."
      explication: "These fleets carry gold and silver, but also slaves and tropical goods: Europe, Africa and America are linked."
      pieges:
        - { texte: "Because they stay in the Americas.", pourquoi: "They cross the Atlantic to Europe: it is a trade between continents." }
        - { texte: "Because they all come from Asia.", pourquoi: "Here, the precious metals come from mines in the Americas." }
