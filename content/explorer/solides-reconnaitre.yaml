id: solides-reconnaitre
titre: "Reconnaître les solides usuels"
niveau: CP
prerequis: [solides-nommer]
programme: { source: cycle2, texte: "Reconnaitre les solides usuels suivants : cube, boule, cône, cylindre, pavé." }
activite: solide
parametres: { solides: [cube, pave, boule, cylindre, cone] }
idee: "Un cylindre et un cône ont un disque plat et une partie qui roule. Le cône a une pointe."
phrases:
  consigne: "Tourne le solide avec ton doigt pour voir toutes ses faces. Puis touche son nom."
  question: "Comment s'appelle ce solide ?"
  indice: "Regarde ses faces : sont-elles plates ? Y a-t-il une partie qui roule ?"
  exemple: "Une boule roule partout. Un cube a six faces carrées, toutes pareilles."
  demonstration: "Regarde : c'est {bonne}."
  bravo: "Oui ! C'est {bonne}."

en:
  titre: "Recognising common solid shapes"
  idee: "A cylinder and a cone have a flat circle and a part that rolls. The cone has a point."
  phrases:
    consigne: "Turn the shape with your finger to see all its faces. Then touch its name."
    question: "What is this shape called?"
    indice: "Look at its faces: are they flat? Is there a part that rolls?"
    exemple: "A sphere rolls in every direction. A cube has six square faces, all the same."
    demonstration: "Look: this is {bonne}."
    bravo: "Yes! This is {bonne}."
