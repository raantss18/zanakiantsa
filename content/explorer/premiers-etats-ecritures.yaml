id: premiers-etats-ecritures
titre: "Du Néolithique aux premiers États et aux premières écritures"
niveau: 6e
prerequis: [grandes-periodes]
# Faits : ressource Éduscol « Histoire / 6e, thème 1 » (source ed6h1, lue le 2026-11-11) : agriculture et élevage dans le
# Croissant fertile au milieu du IXe millénaire av. J.-C., céramique au VIIIe, villages en Europe entre 7000 et 6500 ;
# « révolution » entre guillemets (lente) ; Uruk ville vers 3500 av. J.-C., roi-prêtre ; écriture vers 3300-3000 av. J.-C.
# en Mésopotamie et en Égypte ; cunéiforme sur tablettes ; listes de mots, comptes, tablettes scolaires ; écriture réservée
# aux scribes ; démotique en Égypte vers 650 av. J.-C.
programme: { source: c3hg, texte: "La longue histoire de l’humanité et des migrations : la « révolution » néolithique ; premiers États, premières écritures (Orient ancien : Égypte ou Mésopotamie)." }
activite: quiz
parametres: {}
idee: "Au Néolithique, les humains deviennent agriculteurs et éleveurs et vivent en villages. Puis, au Proche-Orient, naissent la ville, l'État et l'écriture, vers 3300-3000 avant J.-C."
phrases:
  consigne: "Lis la question, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Repères : agriculture et élevage au milieu du IXe millénaire avant J.-C., dans le Croissant fertile ; écriture vers 3300-3000 avant J.-C., en Mésopotamie et en Égypte."
  exemple: "Exemple : Uruk, en Mésopotamie. Ses grands monuments montrent qu'elle est devenue une ville vers 3500 avant J.-C. Un roi-prêtre la gouverne : c'est un État."
  demonstration: "{explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Au milieu du IXe millénaire avant J.-C., où apparaissent l'agriculture et l'élevage ?"
    nom: "Dans le Croissant fertile, au Proche-Orient."
    explication: "Les découvertes situent leurs débuts dans le Croissant fertile. Ils se diffusent ensuite, lentement, vers d'autres régions."
    pieges:
      - { texte: "En Europe.", pourquoi: "En Europe, les villages d'agriculteurs s'installent plus tard, entre 7000 et 6500 avant J.-C." }
      - { texte: "Nulle part : à cette époque, tous les humains sont nomades.", pourquoi: "C'est justement le Néolithique qui voit naître l'agriculture, l'élevage et les villages." }
  - texte: "Pourquoi écrit-on la « révolution » néolithique avec des guillemets ?"
    nom: "Parce que ce grand changement a été lent, sur plusieurs millénaires."
    explication: "Le passage à l'agriculture et à l'élevage s'étale du IXe au IIIe millénaire avant J.-C. : c'est plutôt une évolution."
    pieges:
      - { texte: "Parce que les paysans se révoltent contre un roi.", pourquoi: "Ici, « révolution » veut dire grand changement de mode de vie, pas une révolte." }
      - { texte: "Parce que le changement s'est fait en une seule année.", pourquoi: "C'est l'inverse : il a duré des milliers d'années." }
  - texte: "Que se passe-t-il quand les humains se sédentarisent ?"
    nom: "Ils vivent en villages et la population augmente."
    explication: "Se sédentariser, c'est rester au même endroit. Avec les villages, la population augmente, et la propriété des terres apparaît."
    pieges:
      - { texte: "Ils se déplacent sans cesse pour suivre le gibier.", pourquoi: "C'est le mode de vie des chasseurs-cueilleurs nomades, avant le Néolithique." }
      - { texte: "Ils cessent de fabriquer des objets.", pourquoi: "Au contraire : la céramique apparaît au VIIIe millénaire avant J.-C." }
  - texte: "Vers quand apparaît l'écriture en Mésopotamie et en Égypte ?"
    nom: "Vers 3300-3000 avant J.-C."
    explication: "Les plus anciens témoignages viennent de Sumer, en Mésopotamie ; en Égypte, les premiers hiéroglyphes datent de la fin du IVe millénaire avant J.-C."
    pieges:
      - { texte: "Au milieu du IXe millénaire avant J.-C.", pourquoi: "C'est l'époque des débuts de l'agriculture, bien avant l'écriture." }
      - { texte: "Vers l'an 1 de notre ère.", pourquoi: "C'est plus de 3 000 ans trop tard." }
  - texte: "Comment s'appelle l'écriture des tablettes de Mésopotamie ?"
    nom: "L'écriture cunéiforme."
    explication: "En Mésopotamie, au IVe millénaire avant J.-C., on passe de signes sur des cachets à une écriture sur tablettes : le cunéiforme."
    pieges:
      - { texte: "Les hiéroglyphes.", pourquoi: "Les hiéroglyphes sont l'écriture de l'Égypte, pas de la Mésopotamie." }
      - { texte: "L'écriture démotique.", pourquoi: "C'est une écriture d'Égypte, née bien plus tard, vers 650 avant J.-C." }
  - texte: "Dans ces premiers États, qui sait écrire ?"
    nom: "Les scribes."
    explication: "L'écriture est alors réservée aux scribes : on a même retrouvé leurs tablettes d'école."
    pieges:
      - { texte: "Tous les enfants du village.", pourquoi: "L'écriture est réservée aux scribes, pas à tous les habitants." }
      - { texte: "Seulement les paysans, pour leurs récoltes.", pourquoi: "Ce sont les scribes qui écrivent, par exemple les comptes." }
  - texte: "À quoi servent les plus anciens écrits ?"
    nom: "À compter et à faire des listes."
    explication: "On y trouve des listes de mots rangés par thèmes, des documents de comptes et des exercices d'élèves scribes."
    pieges:
      - { texte: "À écrire des romans d'aventure.", pourquoi: "Les plus anciennes tablettes sont des listes, des comptes et des exercices." }
      - { texte: "À rien : ce sont des dessins pour décorer.", pourquoi: "Ce sont de vrais textes : on y lit des mots et des comptes." }
  - texte: "Pour les historiens, qu'est-ce qu'un des premiers États ?"
    nom: "Une autorité, comme un roi, avec des lois et une administration."
    explication: "À Uruk, un roi-prêtre gouverne. L'État, c'est ce pouvoir du roi et l'organisation qui fait appliquer ses décisions."
    pieges:
      - { texte: "Un simple village de paysans.", pourquoi: "Un village n'a pas forcément de roi ni d'administration ; l'État, si." }
      - { texte: "Une république où tous les habitants votent.", pourquoi: "Les premiers États sont des monarchies, comme celle du roi-prêtre d'Uruk." }

en:
  titre: "From the Neolithic to the first states and the first writing"
  idee: "In the Neolithic, people become farmers and herders and live in villages. Then, in the Near East, towns, states and writing appear, around 3300-3000 BC."
  phrases:
    consigne: "Read the question, then touch the right answer."
    question: "{texte}"
    indice: "Landmarks: farming and herding in the middle of the 9th millennium BC, in the Fertile Crescent; writing around 3300-3000 BC, in Mesopotamia and Egypt."
    exemple: "Example: Uruk, in Mesopotamia. Its large monuments show that it had become a town by around 3500 BC. A priest-king rules it: it's a state."
    demonstration: "{explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "In the middle of the 9th millennium BC, where do farming and herding appear?"
      nom: "In the Fertile Crescent, in the Near East."
      explication: "Discoveries place their beginnings in the Fertile Crescent. They then spread slowly to other regions."
      pieges:
        - { texte: "In Europe.", pourquoi: "In Europe, farming villages settle later, between 7000 and 6500 BC." }
        - { texte: "Nowhere: at that time, all humans are nomads.", pourquoi: "The Neolithic is precisely when farming, herding and villages begin." }
    - texte: "Why do we write the Neolithic « revolution » in quotation marks?"
      nom: "Because this great change was slow, over several thousand years."
      explication: "The move to farming and herding stretches from the 9th to the 3rd millennium BC: it's more of an evolution."
      pieges:
        - { texte: "Because the farmers revolt against a king.", pourquoi: "Here, « revolution » means a great change in the way of life, not a revolt." }
        - { texte: "Because the change happened in a single year.", pourquoi: "It's the opposite: it lasted thousands of years." }
    - texte: "What happens when people settle down?"
      nom: "They live in villages and the population grows."
      explication: "Settling down means staying in one place. With villages, the population grows, and land ownership appears."
      pieges:
        - { texte: "They keep moving to follow the game.", pourquoi: "That's the way of life of nomadic hunter-gatherers, before the Neolithic." }
        - { texte: "They stop making objects.", pourquoi: "On the contrary: pottery appears in the 8th millennium BC." }
    - texte: "Around when does writing appear in Mesopotamia and Egypt?"
      nom: "Around 3300-3000 BC."
      explication: "The oldest evidence comes from Sumer, in Mesopotamia; in Egypt, the first hieroglyphs date from the end of the 4th millennium BC."
      pieges:
        - { texte: "In the middle of the 9th millennium BC.", pourquoi: "That's when farming begins, long before writing." }
        - { texte: "Around the year 1 AD.", pourquoi: "That's more than 3,000 years too late." }
    - texte: "What is the writing on the tablets of Mesopotamia called?"
      nom: "Cuneiform writing."
      explication: "In Mesopotamia, in the 4th millennium BC, people move from signs on seals to writing on tablets: cuneiform."
      pieges:
        - { texte: "Hieroglyphs.", pourquoi: "Hieroglyphs are the writing of Egypt, not Mesopotamia." }
        - { texte: "Demotic writing.", pourquoi: "It's an Egyptian script, born much later, around 650 BC." }
    - texte: "In these first states, who knows how to write?"
      nom: "The scribes."
      explication: "Writing is then reserved for scribes: their school tablets have even been found."
      pieges:
        - { texte: "All the village children.", pourquoi: "Writing is reserved for scribes, not for all the inhabitants." }
        - { texte: "Only the farmers, for their harvests.", pourquoi: "It's the scribes who write, for example the accounts." }
    - texte: "What are the oldest written texts used for?"
      nom: "For counting and making lists."
      explication: "They contain lists of words grouped by theme, accounts and exercises by student scribes."
      pieges:
        - { texte: "For writing adventure novels.", pourquoi: "The oldest tablets are lists, accounts and exercises." }
        - { texte: "For nothing: they're decorative drawings.", pourquoi: "They're real texts: you can read words and accounts in them." }
    - texte: "For historians, what is one of the first states?"
      nom: "An authority, such as a king, with laws and an administration."
      explication: "In Uruk, a priest-king rules. The state is this power of the king and the organisation that carries out his decisions."
      pieges:
        - { texte: "A simple farming village.", pourquoi: "A village doesn't necessarily have a king or an administration; a state does." }
        - { texte: "A republic where all the inhabitants vote.", pourquoi: "The first states are monarchies, like the priest-king's in Uruk." }
