id: renaissance-humanisme
titre: "Renaissance, humanisme et réformes"
niveau: 2de
prerequis: [mediterranee-antique-medievale]
programme: { source: hg2de, texte: "Ce chapitre vise à montrer comment l’effervescence intellectuelle et artistique de l’époque aboutit à la volonté de rompre avec le « Moyen Âge » et de faire retour à l’Antiquité." }
activite: quiz
parametres: {}
idee: "Aux XVe et XVIe siècles, l'imprimerie diffuse les livres. Les humanistes relisent les textes antiques et placent l'être humain au centre. Les réformes protestante et catholique divisent la chrétienté occidentale."
phrases:
  consigne: "Lis la question, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Repères : vers 1450, l'imprimerie de Gutenberg ; 1508, Michel-Ange à la chapelle Sixtine ; 1511, l'Éloge de la folie d'Érasme ; 1517, Luther ; 1545-1563, le concile de Trente."
  exemple: "Exemple : un humaniste ne se contente pas d'une traduction latine de la Bible. Il veut lire le texte dans sa langue d'origine, le grec ou l'hébreu, pour retrouver son sens exact."
  demonstration: "{explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Vers 1450, à Mayence, Gutenberg met au point l'imprimerie à caractères mobiles. Quelle en est la conséquence principale ?"
    nom: "Les livres deviennent plus nombreux et moins chers : les idées circulent plus vite."
    explication: "Un texte imprimé est reproduit à des centaines d'exemplaires identiques : les idées humanistes et réformées se diffusent dans toute l'Europe."
    pieges:
      - { texte: "Les livres disparaissent, remplacés par les affiches.", pourquoi: "C'est l'inverse : l'imprimerie multiplie les livres." }
      - { texte: "Seuls les moines peuvent désormais copier des livres.", pourquoi: "Avant l'imprimerie, les livres étaient surtout copiés à la main ; l'imprimerie met fin à ce quasi-monopole." }
  - texte: "Qu'est-ce que l'humanisme ?"
    nom: "Un mouvement qui relit les textes antiques et fait confiance aux capacités de l'être humain."
    explication: "Les humanistes étudient le latin, le grec et l'hébreu pour revenir aux textes originaux et veulent former l'homme par l'éducation."
    pieges:
      - { texte: "Une aide humanitaire aux pauvres.", pourquoi: "Le mot fait penser à l'humanitaire ; à la Renaissance, il désigne l'étude des textes et une confiance dans l'homme." }
      - { texte: "Le rejet de toute religion.", pourquoi: "La plupart des humanistes sont chrétiens ; ils veulent relire la Bible, pas la rejeter." }
  - texte: "Pourquoi appelle-t-on Érasme le « prince des humanistes » ?"
    nom: "Parce que ce savant, auteur de l'Éloge de la folie, est lu et admiré dans toute l'Europe."
    explication: "Érasme publie l'Éloge de la folie en 1511 et une édition du Nouveau Testament en grec ; il correspond avec les savants de toute l'Europe."
    pieges:
      - { texte: "Parce qu'il est le fils d'un roi.", pourquoi: "Ce titre est honorifique : il salue un savant, pas un membre d'une famille royale." }
      - { texte: "Parce qu'il a inventé l'imprimerie.", pourquoi: "L'imprimerie est l'œuvre de Gutenberg ; Érasme s'en sert pour diffuser ses livres." }
  - texte: "En 1508, que commence Michel-Ange à Rome ?"
    nom: "Les fresques de la voûte de la chapelle Sixtine."
    explication: "Commandée par le pape Jules II, la voûte est achevée en 1512 : elle montre des corps humains inspirés de la sculpture antique."
    pieges:
      - { texte: "La construction du Colisée.", pourquoi: "Le Colisée est un monument antique, bâti au Ier siècle." }
      - { texte: "La peinture de la Joconde.", pourquoi: "La Joconde est une œuvre de Léonard de Vinci." }
  - texte: "En 1517, que fait Martin Luther ?"
    nom: "Il critique la vente des indulgences par l'Église dans 95 thèses."
    explication: "Luther conteste l'idée qu'on puisse payer pour réduire ses péchés : c'est le début de la Réforme protestante."
    pieges:
      - { texte: "Il devient pape.", pourquoi: "Luther est un moine allemand qui s'oppose au pape ; il est excommunié en 1521." }
      - { texte: "Il découvre l'Amérique.", pourquoi: "C'est Christophe Colomb qui atteint l'Amérique, en 1492." }
  - texte: "Selon Luther, comment le chrétien obtient-il son salut ?"
    nom: "Par la foi seule, et non en achetant des indulgences."
    explication: "Pour les protestants, le salut est un don de Dieu reçu par la foi ; la Bible, lue par chacun, est la seule autorité."
    pieges:
      - { texte: "En payant l'Église.", pourquoi: "C'est précisément ce que Luther dénonce avec la vente des indulgences." }
      - { texte: "En obéissant toujours au pape.", pourquoi: "Luther rejette l'autorité du pape au profit de la Bible." }
  - texte: "Que décide l'Église catholique au concile de Trente, de 1545 à 1563 ?"
    nom: "Elle réaffirme ses dogmes et réforme le clergé : c'est la Réforme catholique."
    explication: "L'Église catholique répond aux protestants : elle maintient le rôle du pape et des sacrements et forme mieux ses prêtres."
    pieges:
      - { texte: "Elle adopte toutes les idées de Luther.", pourquoi: "Le concile rejette les thèses protestantes : la chrétienté occidentale reste divisée." }
      - { texte: "Elle supprime la messe.", pourquoi: "Le concile confirme au contraire la messe et les sacrements." }
  - texte: "Pourquoi les hommes de la Renaissance parlent-ils d'un « Moyen Âge » ?"
    nom: "Pour désigner une période entre l'Antiquité et leur temps, qu'ils jugent en déclin, et dont ils veulent se détacher."
    explication: "Le mot exprime leur volonté de rompre avec les siècles précédents et de faire « renaître » l'Antiquité. Les historiens nuancent aujourd'hui ce jugement."
    pieges:
      - { texte: "Parce que c'était le nom officiel de l'époque, déjà au XIIe siècle.", pourquoi: "Personne au XIIe siècle ne se disait « du Moyen Âge » : le terme a été inventé après coup." }
      - { texte: "Parce que cette période se situe au milieu du monde.", pourquoi: "« Moyen » se rapporte au temps, entre l'Antiquité et la Renaissance, pas à l'espace." }

en:
  titre: "Renaissance, humanism and reformations"
  idee: "In the 15th and 16th centuries, printing spreads books. Humanists reread ancient texts and put human beings at the centre. The Protestant and Catholic reformations divide Western Christendom."
  phrases:
    consigne: "Read the question, then touch the right answer."
    question: "{texte}"
    indice: "Landmarks: around 1450, Gutenberg's printing press; 1508, Michelangelo at the Sistine Chapel; 1511, Erasmus's Praise of Folly; 1517, Luther; 1545-1563, the Council of Trent."
    exemple: "Example: a humanist isn't satisfied with a Latin translation of the Bible. He wants to read the text in its original language, Greek or Hebrew, to find its exact meaning."
    demonstration: "{explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Around 1450, in Mainz, Gutenberg develops printing with movable type. What is its main consequence?"
      nom: "Books become more numerous and cheaper: ideas travel faster."
      explication: "A printed text is reproduced in hundreds of identical copies: humanist and reformed ideas spread across Europe."
      pieges:
        - { texte: "Books disappear, replaced by posters.", pourquoi: "It's the opposite: printing multiplies books." }
        - { texte: "Only monks may now copy books.", pourquoi: "Before printing, books were mostly copied by hand; printing ends that near-monopoly." }
    - texte: "What is humanism?"
      nom: "A movement that rereads ancient texts and trusts in the abilities of human beings."
      explication: "Humanists study Latin, Greek and Hebrew to go back to the original texts and want to shape people through education."
      pieges:
        - { texte: "Humanitarian aid for the poor.", pourquoi: "The word brings humanitarian aid to mind; in the Renaissance, it means the study of texts and trust in humankind." }
        - { texte: "The rejection of all religion.", pourquoi: "Most humanists are Christians; they want to reread the Bible, not reject it." }
    - texte: "Why is Erasmus called the « prince of humanists »?"
      nom: "Because this scholar, author of The Praise of Folly, is read and admired all over Europe."
      explication: "Erasmus publishes The Praise of Folly in 1511 and an edition of the New Testament in Greek; he writes to scholars all over Europe."
      pieges:
        - { texte: "Because he is a king's son.", pourquoi: "The title is honorary: it praises a scholar, not a member of a royal family." }
        - { texte: "Because he invented printing.", pourquoi: "Printing is Gutenberg's work; Erasmus uses it to spread his books." }
    - texte: "In 1508, what does Michelangelo begin in Rome?"
      nom: "The frescoes on the ceiling of the Sistine Chapel."
      explication: "Commissioned by Pope Julius II, the ceiling is finished in 1512: it shows human bodies inspired by ancient sculpture."
      pieges:
        - { texte: "Building the Colosseum.", pourquoi: "The Colosseum is an ancient monument, built in the 1st century." }
        - { texte: "Painting the Mona Lisa.", pourquoi: "The Mona Lisa is a work by Leonardo da Vinci." }
    - texte: "In 1517, what does Martin Luther do?"
      nom: "He criticises the Church's sale of indulgences in 95 theses."
      explication: "Luther challenges the idea that you can pay to reduce your sins: it's the start of the Protestant Reformation."
      pieges:
        - { texte: "He becomes pope.", pourquoi: "Luther is a German monk who opposes the pope; he is excommunicated in 1521." }
        - { texte: "He discovers America.", pourquoi: "It's Christopher Columbus who reaches America, in 1492." }
    - texte: "According to Luther, how does a Christian gain salvation?"
      nom: "Through faith alone, not by buying indulgences."
      explication: "For Protestants, salvation is a gift from God received through faith; the Bible, read by each person, is the only authority."
      pieges:
        - { texte: "By paying the Church.", pourquoi: "That's exactly what Luther denounces with the sale of indulgences." }
        - { texte: "By always obeying the pope.", pourquoi: "Luther rejects the pope's authority in favour of the Bible." }
    - texte: "What does the Catholic Church decide at the Council of Trent, from 1545 to 1563?"
      nom: "It restates its doctrines and reforms the clergy: it's the Catholic Reformation."
      explication: "The Catholic Church answers the Protestants: it keeps the role of the pope and the sacraments and trains its priests better."
      pieges:
        - { texte: "It adopts all of Luther's ideas.", pourquoi: "The council rejects the Protestant theses: Western Christendom stays divided." }
        - { texte: "It abolishes the Mass.", pourquoi: "On the contrary, the council confirms the Mass and the sacraments." }
    - texte: "Why do Renaissance people speak of a « Middle Age »?"
      nom: "To name a period between Antiquity and their own time, which they see as a decline and want to break away from."
      explication: "The word expresses their wish to break with the previous centuries and make Antiquity « reborn ». Historians today qualify this judgement."
      pieges:
        - { texte: "Because it was the period's official name, already in the 12th century.", pourquoi: "Nobody in the 12th century said they lived « in the Middle Ages »: the term was invented afterwards." }
        - { texte: "Because the period lies in the middle of the world.", pourquoi: "« Middle » refers to time, between Antiquity and the Renaissance, not to space." }
