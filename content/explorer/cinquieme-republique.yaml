id: cinquieme-republique
titre: "La Ve République : naissance et évolutions"
niveau: Terminale
prerequis: [monde-bipolaire]
programme: { source: hgtle, texte: "La France : une nouvelle place dans le monde (la crise algérienne de la République française et la naissance d’un nouveau régime ; la constitution de 1958) et la République française (la Cinquième République : un régime stable qui connaît de nombreuses réformes institutionnelles ; la réaffirmation du principe de laïcité (2004) ; parité, PACS, évolution du mariage)" }
activite: quiz
parametres: {}
idee: "Née de la crise algérienne en 1958, la Ve République renforce le pouvoir du président, élu au suffrage universel direct depuis 1962. Régime stable, elle se réforme : quinquennat, parité, nouveaux droits."
phrases:
  consigne: "Lis la question, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Repères : 1958, Constitution ; 1962, accords d'Évian et élection du président au suffrage universel direct ; 1999, PACS et parité ; 2000, quinquennat ; 2004, laïcité à l'école ; 2008, deux mandats consécutifs au plus ; 2013, mariage."
  exemple: "Exemple : en 1958, la guerre d'Algérie fait tomber la IVe République. Le général de Gaulle revient au pouvoir et fait adopter par référendum une nouvelle Constitution, qui donne plus de pouvoirs à l'exécutif."
  demonstration: "{explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Quelle crise provoque le retour au pouvoir du général de Gaulle, en 1958 ?"
    nom: "La crise algérienne"
    explication: "Le 13 mai 1958, à Alger, des partisans de l'Algérie française se soulèvent ; la IVe République, impuissante, fait appel à de Gaulle."
    pieges:
      - { texte: "La crise de 1929", pourquoi: "La crise de 1929 est une crise économique de l'entre-deux-guerres." }
      - { texte: "Mai 1968", pourquoi: "Mai 68 a lieu dix ans plus tard, sous la Ve République." }
  - texte: "Comment la Constitution de la Ve République est-elle adoptée ?"
    nom: "Par référendum, le 28 septembre 1958."
    explication: "Les Français l'approuvent largement ; elle est promulguée le 4 octobre 1958."
    pieges:
      - { texte: "Par un vote des seuls députés.", pourquoi: "Elle est soumise directement au peuple, par référendum." }
      - { texte: "Par un décret du président de la République.", pourquoi: "Une Constitution n'est pas adoptée par décret : celle de 1958 l'est par référendum." }
  - texte: "Depuis la révision de 1962, comment le président de la République est-il élu ?"
    nom: "Au suffrage universel direct."
    explication: "Approuvée par le référendum du 28 octobre 1962, cette réforme s'applique dès l'élection de 1965 : le président tient sa légitimité du peuple."
    pieges:
      - { texte: "Par les députés et les sénateurs réunis.", pourquoi: "C'était le cas sous la IVe République, pas sous la Ve." }
      - { texte: "Par un collège d'environ 80 000 grands électeurs.", pourquoi: "C'était la règle de 1958 : de Gaulle est élu ainsi en décembre 1958, avant la réforme de 1962." }
  - texte: "Quels accords mettent fin à la guerre d'Algérie, en mars 1962 ?"
    nom: "Les accords d'Évian"
    explication: "Signés le 18 mars 1962, ils sont suivis de l'indépendance de l'Algérie en juillet 1962."
    pieges:
      - { texte: "Les accords de Genève", pourquoi: "Ils mettent fin à la guerre d'Indochine, en 1954." }
      - { texte: "Les accords de Bretton Woods", pourquoi: "Ce sont des accords monétaires internationaux de 1944." }
  - texte: "Quel article de la Constitution de 1958 donne au président des pouvoirs exceptionnels en cas de menace grave ?"
    nom: "L'article 16"
    explication: "Quand les institutions ou l'indépendance de la nation sont menacées gravement, l'article 16 permet au président de prendre les mesures exigées par les circonstances."
    pieges:
      - { texte: "L'article 49, alinéa 3", pourquoi: "Il permet au gouvernement d'engager sa responsabilité sur le vote d'un texte." }
      - { texte: "L'article 1er", pourquoi: "Il dit que la France est une République indivisible, laïque, démocratique et sociale." }
  - texte: "Depuis le référendum de 2000, quelle est la durée du mandat du président ?"
    nom: "Cinq ans : c'est le quinquennat."
    explication: "Le quinquennat, adopté par référendum le 24 septembre 2000, s'applique à partir de l'élection de 2002."
    pieges:
      - { texte: "Sept ans", pourquoi: "C'était le septennat, en vigueur jusqu'en 2002." }
      - { texte: "Quatre ans", pourquoi: "C'est la durée du mandat du président des États-Unis, pas de la France." }
  - texte: "Que fixe la révision constitutionnelle de 2008 pour le président ?"
    nom: "Il ne peut pas exercer plus de deux mandats consécutifs."
    explication: "La loi constitutionnelle du 23 juillet 2008 modifie l'article 6 et renforce aussi le rôle du Parlement."
    pieges:
      - { texte: "Il est désormais élu par le Parlement.", pourquoi: "Il reste élu au suffrage universel direct, comme depuis 1962." }
      - { texte: "Son mandat passe à sept ans.", pourquoi: "Le mandat reste de cinq ans depuis la réforme de 2000." }
  - texte: "Que prévoit la loi du 15 mars 2004 sur la laïcité ?"
    nom: "Elle interdit aux élèves des écoles, collèges et lycées publics les signes religieux ostensibles."
    explication: "Elle réaffirme le principe de laïcité à l'école publique, un siècle après la loi de 1905."
    pieges:
      - { texte: "Elle sépare les Églises et l'État.", pourquoi: "C'est la loi du 9 décembre 1905." }
      - { texte: "Elle interdit toute pratique religieuse en France.", pourquoi: "La laïcité garantit au contraire la liberté de conscience et le libre exercice des cultes." }
  - texte: "Que permet la révision constitutionnelle de 1999 sur la parité ?"
    nom: "La loi peut favoriser l'égal accès des femmes et des hommes aux mandats électoraux et aux fonctions électives."
    explication: "La loi du 6 juin 2000 l'applique : les listes de candidats doivent compter autant de femmes que d'hommes pour plusieurs élections."
    pieges:
      - { texte: "Elle donne le droit de vote aux femmes.", pourquoi: "Les femmes obtiennent le droit de vote en 1944 et votent pour la première fois en 1945." }
      - { texte: "Elle réserve certains mandats aux hommes.", pourquoi: "C'est l'inverse : elle vise l'égalité entre les femmes et les hommes." }
  - texte: "Qu'est-ce que le pacte civil de solidarité (PACS), créé en 1999 ?"
    nom: "Un contrat qui organise la vie commune de deux personnes majeures, de même sexe ou de sexe différent."
    explication: "Créé par la loi du 15 novembre 1999, le PACS reconnaît pour la première fois les couples de même sexe dans le droit civil."
    pieges:
      - { texte: "Un mariage religieux.", pourquoi: "Le PACS est un contrat civil, sans dimension religieuse." }
      - { texte: "Un parti politique.", pourquoi: "C'est un contrat entre deux personnes, pas une organisation politique." }
  - texte: "Que permet la loi du 17 mai 2013 ?"
    nom: "Le mariage des couples de personnes de même sexe."
    explication: "Elle ouvre le mariage et l'adoption aux couples de même sexe : le Code civil évolue avec la société."
    pieges:
      - { texte: "Le divorce.", pourquoi: "Le divorce existe déjà : il est rétabli en France en 1884." }
      - { texte: "La création du PACS.", pourquoi: "Le PACS date de 1999." }

en:
  titre: "The Fifth Republic: birth and change"
  idee: "Born of the Algerian crisis in 1958, the Fifth Republic strengthens the president, elected by direct universal suffrage since 1962. A stable regime, it reforms itself: five-year term, parity, new rights."
  phrases:
    consigne: "Read the question, then touch the right answer."
    question: "{texte}"
    indice: "Landmarks: 1958, Constitution; 1962, Évian Accords and election of the president by direct universal suffrage; 1999, PACS and parity; 2000, five-year term; 2004, secularism at school; 2008, at most two consecutive terms; 2013, marriage."
    exemple: "Example: in 1958, the Algerian War brings down the Fourth Republic. General de Gaulle returns to power and has a new Constitution adopted by referendum, giving more power to the executive."
    demonstration: "{explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Which crisis brings General de Gaulle back to power, in 1958?"
      nom: "The Algerian crisis"
      explication: "On 13 May 1958, in Algiers, supporters of French Algeria rise up; the powerless Fourth Republic calls on de Gaulle."
      pieges:
        - { texte: "The 1929 crisis", pourquoi: "The 1929 crisis is an economic crisis of the interwar years." }
        - { texte: "May 1968", pourquoi: "May 68 takes place ten years later, under the Fifth Republic." }
    - texte: "How is the Constitution of the Fifth Republic adopted?"
      nom: "By referendum, on 28 September 1958."
      explication: "The French approve it by a wide margin; it is promulgated on 4 October 1958."
      pieges:
        - { texte: "By a vote of the deputies alone.", pourquoi: "It is put directly to the people, by referendum." }
        - { texte: "By a decree of the President of the Republic.", pourquoi: "A Constitution isn't adopted by decree: the 1958 one is adopted by referendum." }
    - texte: "Since the 1962 revision, how is the President of the Republic elected?"
      nom: "By direct universal suffrage."
      explication: "Approved by the referendum of 28 October 1962, this reform applies from the 1965 election: the president draws legitimacy from the people."
      pieges:
        - { texte: "By the deputies and senators together.", pourquoi: "That was the case under the Fourth Republic, not the Fifth." }
        - { texte: "By an electoral college of about 80,000 electors.", pourquoi: "That was the 1958 rule: de Gaulle is elected that way in December 1958, before the 1962 reform." }
    - texte: "Which agreements end the Algerian War, in March 1962?"
      nom: "The Évian Accords"
      explication: "Signed on 18 March 1962, they are followed by Algerian independence in July 1962."
      pieges:
        - { texte: "The Geneva Accords", pourquoi: "They end the Indochina War, in 1954." }
        - { texte: "The Bretton Woods agreements", pourquoi: "They are international monetary agreements from 1944." }
    - texte: "Which article of the 1958 Constitution gives the president emergency powers in case of serious threat?"
      nom: "Article 16"
      explication: "When the institutions or the independence of the nation are seriously threatened, Article 16 lets the president take the measures the circumstances require."
      pieges:
        - { texte: "Article 49, paragraph 3", pourquoi: "It lets the government stake its responsibility on the vote of a bill." }
        - { texte: "Article 1", pourquoi: "It says that France is an indivisible, secular, democratic and social Republic." }
    - texte: "Since the 2000 referendum, how long is the president's term?"
      nom: "Five years: the « quinquennat »."
      explication: "The five-year term, adopted by referendum on 24 September 2000, applies from the 2002 election."
      pieges:
        - { texte: "Seven years", pourquoi: "That was the seven-year term, in force until 2002." }
        - { texte: "Four years", pourquoi: "That's the term of the President of the United States, not of France." }
    - texte: "What does the 2008 constitutional revision set for the president?"
      nom: "He or she can't serve more than two consecutive terms."
      explication: "The constitutional law of 23 July 2008 amends Article 6 and also strengthens Parliament's role."
      pieges:
        - { texte: "He or she is now elected by Parliament.", pourquoi: "The president is still elected by direct universal suffrage, as since 1962." }
        - { texte: "The term goes up to seven years.", pourquoi: "The term stays at five years since the 2000 reform." }
    - texte: "What does the law of 15 March 2004 on secularism provide?"
      nom: "It bans conspicuous religious symbols for pupils in state primary and secondary schools."
      explication: "It reaffirms the principle of secularism in state schools, a century after the 1905 law."
      pieges:
        - { texte: "It separates the Churches and the State.", pourquoi: "That's the law of 9 December 1905." }
        - { texte: "It bans all religious practice in France.", pourquoi: "On the contrary, secularism guarantees freedom of conscience and the free exercise of worship." }
    - texte: "What does the 1999 constitutional revision on parity allow?"
      nom: "The law can promote equal access for women and men to elected office."
      explication: "The law of 6 June 2000 applies it: candidate lists must include as many women as men for several elections."
      pieges:
        - { texte: "It gives women the right to vote.", pourquoi: "Women obtain the right to vote in 1944 and vote for the first time in 1945." }
        - { texte: "It reserves certain offices for men.", pourquoi: "The opposite: it aims at equality between women and men." }
    - texte: "What is the civil solidarity pact (PACS), created in 1999?"
      nom: "A contract organising the shared life of two adults, of the same sex or of different sexes."
      explication: "Created by the law of 15 November 1999, the PACS recognises same-sex couples in civil law for the first time."
      pieges:
        - { texte: "A religious marriage.", pourquoi: "The PACS is a civil contract, with no religious dimension." }
        - { texte: "A political party.", pourquoi: "It's a contract between two people, not a political organisation." }
    - texte: "What does the law of 17 May 2013 allow?"
      nom: "Marriage for same-sex couples."
      explication: "It opens marriage and adoption to same-sex couples: the Civil Code changes with society."
      pieges:
        - { texte: "Divorce.", pourquoi: "Divorce already exists: it is reinstated in France in 1884." }
        - { texte: "The creation of the PACS.", pourquoi: "The PACS dates from 1999." }
