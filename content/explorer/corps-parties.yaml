id: corps-parties
titre: "Les parties du corps"
niveau: MS
prerequis: []
programme: { source: c1, texte: "Identifier et nommer les parties du corps humain : placer les pièces d’un puzzle représentant le corps humain en nommant les bras, les mains, les jambes, la tête, le cou, le tronc, etc." }
activite: corps
parametres: {}
idee: "Notre corps a une tête, un cou, un tronc, des bras, des mains, des jambes et des pieds."
phrases:
  consigne: "Écoute bien, puis touche la partie du corps demandée sur le dessin."
  question: "{texte}"
  indice: "Montre-la d'abord sur ton propre corps."
  exemple: "Essaie une autre partie."
  demonstration: "Regarde : {explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Touche la tête."
    cible: tete
    explication: "Voici la tête."
  - texte: "Touche le cou."
    cible: cou
    explication: "Voici le cou."
  - texte: "Touche le tronc."
    cible: tronc
    explication: "Voici le tronc."
  - texte: "Touche les bras."
    cible: bras
    explication: "Voici les bras."
  - texte: "Touche les mains."
    cible: mains
    explication: "Voici les mains."
  - texte: "Touche les jambes."
    cible: jambes
    explication: "Voici les jambes."
  - texte: "Touche les pieds."
    cible: pieds
    explication: "Voici les pieds."
  # À quoi sert chaque partie, et où va chaque vêtement : la même notion, posée autrement (ADR 0037).
  - texte: "Avec quoi marches-tu ? Touche-les."
    cible: jambes
    explication: "On marche avec les jambes, et les pieds se posent par terre."
  - texte: "Où mets-tu tes chaussures ?"
    cible: pieds
    explication: "Les chaussures vont aux pieds."
  - texte: "Où mets-tu ton bonnet ?"
    cible: tete
    explication: "Le bonnet va sur la tête."
  - texte: "Où mets-tu ton écharpe ?"
    cible: cou
    explication: "L'écharpe s'enroule autour du cou."
  - texte: "Où mets-tu tes gants ?"
    cible: mains
    explication: "Les gants vont aux mains."
  - texte: "Avec quoi attrapes-tu un ballon ? Touche-les."
    cible: mains
    explication: "On attrape le ballon avec les mains."
  - texte: "Qu'est-ce qui relie la tête au tronc ?"
    cible: cou
    explication: "Le cou relie la tête au tronc."
  - texte: "Sur quelle partie du corps sont attachés les bras et les jambes ?"
    cible: tronc
    explication: "Les bras et les jambes sont attachés au tronc."
  - texte: "Avec quoi shootes-tu dans un ballon ?"
    cible: pieds
    explication: "On shoote avec le pied."
  - texte: "Où sont tes yeux, ton nez et ta bouche ?"
    cible: tete
    explication: "Les yeux, le nez et la bouche sont sur le visage, sur la tête."
  - texte: "Où mets-tu les manches de ton pull ?"
    cible: bras
    explication: "Les manches couvrent les bras."
  - texte: "Où mets-tu ton tee-shirt ?"
    cible: tronc
    explication: "Le tee-shirt couvre le tronc."

en:
  titre: "Parts of the body"
  idee: "Our body has a head, a neck, a trunk, arms, hands, legs and feet."
  phrases:
    consigne: "Listen carefully, then touch the part of the body I ask for on the drawing."
    question: "{texte}"
    indice: "Point to it on your own body first."
    exemple: "Try another part."
    demonstration: "Look: {explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Touch the head."
      cible: tete
      explication: "Here is the head."
    - texte: "Touch the neck."
      cible: cou
      explication: "Here is the neck."
    - texte: "Touch the trunk."
      cible: tronc
      explication: "Here is the trunk: the middle part of the body."
    - texte: "Touch the arms."
      cible: bras
      explication: "Here are the arms."
    - texte: "Touch the hands."
      cible: mains
      explication: "Here are the hands."
    - texte: "Touch the legs."
      cible: jambes
      explication: "Here are the legs."
    - texte: "Touch the feet."
      cible: pieds
      explication: "Here are the feet."
    - texte: "What do you walk with? Touch them."
      cible: jambes
      explication: "We walk with our legs, and our feet go on the ground."
    - texte: "Where do you put your shoes?"
      cible: pieds
      explication: "Shoes go on your feet."
    - texte: "Where do you put your woolly hat?"
      cible: tete
      explication: "A woolly hat goes on your head."
    - texte: "Where do you put your scarf?"
      cible: cou
      explication: "A scarf wraps around your neck."
    - texte: "Where do you put your gloves?"
      cible: mains
      explication: "Gloves go on your hands."
    - texte: "What do you catch a ball with? Touch them."
      cible: mains
      explication: "We catch a ball with our hands."
    - texte: "What joins the head to the trunk?"
      cible: cou
      explication: "The neck joins the head to the trunk."
    - texte: "Which part of the body are the arms and legs joined to?"
      cible: tronc
      explication: "The arms and legs are joined to the trunk."
    - texte: "What do you kick a ball with?"
      cible: pieds
      explication: "We kick with our foot."
    - texte: "Where are your eyes, nose and mouth?"
      cible: tete
      explication: "The eyes, nose and mouth are on your face, on your head."
    - texte: "Where do the sleeves of your jumper go?"
      cible: bras
      explication: "Sleeves cover your arms."
    - texte: "Where do you put your T-shirt?"
      cible: tronc
      explication: "A T-shirt covers your trunk."
