id: mondialisation-territoires
titre: "Territoires, coopérations et tensions dans la mondialisation"
niveau: Terminale
prerequis: [mers-oceans]
programme: { source: hgtle, texte: "Dynamiques territoriales, coopérations et tensions dans la mondialisation : des territoires inégalement intégrés dans la mondialisation ; coopérations, tensions et régulations aux échelles mondiale, régionale et locale ; la France : un rayonnement international différencié et une inégale attractivité dans la mondialisation." }
activite: quiz
parametres: {}
idee: "La mondialisation hiérarchise les territoires : des centres très intégrés, des périphéries plus à l'écart. Les États coopèrent dans des ensembles régionaux, avec des tensions. La France rayonne, mais inégalement."
phrases:
  consigne: "Lis la question, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Mots clés : centre, périphérie, intégration, attractivité, rayonnement, coopération régionale (Union européenne, ASEAN, MERCOSUR), libre-échange, souveraineté."
  exemple: "Exemple : à Shanghai, le quartier d'affaires de Pudong et le port de Yangshan sont très intégrés à la mondialisation, tandis que des quartiers d'habitat précaire restent à l'écart. Centres et périphéries existent aussi dans une même ville."
  demonstration: "{explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Pourquoi dit-on que la mondialisation est un processus « sélectif » ?"
    nom: "Parce qu'elle intègre fortement certains territoires et en laisse d'autres plus à l'écart."
    explication: "Des centres s'affirment et des périphéries se dessinent, à toutes les échelles : la hiérarchie des territoires change sans cesse."
    pieges:
      - { texte: "Parce que tous les territoires y participent de la même façon.", pourquoi: "C'est l'inverse : les territoires sont inégalement intégrés." }
      - { texte: "Parce qu'elle ne concerne que l'Europe.", pourquoi: "Elle touche le monde entier, avec des centres en Asie, en Europe et en Amérique." }
  - texte: "D'après le programme de Terminale de 2019, où se trouvent la plupart des plus grands centres financiers ?"
    nom: "En Asie : cinq, contre trois en Europe et deux en Amérique du Nord."
    explication: "Les centres européens cités sont Londres, Zurich et Francfort : la hiérarchie des centres de décision évolue sans cesse."
    pieges:
      - { texte: "Tous en Europe.", pourquoi: "L'Europe en compte trois, l'Asie cinq." }
      - { texte: "Surtout en Amérique du Nord.", pourquoi: "L'Amérique du Nord en compte deux, moins que l'Asie." }
  - texte: "Avec la mondialisation, la distance compte-t-elle encore ?"
    nom: "Oui : elle est moins contraignante, mais reste importante, et des barrières limitent les échanges."
    explication: "Les transports la réduisent, mais la distance et les protections mises en place par les États freinent encore les échanges."
    pieges:
      - { texte: "Non, elle ne compte plus du tout.", pourquoi: "Elle reste un facteur contraignant, même s'il l'est moins qu'avant." }
      - { texte: "Non, car il n'existe plus aucune barrière commerciale.", pourquoi: "Des protections et des barrières sont mises en place, qui limitent les échanges." }
  - texte: "Que désigne le sigle ASEAN ?"
    nom: "L'Association des Nations du Sud-Est asiatique."
    explication: "Sa coopération vise à limiter les tensions entre États, tout en leur laissant une forte souveraineté."
    pieges:
      - { texte: "Un accord des pays d'Amérique du Nord.", pourquoi: "En Amérique du Nord, le programme cite l'ALENA." }
      - { texte: "Une alliance des nations européennes.", pourquoi: "En Europe, la grande coopération régionale est l'Union européenne." }
  - texte: "Quelle logique suit le MERCOSUR, le Marché commun du Cône sud ?"
    nom: "Le libre-échange entre ses membres, sans grande délégation de souveraineté."
    explication: "C'est une différence avec l'Union européenne, où les États délèguent une part de leur souveraineté."
    pieges:
      - { texte: "Une union où les États délèguent beaucoup de souveraineté, comme l'Union européenne.", pourquoi: "Cette forte délégation est propre à l'Union européenne, pas au MERCOSUR." }
      - { texte: "Une alliance militaire.", pourquoi: "C'est un marché commun : il porte sur les échanges." }
  - texte: "D'après le programme, quel effet l'Union européenne a-t-elle eu sur les inégalités entre territoires ?"
    nom: "Un rattrapage considérable du sud de l'Europe, mais les écarts entre régions se réduisent plus lentement."
    explication: "Ses politiques de cohésion cherchent à la fois à réduire les inégalités et à valoriser les atouts des territoires."
    pieges:
      - { texte: "Elle a creusé l'écart entre le nord et le sud.", pourquoi: "C'est l'inverse : le sud a fortement rattrapé le nord." }
      - { texte: "Elle a fait disparaître toutes les inégalités régionales.", pourquoi: "Les écarts entre régions se réduisent, mais lentement." }
  - texte: "Quel signe montre l'attractivité de la France dans la mondialisation ?"
    nom: "Elle accueille le siège d'institutions internationales, comme l'UNESCO, l'OCDE ou Interpol."
    explication: "Paris et les grandes métropoles attirent aussi des filiales d'entreprises étrangères, de grands événements et des touristes."
    pieges:
      - { texte: "Elle n'accueille aucune organisation internationale.", pourquoi: "Elle en accueille de nombreuses, surtout à Paris et dans les métropoles." }
      - { texte: "Ses entreprises ne s'installent jamais à l'étranger.", pourquoi: "De grandes firmes françaises s'implantent au contraire dans de nombreux pays." }
  - texte: "En France, tous les territoires sont-ils aussi intégrés à la mondialisation ?"
    nom: "Non : les métropoles et des vignobles réputés le sont fortement, le Limousin ou la Nièvre restent plus à l'écart."
    explication: "L'intégration est différenciée : elle ne concerne pas que les métropoles, et certains territoires ont peu de rayonnement."
    pieges:
      - { texte: "Oui, toute la France est intégrée de la même façon.", pourquoi: "Certains territoires restent plus à l'écart, avec peu de rayonnement et d'attractivité." }
      - { texte: "Seules les campagnes y participent.", pourquoi: "Les métropoles concentrent sièges d'entreprises et infrastructures : elles sont au cœur de l'intégration." }

en:
  titre: "Territories, cooperation and tensions in globalisation"
  idee: "Globalisation ranks territories: highly integrated centres, peripheries further out. States cooperate in regional groupings, with tensions. France has worldwide influence, but unevenly."
  phrases:
    consigne: "Read the question, then touch the right answer."
    question: "{texte}"
    indice: "Key words: centre, periphery, integration, attractiveness, influence, regional cooperation (European Union, ASEAN, MERCOSUR), free trade, sovereignty."
    exemple: "Example: in Shanghai, the Pudong business district and the port of Yangshan are highly integrated into globalisation, while districts of poor housing stay on the sidelines. Centres and peripheries also exist within one city."
    demonstration: "{explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Why is globalisation called a « selective » process?"
      nom: "Because it strongly integrates some territories and leaves others further out."
      explication: "Centres emerge and peripheries take shape, at every scale: the ranking of territories keeps changing."
      pieges:
        - { texte: "Because every territory takes part in the same way.", pourquoi: "It's the opposite: territories are unevenly integrated." }
        - { texte: "Because it only concerns Europe.", pourquoi: "It affects the whole world, with centres in Asia, Europe and America." }
    - texte: "According to the 2019 Year 13 (Terminale) curriculum, where are most of the biggest financial centres?"
      nom: "In Asia: five, against three in Europe and two in North America."
      explication: "The European centres named are London, Zurich and Frankfurt: the ranking of decision centres keeps changing."
      pieges:
        - { texte: "All in Europe.", pourquoi: "Europe has three, Asia five." }
        - { texte: "Mostly in North America.", pourquoi: "North America has two, fewer than Asia." }
    - texte: "With globalisation, does distance still matter?"
      nom: "Yes: it is less of a constraint, but still important, and barriers limit trade."
      explication: "Transport shrinks it, but distance and the protections set up by states still slow trade down."
      pieges:
        - { texte: "No, it doesn't matter at all any more.", pourquoi: "It is still a constraint, even if less than before." }
        - { texte: "No, because there are no trade barriers left.", pourquoi: "Protections and barriers are set up, and they limit trade." }
    - texte: "What does the acronym ASEAN stand for?"
      nom: "The Association of Southeast Asian Nations."
      explication: "Its cooperation aims to limit tensions between states, while leaving them a lot of sovereignty."
      pieges:
        - { texte: "An agreement between North American countries.", pourquoi: "For North America, the curriculum names NAFTA (ALENA)." }
        - { texte: "An alliance of European nations.", pourquoi: "In Europe, the major regional cooperation is the European Union." }
    - texte: "What logic does MERCOSUR, the Southern Common Market, follow?"
      nom: "Free trade between its members, without much transfer of sovereignty."
      explication: "That is a difference from the European Union, where states transfer part of their sovereignty."
      pieges:
        - { texte: "A union where states transfer a lot of sovereignty, like the European Union.", pourquoi: "This strong transfer is specific to the European Union, not MERCOSUR." }
        - { texte: "A military alliance.", pourquoi: "It is a common market: it is about trade." }
    - texte: "According to the curriculum, what effect has the European Union had on inequalities between territories?"
      nom: "Southern Europe has caught up considerably, but gaps between regions are shrinking more slowly."
      explication: "Its cohesion policies aim both to reduce inequalities and to make the most of territories' strengths."
      pieges:
        - { texte: "It has widened the gap between north and south.", pourquoi: "It's the opposite: the south has caught up a lot with the north." }
        - { texte: "It has removed all regional inequalities.", pourquoi: "Gaps between regions are shrinking, but slowly." }
    - texte: "Which sign shows France's attractiveness in globalisation?"
      nom: "It hosts the headquarters of international bodies, such as UNESCO, the OECD or Interpol."
      explication: "Paris and the big cities also attract subsidiaries of foreign companies, major events and tourists."
      pieges:
        - { texte: "It hosts no international organisation.", pourquoi: "It hosts many, especially in Paris and the big cities." }
        - { texte: "Its companies never set up abroad.", pourquoi: "On the contrary, big French firms set up in many countries." }
    - texte: "In France, are all territories equally integrated into globalisation?"
      nom: "No: big cities and famous vineyards are strongly integrated, while the Limousin or the Nièvre stay further out."
      explication: "Integration is uneven: it is not only about big cities, and some territories have little influence."
      pieges:
        - { texte: "Yes, all of France is integrated in the same way.", pourquoi: "Some territories stay further out, with little influence or attractiveness." }
        - { texte: "Only the countryside takes part.", pourquoi: "Big cities concentrate company headquarters and infrastructure: they are at the heart of integration." }
