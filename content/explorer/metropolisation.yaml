id: metropolisation
titre: "La métropolisation, dans le monde et en France"
niveau: 1re
prerequis: [mobilites-migrations]
programme: { source: hg1re, texte: "La métropolisation renforce le poids de Paris (ville primatiale) et recompose les dynamiques urbaines." }
activite: quiz
parametres: {}
idee: "Plus de la moitié de l'humanité vit en ville. Les métropoles concentrent habitants, activités et pouvoirs de décision. En France, Paris domine, les métropoles régionales grandissent, certaines petites villes déclinent."
phrases:
  consigne: "Lis la question, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Mots clés : urbanisation, métropole, fonctions de commandement, étalement urbain, ville primatiale, mégalopole."
  exemple: "Exemple : à La Défense, près de Paris, se concentrent des sièges de grandes entreprises. Ces centres de décision, qui dirigent des activités dans le monde entier, sont des fonctions de commandement typiques d'une métropole."
  demonstration: "{explication}"
  bravo: "Oui ! {explication}"
items:
  - texte: "Depuis quand environ la moitié de la population mondiale vit-elle en ville ?"
    nom: "Depuis 2007."
    explication: "Depuis 2007, la moitié de l'humanité vit en ville, et cette part continue d'augmenter."
    pieges:
      - { texte: "Depuis 1800.", pourquoi: "En 1800, la très grande majorité des humains vivait à la campagne ; l'urbanisation massive est bien plus récente." }
      - { texte: "Cela n'est jamais arrivé.", pourquoi: "Le seuil de la moitié est franchi : la population urbaine continue même de progresser." }
  - texte: "Qu'est-ce que la métropolisation ?"
    nom: "La concentration des populations, des activités et des fonctions de commandement dans les grandes villes."
    explication: "Les métropoles attirent les sièges d'entreprises, les universités, les institutions : elles dirigent des territoires bien plus vastes qu'elles."
    pieges:
      - { texte: "Le simple fait qu'une ville ait beaucoup d'habitants.", pourquoi: "Une ville très peuplée n'est pas forcément une métropole : il faut aussi des fonctions de commandement et un rayonnement." }
      - { texte: "Le départ des habitants des villes vers les campagnes.", pourquoi: "C'est le mouvement inverse : la métropolisation concentre." }
  - texte: "Parmi ces éléments, lequel est une caractéristique métropolitaine ?"
    nom: "Un quartier d'affaires et un grand nœud de transports, comme un aéroport international."
    explication: "Quartier d'affaires, grands équipements culturels, universités et centres de recherche, nœuds de transport : ce sont des signes de métropole."
    pieges:
      - { texte: "Une église et une mairie.", pourquoi: "Presque toutes les communes en ont : cela ne distingue pas une métropole." }
      - { texte: "Des champs cultivés autour de la ville.", pourquoi: "Beaucoup de villes en ont ; ce n'est pas ce qui fait le rayonnement d'une métropole." }
  - texte: "Qu'est-ce que l'étalement urbain ?"
    nom: "L'extension de la ville sur ses périphéries, souvent en lotissements et zones d'activités."
    explication: "La ville grignote les espaces agricoles et naturels ; les trajets quotidiens s'allongent, souvent en voiture."
    pieges:
      - { texte: "La construction de tours au centre-ville.", pourquoi: "Construire en hauteur densifie la ville ; l'étalement, lui, l'étend en surface." }
      - { texte: "La disparition des villes.", pourquoi: "C'est au contraire une croissance de la ville vers l'extérieur." }
  - texte: "Pourquoi dit-on que les métropoles sont aussi des espaces d'inégalités, comme Mumbai ?"
    nom: "Parce que des quartiers d'affaires très riches y côtoient des bidonvilles."
    explication: "La métropolisation accentue les contrastes : richesse et pauvreté se trouvent parfois à quelques rues d'écart."
    pieges:
      - { texte: "Parce que tous les habitants y sont riches.", pourquoi: "On associe souvent métropole et richesse ; une partie des habitants vit dans une grande pauvreté." }
      - { texte: "Parce que tous les habitants y sont pauvres.", pourquoi: "Les métropoles concentrent aussi d'immenses richesses : ce sont les écarts qui frappent." }
  - texte: "Pourquoi dit-on que Paris est une « ville primatiale » ?"
    nom: "Parce qu'elle domine très nettement les autres villes françaises par sa population et ses fonctions."
    explication: "L'agglomération parisienne est bien plus peuplée que la deuxième ville de France et concentre pouvoirs politiques, économiques et culturels."
    pieges:
      - { texte: "Parce que c'est la plus ancienne ville de France.", pourquoi: "D'autres villes, comme Marseille, sont plus anciennes : « primatiale » parle de domination, pas d'âge." }
      - { texte: "Parce qu'elle est au centre géographique de la France.", pourquoi: "Paris est au nord du pays ; le mot parle de son poids, pas de sa position." }
  - texte: "Quelle évolution connaissent beaucoup de métropoles régionales, comme Lyon, Toulouse ou Bordeaux ?"
    nom: "Elles gagnent en attractivité, mais de façon inégale, et se font concurrence."
    explication: "Emplois, universités, transports rapides : les métropoles régionales grandissent, chacune avec ses atouts."
    pieges:
      - { texte: "Elles perdent toutes leurs habitants au profit de Paris.", pourquoi: "Beaucoup de métropoles régionales gagnent au contraire des habitants." }
      - { texte: "Elles sont toutes identiques.", pourquoi: "Leur attractivité et leur influence diffèrent beaucoup d'une métropole à l'autre." }
  - texte: "En 2018, l'État lance le programme « Action cœur de ville » pour 222 villes moyennes. Quel problème vise-t-il ?"
    nom: "La dévitalisation des centres-villes : commerces fermés, logements vides."
    explication: "Certaines villes petites et moyennes sont mises à l'écart par la métropolisation ; d'autres connaissent un renouveau grâce à leur dynamisme local et leur cadre de vie."
    pieges:
      - { texte: "La surpopulation des centres-villes.", pourquoi: "Le problème est au contraire le départ d'habitants et de commerces." }
      - { texte: "Le manque de métropoles en France.", pourquoi: "Le programme vise des villes moyennes, pas la création de métropoles." }

en:
  titre: "Metropolisation, in the world and in France"
  idee: "More than half of humanity lives in towns and cities. Metropolises concentrate people, activities and decision-making power. In France, Paris dominates, regional metropolises grow, some small towns decline."
  phrases:
    consigne: "Read the question, then touch the right answer."
    question: "{texte}"
    indice: "Key words: urbanisation, metropolis, command functions, urban sprawl, primate city, megalopolis."
    exemple: "Example: at La Défense, near Paris, the head offices of big companies are concentrated. These decision centres, which run activities all over the world, are typical command functions of a metropolis."
    demonstration: "{explication}"
    bravo: "Yes! {explication}"
  items:
    - texte: "Since about when has half the world's population lived in towns and cities?"
      nom: "Since 2007."
      explication: "Since 2007, half of humanity has lived in towns and cities, and the share keeps rising."
      pieges:
        - { texte: "Since 1800.", pourquoi: "In 1800, the vast majority of people lived in the countryside; mass urbanisation is much more recent." }
        - { texte: "It has never happened.", pourquoi: "The halfway mark has been passed: the urban population is still growing." }
    - texte: "What is metropolisation?"
      nom: "The concentration of people, activities and command functions in big cities."
      explication: "Metropolises attract company head offices, universities and institutions: they run areas much larger than themselves."
      pieges:
        - { texte: "Simply a city having many inhabitants.", pourquoi: "A very populous city isn't necessarily a metropolis: it also needs command functions and influence." }
        - { texte: "People leaving cities for the countryside.", pourquoi: "That's the opposite movement: metropolisation concentrates." }
    - texte: "Which of these is a typical feature of a metropolis?"
      nom: "A business district and a major transport hub, such as an international airport."
      explication: "Business district, major cultural venues, universities and research centres, transport hubs: these are signs of a metropolis."
      pieges:
        - { texte: "A church and a town hall.", pourquoi: "Almost every town has them: they don't mark out a metropolis." }
        - { texte: "Farmland around the city.", pourquoi: "Many cities have it; it isn't what gives a metropolis its influence." }
    - texte: "What is urban sprawl?"
      nom: "The spread of the city over its outskirts, often as housing estates and business parks."
      explication: "The city eats into farmland and natural areas; daily journeys get longer, often by car."
      pieges:
        - { texte: "Building tower blocks in the city centre.", pourquoi: "Building upwards makes the city denser; sprawl spreads it outwards." }
        - { texte: "Cities disappearing.", pourquoi: "On the contrary, it's the city growing outwards." }
    - texte: "Why do we say metropolises are also places of inequality, like Mumbai?"
      nom: "Because very rich business districts sit next to slums."
      explication: "Metropolisation sharpens contrasts: wealth and poverty are sometimes just a few streets apart."
      pieges:
        - { texte: "Because all their inhabitants are rich.", pourquoi: "Metropolises are often linked with wealth; part of their population lives in great poverty." }
        - { texte: "Because all their inhabitants are poor.", pourquoi: "Metropolises also concentrate huge wealth: it's the gaps that stand out." }
    - texte: "Why do we say Paris is a « primate city »?"
      nom: "Because it clearly dominates the other French cities by its population and functions."
      explication: "The Paris urban area is far more populous than France's second city and concentrates political, economic and cultural power."
      pieges:
        - { texte: "Because it is the oldest city in France.", pourquoi: "Other cities, such as Marseille, are older: « primate » is about dominance, not age." }
        - { texte: "Because it is at the geographical centre of France.", pourquoi: "Paris is in the north of the country; the word is about its weight, not its position." }
    - texte: "How are many regional metropolises, such as Lyon, Toulouse or Bordeaux, changing?"
      nom: "They are becoming more attractive, but unevenly, and they compete with each other."
      explication: "Jobs, universities, fast transport: regional metropolises are growing, each with its own strengths."
      pieges:
        - { texte: "They are all losing their inhabitants to Paris.", pourquoi: "Many regional metropolises are, on the contrary, gaining inhabitants." }
        - { texte: "They are all the same.", pourquoi: "Their appeal and influence differ a lot from one metropolis to another." }
    - texte: "In 2018, the State launches the « Action cœur de ville » programme for 222 medium-sized towns. Which problem does it target?"
      nom: "Declining town centres: closed shops, empty housing."
      explication: "Some small and medium-sized towns are left behind by metropolisation; others enjoy a revival thanks to local dynamism and their quality of life."
      pieges:
        - { texte: "Overcrowded town centres.", pourquoi: "The problem is, on the contrary, people and shops leaving." }
        - { texte: "France lacking metropolises.", pourquoi: "The programme targets medium-sized towns, not creating metropolises." }
