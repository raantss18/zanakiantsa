        - { texte: "x = 8", pourquoi: "There are two solutions: either factor can be zero." }
    - texte: "Solve: (x + 1)(x + 9) = 0"
      nom: "x = −1 or x = −9"
      explication: "A product is zero if one of the factors is zero: x + 1 = 0 or x + 9 = 0, so x = −1 or x = −9."
      pieges:
