id: casser-dizaine
titre: Soustraire en cassant une dizaine
niveau: CP
prerequis: [dizaines-construire]
programme: { source: cycle2, texte: "Soustraire un nombre inférieur à 10 à un nombre entier de dizaines : l’élève sait qu’il peut « casser » une dizaine afin de lui retirer le nombre à soustraire." }
activite: batonnets
parametres: { mode: casser, min: 10, max: 50 }
variantes: ["{n} bâtonnets, moins {b} : combien en reste-t-il ?", "Il y a {n} bâtonnets. Retire-en {b}. Combien en reste-t-il ?"]
idee: "Pour enlever des bâtonnets quand il n'y a que des paquets, on défait un paquet : il devient dix bâtonnets."
phrases:
  consigne: "Pour enlever des bâtonnets, défais d'abord un paquet de dix. Puis touche le nombre de bâtonnets qui restent."
  question: "Il y a {n} bâtonnets. Enlève-en {b}. Combien en reste-t-il ?"
  indice: "Touche un paquet : il devient dix bâtonnets. Puis enlève-en {b}, un par un."
  exemple: "Dix moins {b}, puis ajoute les autres paquets de dix."
  demonstration: "Regarde : je défais un paquet et j'enlève {b} bâtonnets. Il en reste {reste}."
  bravo: "Oui ! {n} moins {b}, il reste {reste}."

en:
  titre: "Subtracting by breaking a ten"
  idee: "To take sticks away when there are only bundles, undo a bundle: it becomes ten sticks."
  phrases:
    consigne: "To take sticks away, first undo a bundle of ten. Then touch the number of sticks left."
    question: "There are {n} sticks. Take away {b}. How many are left?"
    indice: "Touch a bundle: it becomes ten sticks. Then take away {b}, one by one."
    exemple: "Ten take away {b}, then add the other bundles of ten."
    demonstration: "Look: I undo a bundle and take away {b} sticks. {reste} are left."
    bravo: "Yes! {n} take away {b} leaves {reste}."
  variantes: ["{n} sticks, take away {b}: how many are left?", "There are {n} sticks. Take away {b}. How many are left?"]
