id: variables-aleatoires
titre: "Variables aléatoires et espérance"
niveau: 1re
prerequis: ["probabilites-conditionnelles", "moyenne-mediane"]
programme: { source: lycee1re, texte: "Calculer une espérance, une variance, un écart type. Utiliser la notion d’espérance dans une résolution de problème (mise pour un jeu équitable, etc.)." }
activite: quiz
parametres: {}
idee: "Une variable aléatoire X associe un nombre à chaque issue. Son espérance E(X) est la somme des valeurs multipliées par leurs probabilités : la moyenne obtenue sur un très grand nombre d’essais."
phrases:
  consigne: "Écris la loi de X, puis touche la bonne réponse."
  question: "{texte}"
  indice: "E(X) = x1 × p1 + x2 × p2 + … : chaque valeur multipliée par sa probabilité, puis on additionne."
  exemple: "X vaut 2 avec la probabilité 0,4 et 5 avec la probabilité 0,6. E(X) = 2 × 0,4 + 5 × 0,6 = 0,8 + 3 = 3,8."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
  - texte: "X prend les valeurs 0, 10 et 20 avec les probabilités 0,5 ; 0,3 et 0,2. Combien vaut E(X) ?"
    nom: "7"
    explication: "E(X) = 0 × 0,5 + 10 × 0,3 + 20 × 0,2 = 0 + 3 + 4 = 7."
    pieges:
      - { texte: "10", pourquoi: "10 est la moyenne des trois valeurs sans tenir compte des probabilités ; 0 est le plus probable." }
      - { texte: "1", pourquoi: "1 est la somme des probabilités, 0,5 + 0,3 + 0,2 ; il faut multiplier chaque valeur par sa probabilité." }
  - texte: "X prend les valeurs 1, 2 et 3. P(X = 1) = 0,2 et P(X = 2) = 0,5. Combien vaut P(X = 3) ?"
    nom: "0,3"
    explication: "Les probabilités d’une loi ont pour somme 1 : P(X = 3) = 1 − 0,2 − 0,5 = 0,3."
    pieges:
      - { texte: "0,7", pourquoi: "0,7 = 0,2 + 0,5, c’est la probabilité que X vaille 1 ou 2." }
      - { texte: "1/3", pourquoi: "Les trois valeurs ne sont pas équiprobables : 0,2 et 0,5 sont déjà différentes." }
  - texte: "On lance un dé équilibré. On gagne 6 € si on fait 6, sinon on perd 1 €. Quelle est l’espérance du gain ?"
    nom: "1/6 d’euro, environ 0,17 €"
    explication: "E = 6 × 1/6 + (−1) × 5/6 = 1 − 5/6 = 1/6, environ 0,17 €."
    pieges:
      - { texte: "2,5 €", pourquoi: "C’est la moyenne de 6 et de −1 ; perdre 1 € arrive 5 fois sur 6, pas une fois sur deux." }
      - { texte: "1 €", pourquoi: "6 × 1/6 = 1, mais il faut aussi compter la perte : − 5/6." }
  - texte: "On mise m € pour jouer. On gagne 10 € avec la probabilité 0,2, rien sinon. Quelle mise rend le jeu équitable ?"
    nom: "2 €"
    explication: "Le jeu est équitable quand l’espérance du gain net est nulle : 10 × 0,2 − m = 0, donc m = 2."
    pieges:
      - { texte: "10 €", pourquoi: "On ne gagne 10 € qu’une fois sur 5 : en moyenne, 2 € par partie." }
      - { texte: "0,2 €", pourquoi: "0,2 est la probabilité de gagner, pas un montant : 10 × 0,2 = 2 €." }
  - texte: "E(X) = 4. Combien vaut E(3X + 2) ?"
    nom: "14"
    explication: "L’espérance est linéaire : E(3X + 2) = 3 × E(X) + 2 = 3 × 4 + 2 = 14."
    pieges:
      - { texte: "12", pourquoi: "Le + 2 compte aussi : 3 × 4 + 2 = 14." }
      - { texte: "18", pourquoi: "On multiplie E(X) par 3, puis on ajoute 2 : 3 × 4 + 2, pas 3 × (4 + 2)." }
  - texte: "X vaut −1 ou 1, chacun avec la probabilité 0,5. Combien vaut sa variance V(X) ?"
    nom: "1"
    explication: "E(X) = −0,5 + 0,5 = 0. V(X) = 0,5 × (−1 − 0)² + 0,5 × (1 − 0)² = 0,5 + 0,5 = 1."
    pieges:
      - { texte: "0", pourquoi: "0 est l’espérance ; la variance mesure l’écart autour d’elle, ici 1." }
      - { texte: "0,5", pourquoi: "Il y a deux termes, 0,5 × 1 et 0,5 × 1 : leur somme vaut 1." }
  - texte: "Complète : X vaut 0 ou 4, chacun avec la probabilité 0,5, et E(X) = 2. V(X) = 0,5 × (0 − 2)² + 0,5 × (4 − 2)² = …"
    nom: "4"
    explication: "(0 − 2)² = 4 et (4 − 2)² = 4 : V(X) = 0,5 × 4 + 0,5 × 4 = 4. L’écart type vaut √4 = 2."
    pieges:
      - { texte: "2", pourquoi: "2 est l’écart type, la racine carrée de la variance : √4 = 2." }
      - { texte: "0", pourquoi: "Les écarts sont élevés au carré : (0 − 2)² = 4, positif, ils ne s’annulent pas." }
  - texte: "Au jeu du dé, l’espérance du gain vaut 1/6 d’euro, alors qu’on gagne 6 € ou qu’on perd 1 €. Pourquoi ?"
    nom: "L’espérance est le gain moyen sur un très grand nombre de parties, pas le gain d’une partie."
    explication: "E(X) est une moyenne pondérée par les probabilités : sur 600 parties, on s’attend à gagner environ 100 € (600 × 1/6), pas à gagner 1/6 d’euro à chaque fois."
    pieges:
      - { texte: "Parce que le calcul est approché.", pourquoi: "1/6 est la valeur exacte ; 0,17 n’en est que l’arrondi." }
      - { texte: "Parce que l’espérance est la valeur la plus probable.", pourquoi: "La plus probable est de perdre 1 € (5 chances sur 6), pas de gagner 1/6 d’euro." }

en:
  titre: "Random variables and expected value"
  idee: "A random variable X gives a number to each outcome. Its expected value E(X) is the sum of the values times their probabilities: the mean you get over a very large number of trials."
  phrases:
    consigne: "Write the distribution of X, then touch the right answer."
    question: "{texte}"
    indice: "E(X) = x1 × p1 + x2 × p2 + …: multiply each value by its probability, then add up."
    exemple: "X is 2 with probability 0.4 and 5 with probability 0.6. E(X) = 2 × 0.4 + 5 × 0.6 = 0.8 + 3 = 3.8."
    demonstration: "{explication}"
    bravo: "Yes! The answer is {bonne}."
  items:
    - texte: "X takes the values 0, 10 and 20 with probabilities 0.5, 0.3 and 0.2. What is E(X)?"
      nom: "7"
      explication: "E(X) = 0 × 0.5 + 10 × 0.3 + 20 × 0.2 = 0 + 3 + 4 = 7."
      pieges:
        - { texte: "10", pourquoi: "10 is the mean of the three values, ignoring the probabilities; 0 is the most likely." }
        - { texte: "1", pourquoi: "1 is the sum of the probabilities, 0.5 + 0.3 + 0.2; multiply each value by its probability." }
    - texte: "X takes the values 1, 2 and 3. P(X = 1) = 0.2 and P(X = 2) = 0.5. What is P(X = 3)?"
      nom: "0.3"
      explication: "The probabilities of a distribution add up to 1: P(X = 3) = 1 − 0.2 − 0.5 = 0.3."
      pieges:
        - { texte: "0.7", pourquoi: "0.7 = 0.2 + 0.5, the probability that X is 1 or 2." }
        - { texte: "1/3", pourquoi: "The three values are not equally likely: 0.2 and 0.5 are already different." }
    - texte: "You roll a fair dice. You win €6 if you get a 6, otherwise you lose €1. What is the expected gain?"
      nom: "1/6 of a euro, about €0.17"
      explication: "E = 6 × 1/6 + (−1) × 5/6 = 1 − 5/6 = 1/6, about €0.17."
      pieges:
        - { texte: "€2.50", pourquoi: "That is the mean of 6 and −1; losing €1 happens 5 times out of 6, not half the time." }
        - { texte: "€1", pourquoi: "6 × 1/6 = 1, but the loss counts too: − 5/6." }
    - texte: "You pay a stake of €m to play. You win €10 with probability 0.2, nothing otherwise. What stake makes the game fair?"
      nom: "€2"
      explication: "The game is fair when the expected net gain is zero: 10 × 0.2 − m = 0, so m = 2."
      pieges:
        - { texte: "€10", pourquoi: "You win €10 only once in 5 games: on average, €2 per game." }
        - { texte: "€0.20", pourquoi: "0.2 is the probability of winning, not an amount: 10 × 0.2 = €2." }
    - texte: "E(X) = 4. What is E(3X + 2)?"
      nom: "14"
      explication: "Expected value is linear: E(3X + 2) = 3 × E(X) + 2 = 3 × 4 + 2 = 14."
      pieges:
        - { texte: "12", pourquoi: "The + 2 counts too: 3 × 4 + 2 = 14." }
        - { texte: "18", pourquoi: "Multiply E(X) by 3, then add 2: 3 × 4 + 2, not 3 × (4 + 2)." }
    - texte: "X is −1 or 1, each with probability 0.5. What is its variance V(X)?"
      nom: "1"
      explication: "E(X) = −0.5 + 0.5 = 0. V(X) = 0.5 × (−1 − 0)² + 0.5 × (1 − 0)² = 0.5 + 0.5 = 1."
      pieges:
        - { texte: "0", pourquoi: "0 is the expected value; the variance measures the spread around it, here 1." }
        - { texte: "0.5", pourquoi: "There are two terms, 0.5 × 1 and 0.5 × 1: they add up to 1." }
    - texte: "Fill in the step: X is 0 or 4, each with probability 0.5, and E(X) = 2. V(X) = 0.5 × (0 − 2)² + 0.5 × (4 − 2)² = …"
      nom: "4"
      explication: "(0 − 2)² = 4 and (4 − 2)² = 4: V(X) = 0.5 × 4 + 0.5 × 4 = 4. The standard deviation is √4 = 2."
      pieges:
        - { texte: "2", pourquoi: "2 is the standard deviation, the square root of the variance: √4 = 2." }
        - { texte: "0", pourquoi: "The gaps are squared: (0 − 2)² = 4, which is positive, so they do not cancel out." }
    - texte: "In the dice game, the expected gain is 1/6 of a euro, yet you either win €6 or lose €1. Why?"
      nom: "The expected value is the mean gain over a very large number of games, not the gain in one game."
      explication: "E(X) is a mean weighted by the probabilities: over 600 games you expect to win about €100 (600 × 1/6), not 1/6 of a euro each time."
      pieges:
        - { texte: "Because the calculation is rounded.", pourquoi: "1/6 is the exact value; 0.17 is only its rounding." }
        - { texte: "Because the expected value is the most likely value.", pourquoi: "The most likely result is losing €1 (5 chances out of 6), not winning 1/6 of a euro." }
