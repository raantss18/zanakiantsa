id: pourcentages
titre: "Pourcentages"
niveau: 6e
prerequis: ["fractions-quantite"]
programme: { source: cycle3, texte: "Appliquer un pourcentage à une grandeur ou à un nombre." }
activite: quiz
parametres: {}
idee: "Un pourcentage, c'est une part sur 100. 25 %, c'est 25 parts sur 100 : un quart."
phrases:
  consigne: "Calcule, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Multiplie par le pourcentage, puis divise par 100."
  exemple: "25 % de 80 : 80 × 25 ÷ 100 = 20."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
  - texte: "Combien font 50 % de 80 ?"
    nom: "40"
    explication: "50 %, c'est 50 pour 100 : 80 × 50 ÷ 100 = 40."
    pieges:
      - { texte: "30", pourquoi: "80 − 50 : on n'enlève pas 50, on prend 50 parts sur 100." }
      - { texte: "50", pourquoi: "50, c'est le pourcentage, pas le résultat." }
  - texte: "Combien font 25 % de 80 ?"
    nom: "20"
    explication: "25 %, c'est 25 pour 100 : 80 × 25 ÷ 100 = 20."
    pieges:
      - { texte: "55", pourquoi: "80 − 25 : on n'enlève pas 25, on prend 25 parts sur 100." }
      - { texte: "25", pourquoi: "25, c'est le pourcentage, pas le résultat." }
