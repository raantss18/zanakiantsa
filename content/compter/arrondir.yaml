id: arrondir
titre: "Arrondir un nombre décimal"
niveau: 6e
prerequis: ["decimaux-comparer"]
programme: { source: cycle3, texte: "Donner la valeur arrondie à l’unité, au dixième ou au centième, d’un nombre décimal" }
activite: quiz
parametres: {}
idee: "Arrondir à l'unité, c'est choisir l'entier le plus proche. Sur la droite graduée, 4,7 est plus près de 5 que de 4 : son arrondi à l'unité est 5."
phrases:
  consigne: "Calcule, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Encadre le nombre, puis regarde le chiffre juste après le rang demandé : de 0 à 4, on garde ; de 5 à 9, on prend le nombre au-dessus."
  exemple: "Arrondi au dixième de 3,46 : 3,46 est entre 3,4 et 3,5. Le chiffre des centièmes est 6, donc 3,46 est plus près de 3,5. L'arrondi est 3,5."
  demonstration: "{explication}"
  bravo: "Oui ! C'est la bonne réponse."
items:
  - texte: "Quel est l'arrondi à l'unité de 4,7 ?"
    nom: "5"
    explication: "4,7 est entre 4 et 5. Le chiffre des dixièmes est 7 : 4,7 est plus près de 5."
    pieges:
      - { texte: "4", pourquoi: "4 est la partie entière : 4,7 est plus près de 5." }
      - { texte: "4,7", pourquoi: "On demande un nombre entier : 4,7 n'est pas arrondi." }
  - texte: "Quel est l'arrondi à l'unité de 12,38 ?"
    nom: "12"
    explication: "12,38 est entre 12 et 13. Le chiffre des dixièmes est 3 : 12,38 est plus près de 12."
    pieges:
      - { texte: "13", pourquoi: "0,38 est moins que 0,5 : 12,38 est plus près de 12." }
      - { texte: "12,4", pourquoi: "12,4 est l'arrondi au dixième, pas à l'unité." }
  - texte: "Quel est l'arrondi au dixième de 3,46 ?"
    nom: "3,5"
    explication: "3,46 est entre 3,4 et 3,5. Le chiffre des centièmes est 6 : on prend 3,5."
    pieges:
      - { texte: "3,4", pourquoi: "Le chiffre des centièmes est 6 : 3,46 est plus près de 3,5." }
      - { texte: "3", pourquoi: "3 est l'arrondi à l'unité, pas au dixième." }
  - texte: "Quel est l'arrondi au centième de 7,951 ?"
    nom: "7,95"
    explication: "7,951 est entre 7,95 et 7,96. Le chiffre des millièmes est 1 : on garde 7,95."
    pieges:
      - { texte: "7,96", pourquoi: "Le chiffre des millièmes est 1 : 7,951 est plus près de 7,95." }
      - { texte: "8", pourquoi: "8 est l'arrondi à l'unité, pas au centième." }
  - texte: "Quel est l'arrondi au dixième de 2,96 ?"
    nom: "3"
    explication: "2,96 est entre 2,9 et 3,0. Le chiffre des centièmes est 6 : on prend 3,0, c'est-à-dire 3."
    pieges:
      - { texte: "2,9", pourquoi: "Le chiffre des centièmes est 6 : 2,96 est plus près de 3,0." }
      - { texte: "2,10", pourquoi: "Après 9 dixièmes, 10 dixièmes font 1 unité : 2,9 + 0,1 = 3." }
  - texte: "Un livre coûte 8,49 €. Quel est son prix arrondi à l'euro ?"
    nom: "8 €"
    explication: "8,49 € est entre 8 € et 9 €. 49 centimes, c'est moins que 50 centimes : on garde 8 €."
    pieges:
      - { texte: "9 €", pourquoi: "49 centimes, c'est moins que 50 centimes : 8,49 € est plus près de 8 €." }
      - { texte: "8,50 €", pourquoi: "8,50 € est l'arrondi au dixième, pas à l'euro." }
  - texte: "1 ÷ 3 = 0,333… (les 3 continuent sans fin). Quel est l'arrondi au centième ?"
    nom: "0,33"
    explication: "0,333… est entre 0,33 et 0,34. Le chiffre des millièmes est 3 : on garde 0,33."
    pieges:
      - { texte: "0,34", pourquoi: "Le chiffre suivant est 3 : on garde 0,33." }
      - { texte: "0,3", pourquoi: "0,3 est l'arrondi au dixième, pas au centième." }
  - texte: "Arrondi à l'unité de 15,62 : 15,62 est entre 15 et … ; il est plus près de ce nombre. Quel nombre manque ?"
    nom: "16"
    explication: "On encadre par deux entiers qui se suivent : 15 et 16. 0,62 est plus que 0,5 : l'arrondi est 16."
    pieges:
      - { texte: "15,7", pourquoi: "On encadre par deux nombres entiers : 15 et 16." }
      - { texte: "14", pourquoi: "15,62 est plus grand que 15 : l'entier suivant est 16." }
  - texte: "Pourquoi l'arrondi à l'unité de 6,8 est-il 7 ?"
    nom: "Parce que 6,8 est plus près de 7 que de 6."
    explication: "6,8 est à 0,2 de 7 et à 0,8 de 6 : 7 est l'entier le plus proche."
    pieges:
      - { texte: "Parce qu'on enlève la virgule et qu'on ajoute 1.", pourquoi: "Ce n'est pas une règle : l'arrondi à l'unité de 6,2 est 6." }
      - { texte: "Parce que 8 est plus grand que 7.", pourquoi: "On ne compare pas 8 et 7 : on cherche l'entier le plus proche de 6,8." }

en:
  titre: "Rounding decimals"
  idee: "Rounding to the nearest whole number means choosing the closest whole number. On the number line, 4.7 is closer to 5 than to 4: it rounds to 5."
  phrases:
    consigne: "Work it out, then touch the right answer."
    question: "{texte}"
    indice: "Find the two numbers either side, then look at the digit just after the place you want: 0 to 4, keep; 5 to 9, go up."
    exemple: "3.46 to the nearest tenth: 3.46 is between 3.4 and 3.5. The hundredths digit is 6, so 3.46 is closer to 3.5. It rounds to 3.5."
    demonstration: "{explication}"
    bravo: "Yes! That's the right answer."
  items:
    - texte: "What is 4.7 rounded to the nearest whole number?"
      nom: "5"
      explication: "4.7 is between 4 and 5. The tenths digit is 7: 4.7 is closer to 5."
      pieges:
        - { texte: "4", pourquoi: "4 is the whole-number part: 4.7 is closer to 5." }
        - { texte: "4.7", pourquoi: "We want a whole number: 4.7 is not rounded." }
    - texte: "What is 12.38 rounded to the nearest whole number?"
      nom: "12"
      explication: "12.38 is between 12 and 13. The tenths digit is 3: 12.38 is closer to 12."
      pieges:
        - { texte: "13", pourquoi: "0.38 is less than 0.5: 12.38 is closer to 12." }
        - { texte: "12.4", pourquoi: "12.4 is rounded to the nearest tenth, not to a whole number." }
    - texte: "What is 3.46 rounded to the nearest tenth?"
      nom: "3.5"
      explication: "3.46 is between 3.4 and 3.5. The hundredths digit is 6: round up to 3.5."
      pieges:
        - { texte: "3.4", pourquoi: "The hundredths digit is 6: 3.46 is closer to 3.5." }
        - { texte: "3", pourquoi: "3 is rounded to the nearest whole number, not tenth." }
    - texte: "What is 7.951 rounded to the nearest hundredth?"
      nom: "7.95"
      explication: "7.951 is between 7.95 and 7.96. The thousandths digit is 1: keep 7.95."
      pieges:
        - { texte: "7.96", pourquoi: "The thousandths digit is 1: 7.951 is closer to 7.95." }
        - { texte: "8", pourquoi: "8 is rounded to the nearest whole number, not hundredth." }
    - texte: "What is 2.96 rounded to the nearest tenth?"
      nom: "3"
      explication: "2.96 is between 2.9 and 3.0. The hundredths digit is 6: round up to 3.0, which is 3."
      pieges:
        - { texte: "2.9", pourquoi: "The hundredths digit is 6: 2.96 is closer to 3.0." }
        - { texte: "2.10", pourquoi: "After 9 tenths, 10 tenths make 1 whole: 2.9 + 0.1 = 3." }
    - texte: "A book costs €8.49. What is its price to the nearest euro?"
      nom: "€8"
      explication: "€8.49 is between €8 and €9. 49 cents is less than 50 cents: keep €8."
      pieges:
        - { texte: "€9", pourquoi: "49 cents is less than 50 cents: €8.49 is closer to €8." }
        - { texte: "€8.50", pourquoi: "€8.50 is rounded to the nearest tenth, not euro." }
    - texte: "1 ÷ 3 = 0.333… (the 3s go on for ever). What is it to the nearest hundredth?"
      nom: "0.33"
      explication: "0.333… is between 0.33 and 0.34. The thousandths digit is 3: keep 0.33."
      pieges:
        - { texte: "0.34", pourquoi: "The next digit is 3: keep 0.33." }
        - { texte: "0.3", pourquoi: "0.3 is rounded to the nearest tenth, not hundredth." }
    - texte: "15.62 to the nearest whole number: 15.62 is between 15 and …; it is closer to that number. Which number is missing?"
      nom: "16"
      explication: "Use two consecutive whole numbers: 15 and 16. 0.62 is more than 0.5: it rounds to 16."
      pieges:
        - { texte: "15.7", pourquoi: "Use two whole numbers either side: 15 and 16." }
        - { texte: "14", pourquoi: "15.62 is bigger than 15: the next whole number is 16." }
    - texte: "Why does 6.8 round to 7?"
      nom: "Because 6.8 is closer to 7 than to 6."
      explication: "6.8 is 0.2 away from 7 and 0.8 away from 6: 7 is the closest whole number."
      pieges:
        - { texte: "Because you remove the point and add 1.", pourquoi: "That's not a rule: 6.2 rounds to 6." }
        - { texte: "Because 8 is bigger than 7.", pourquoi: "Don't compare 8 and 7: find the whole number closest to 6.8." }
