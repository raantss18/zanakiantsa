id: heure-demi-quart
titre: Lire l'heure (demies et quarts)
niveau: CE1
prerequis: [heure-entiere, moities]
programme: { source: cycle2, texte: "Lire l’heure sur une horloge à aiguilles (lorsque l’heure est donnée en heures entières, en heures et demi-heure ou en heures et quarts d’heure)." }
activite: heure
parametres: { minutes: [0, 30, 15, 45] }
idee: "La grande aiguille fait le tour en une heure. Sur le 6, c'est la demie ; sur le 3, le quart ; sur le 9, moins le quart."
phrases:
  consigne: "Regarde d'abord la petite aiguille pour l'heure, puis la grande pour les minutes. Puis touche la bonne heure."
  question: "Quelle heure est-il ?"
  indice: "Grande aiguille sur le 6 : et demie. Sur le 3 : et quart. Sur le 9 : moins le quart."
  exemple: "À la demie, la petite aiguille est entre deux nombres."
  demonstration: "Regarde : il est {heure}."
  bravo: "Oui ! Il est {heure}."

en:
  titre: "Telling the time (half and quarter hours)"
  idee: "The long hand goes round once in an hour. On the 6, it's half past; on the 3, quarter past; on the 9, quarter to."
  phrases:
    consigne: "First look at the short hand for the hour, then the long hand for the minutes. Then touch the right time."
    question: "What time is it?"
    indice: "Long hand on the 6: half past. On the 3: quarter past. On the 9: quarter to."
    exemple: "At half past, the short hand is between two numbers."
    demonstration: "Look: it's {heure}."
    bravo: "Yes! It's {heure}."
