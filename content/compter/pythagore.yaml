      nom: "5 cm"
      explication: "3² + 4² = 9 + 16 = 25, and 5 × 5 = 25: the hypotenuse is 5 cm."
      pieges:
        - { texte: "7 cm", pourquoi: "3 + 4: add the squares of the sides, not the sides." }
        - { texte: "25 cm", pourquoi: "25 is the square of the hypotenuse: now take the square root." }
