en:
  titre: "Pythagoras' theorem"
  idee: "In a right-angled triangle, the square of the hypotenuse (the side opposite the right angle) equals the sum of the squares of the other two sides."
  phrases:
    consigne: "Work it out, then touch the length."
    question: "{texte}"
    indice: "Add the squares of the two sides next to the right angle, then take the square root."
    exemple: "3 and 4: 9 + 16 = 25, so the hypotenuse is 5."
    demonstration: "{explication}"
    bravo: "Yes! The answer is {bonne}."
  items:
