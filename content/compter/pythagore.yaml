id: pythagore
titre: "Le théorème de Pythagore"
niveau: 4e
prerequis: ["racine-carree"]
programme: { source: cycle4, texte: "Connaitre le théorème de Pythagore, sa réciproque, sa contraposée." }
activite: quiz
parametres: {}
idee: "Dans un triangle rectangle, le carré de l’hypoténuse (le côté face à l’angle droit) est égal à la somme des carrés des deux autres côtés."
phrases:
  consigne: "Calcule, puis touche la longueur."
  question: "{texte}"
  indice: "Fais la somme des carrés des deux côtés de l’angle droit, puis la racine carrée."
  exemple: "3 et 4 : 9 + 16 = 25, donc l’hypoténuse mesure 5."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
  - texte: "Un triangle rectangle a des côtés de l’angle droit de 3 cm et 4 cm. Combien mesure l’hypoténuse ?"
    nom: "5 cm"
    explication: "3² + 4² = 9 + 16 = 25, et 5 × 5 = 25 : l’hypoténuse mesure 5 cm."
    pieges:
      - { texte: "7 cm", pourquoi: "3 + 4 : on additionne les carrés des côtés, pas les côtés." }
      - { texte: "25 cm", pourquoi: "25, c’est le carré de l’hypoténuse : il reste à prendre la racine carrée." }
