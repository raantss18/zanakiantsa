id: moities
titre: Les moitiés
niveau: CE1
prerequis: [partager, doubles]
programme: { source: cycle2, texte: "Connaitre des faits multiplicatifs usuels : les moitiés des nombres pairs de 2 à 30." }
activite: partage
parametres: { parts_fixe: 2, par_max: 15 }
variantes: ["Quelle est la moitié de {n} ? Partage pour trouver."]
idee: "La moitié, c'est ce qu'a chacun quand on partage en deux parts égales."
phrases:
  consigne: "La moitié, c'est deux parts égales. Touche un enfant pour lui donner un objet, chacun son tour. C'est réussi quand les deux ont autant."
  question: "Partage les {n} {objets} en deux parts égales."
  indice: "Donne un objet à chaque enfant, chacun son tour."
  exemple: "Les deux enfants doivent en avoir autant."
  demonstration: "Regarde : la moitié de {n}, c'est {b}."
  bravo: "Oui ! La moitié de {n}, c'est {b}."

en:
  titre: "Halves"
  idee: "Half is what each one gets when you share into two equal parts."
  phrases:
    consigne: "Half means two equal parts. Touch a child to give them one thing, taking turns. It works when both have the same."
    question: "Share the {n} {objets} into two equal parts."
    indice: "Give one thing to each child, taking turns."
    exemple: "Both children must have the same number."
    demonstration: "Look: half of {n} is {b}."
    bravo: "Yes! Half of {n} is {b}."
  variantes: ["What is half of {n}? Share to find out."]
