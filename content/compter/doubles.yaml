id: doubles
titre: Les doubles
niveau: CE1
prerequis: [groupes]
programme: { source: cycle2, texte: "Connaitre des faits multiplicatifs usuels : l’élève sait donner oralement et par écrit les doubles des nombres de 1 à 15." }
activite: groupes
parametres: { groupes_fixe: 2, par_min: 1, par_max: 15, total_max: 30 }
variantes: ["Combien font {b} plus {b} ?", "{prenom} a {b} {objets}, puis encore autant. Combien en tout ?"]
idee: "Le double, c'est deux fois le même nombre : deux paquets pareils."
phrases:
  consigne: "Le double, c'est deux fois le même nombre : compte les deux paquets ensemble. Puis touche le résultat."
  question: "Quel est le double de {b} ?"
  indice: "Le double de {b}, c'est {b} plus {b}."
  exemple: "Compte les objets des deux paquets."
  demonstration: "Regarde : {b} plus {b}, cela fait {n}."
  bravo: "Oui ! Le double de {b}, c'est {n}."

en:
  titre: "Doubles"
  idee: "Double means the same number twice: two groups the same."
  phrases:
    consigne: "Double means the same number twice: count both groups together. Then touch the answer."
    question: "What is double {b}?"
    indice: "Double {b} is {b} plus {b}."
    exemple: "Count the things in both groups."
    demonstration: "Look: {b} plus {b} makes {n}."
    bravo: "Yes! Double {b} is {n}."
  variantes: ["What is {b} plus {b}?", "{prenom} has {b} {objets}, then the same again. How many altogether?"]
