        - { texte: "12.5 × 10⁵", pourquoi: "The first number must be between 1 and 10: just one digit before the point." }
    - texte: "Write 608 in scientific notation."
      nom: "6.08 × 10²"
      explication: "Put the decimal point after the first digit: 6.08, then count how many places it moved: 2."
      pieges:
