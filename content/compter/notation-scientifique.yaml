id: notation-scientifique
titre: "La notation scientifique"
niveau: 3e
prerequis: ["puissances-carre"]
programme: { source: cycle4, texte: "Déterminer la notation scientifique d’un nombre." }
activite: quiz
parametres: {}
idee: "En notation scientifique, un nombre s’écrit a × 10ⁿ, avec a entre 1 et 10 (un seul chiffre avant la virgule). 45 000 = 4,5 × 10⁴."
phrases:
  consigne: "Place la virgule, compte les rangs, puis touche l’écriture."
  question: "{texte}"
  indice: "Un seul chiffre non nul avant la virgule, puis la puissance de 10."
  exemple: "45 000 : 4,5, la virgule a bougé de 4 rangs, donc 4,5 × 10⁴."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
  - texte: "Écris 45 000 en notation scientifique."
    nom: "4,5 × 10⁴"
    explication: "On place la virgule après le premier chiffre : 4,5, puis on compte de combien de rangs elle a bougé : 4."
    pieges:
      - { texte: "4,5 × 10⁵", pourquoi: "La virgule a bougé de 4 rangs seulement : compte-les un par un." }
      - { texte: "45 × 10³", pourquoi: "Le premier nombre doit être entre 1 et 10 : un seul chiffre avant la virgule." }
