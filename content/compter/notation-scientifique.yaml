en:
  titre: "Scientific notation"
  idee: "In scientific notation, a number is written a × 10ⁿ, with a between 1 and 10 (just one digit before the decimal point). 45,000 = 4.5 × 10⁴."
  phrases:
    consigne: "Place the decimal point, count the places, then touch the answer."
    question: "{texte}"
    indice: "Just one non-zero digit before the decimal point, then the power of 10."
    exemple: "45,000: 4.5, the point moved 4 places, so 4.5 × 10⁴."
    demonstration: "{explication}"
    bravo: "Yes! The answer is {bonne}."
  items:
    - texte: "Write 45,000 in scientific notation."
      nom: "4.5 × 10⁴"
      explication: "Put the decimal point after the first digit: 4.5, then count how many places it moved: 4."
      pieges:
        - { texte: "4.5 × 10⁵", pourquoi: "The point moved only 4 places: count them one by one." }
        - { texte: "45 × 10³", pourquoi: "The first number must be between 1 and 10: just one digit before the point." }
    - texte: "Write 320,000 in scientific notation."
      nom: "3.2 × 10⁵"
      explication: "Put the decimal point after the first digit: 3.2, then count how many places it moved: 5."
      pieges:
