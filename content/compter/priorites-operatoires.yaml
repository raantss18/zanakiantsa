id: priorites-operatoires
titre: "Les priorités opératoires"
niveau: 5e
prerequis: ["problemes-etapes"]
programme: { source: cycle4, texte: "Connaitre et utiliser les priorités opératoires." }
activite: quiz
parametres: {}
idee: "Dans un calcul sans parenthèses, on fait d'abord les multiplications et les divisions, puis les additions et les soustractions, de gauche à droite. Les parenthèses passent avant tout."
phrases:
  consigne: "Calcule dans le bon ordre, puis touche la bonne réponse."
  question: "{texte}"
  indice: "D'abord les parenthèses, puis les × et ÷, enfin les + et −, de gauche à droite."
  exemple: "5 + 3 × 4 : la multiplication d'abord, 3 × 4 = 12, puis 5 + 12 = 17. Avec des parenthèses, (5 + 3) × 4 = 8 × 4 = 32."
  demonstration: "{explication}"
  bravo: "Oui ! C'est la bonne réponse."
items:
  - texte: "Combien font 2 + 5 × 3 ?"
    nom: "17"
    explication: "La multiplication d'abord : 5 × 3 = 15. Puis 2 + 15 = 17."
    pieges:
      - { texte: "21", pourquoi: "On a calculé de gauche à droite, 2 + 5 = 7 puis 7 × 3 : la multiplication passe avant l'addition." }
      - { texte: "30", pourquoi: "2 × 5 × 3 : le premier signe est un +, pas un ×." }
  - texte: "Combien font 20 − 12 ÷ 4 ?"
    nom: "17"
    explication: "La division d'abord : 12 ÷ 4 = 3. Puis 20 − 3 = 17."
    pieges:
      - { texte: "2", pourquoi: "On a fait (20 − 12) ÷ 4 : sans parenthèses, la division passe avant la soustraction." }
      - { texte: "8", pourquoi: "20 − 12 = 8 : la division par 4 a été oubliée." }
  - texte: "Combien font (7 + 3) × 5 ?"
    nom: "50"
    explication: "Les parenthèses d'abord : 7 + 3 = 10. Puis 10 × 5 = 50."
    pieges:
      - { texte: "22", pourquoi: "7 + 3 × 5 : les parenthèses obligent à calculer 7 + 3 en premier." }
      - { texte: "15", pourquoi: "7 + 3 + 5 : le dernier signe est un ×." }
  - texte: "Combien font 6 × 4 − 2 × 5 ?"
    nom: "14"
    explication: "Les deux multiplications d'abord : 6 × 4 = 24 et 2 × 5 = 10. Puis 24 − 10 = 14."
    pieges:
      - { texte: "110", pourquoi: "On a calculé de gauche à droite, 24 − 2 = 22 puis 22 × 5 : les multiplications passent avant." }
      - { texte: "60", pourquoi: "6 × (4 − 2) × 5 : la soustraction a été faite avant les multiplications." }
  - texte: "Combien font 18 ÷ 3 × 2 ?"
    nom: "12"
    explication: "× et ÷ ont la même priorité : on va de gauche à droite. 18 ÷ 3 = 6, puis 6 × 2 = 12."
    pieges:
      - { texte: "3", pourquoi: "18 ÷ (3 × 2) : la multiplication ne passe pas avant la division, on va de gauche à droite." }
      - { texte: "6", pourquoi: "On s'est arrêté à 18 ÷ 3 = 6 : il reste × 2." }
  - texte: "Complète : 4 × 5 + 3 × 2 = … + 6 = 26"
    nom: "20"
    explication: "4 × 5 = 20 et 3 × 2 = 6, puis 20 + 6 = 26."
    pieges:
      - { texte: "23", pourquoi: "4 × 5 + 3 = 23 : le + ne passe pas avant le second ×." }
      - { texte: "9", pourquoi: "4 + 5 = 9 : le signe entre 4 et 5 est un ×." }
  - texte: "Où placer des parenthèses pour que 2 + 3 × 4 fasse 20 ?"
    nom: "(2 + 3) × 4"
    explication: "(2 + 3) × 4 = 5 × 4 = 20. Sans parenthèses, 2 + 3 × 4 = 2 + 12 = 14."
    pieges:
      - { texte: "2 + (3 × 4)", pourquoi: "Ces parenthèses ne changent rien : 3 × 4 passe déjà en premier, cela fait 14." }
      - { texte: "(2 + 3 × 4)", pourquoi: "Des parenthèses autour de tout ne changent pas l'ordre à l'intérieur : 14." }
  - texte: "Pourquoi 10 − 2 × 3 = 4 et pas 24 ?"
    nom: "Parce que la multiplication passe avant la soustraction."
    explication: "2 × 3 = 6 d'abord, puis 10 − 6 = 4. Pour obtenir 24, il faudrait écrire (10 − 2) × 3."
    pieges:
      - { texte: "Parce qu'on calcule de droite à gauche.", pourquoi: "Ce n'est pas le sens de lecture : 10 − 4 + 1 se calcule de gauche à droite et donne 7." }
      - { texte: "Parce que 24 est trop grand.", pourquoi: "Un résultat peut être grand : c'est la règle des priorités qui décide." }
  - texte: "Au cinéma : 3 places adultes à 9 € et 2 places enfants à 6 €. Quel calcul donne le prix total ?"
    nom: "3 × 9 + 2 × 6"
    explication: "Les priorités font les deux produits d'abord : 27 + 12 = 39 €."
    pieges:
      - { texte: "(3 + 2) × (9 + 6)", pourquoi: "Ce calcul fait payer 15 € chacune des 5 places : 75 €." }
      - { texte: "3 + 2 × 9 + 6", pourquoi: "Avec les priorités, cela fait 3 + 18 + 6 = 27 : les nombres ne sont pas groupés comme dans l'histoire." }

en:
  titre: "Order of operations"
  idee: "In a calculation without brackets, do multiplication and division first, then addition and subtraction, from left to right. Brackets come before everything."
  phrases:
    consigne: "Work it out in the right order, then touch the right answer."
    question: "{texte}"
    indice: "Brackets first, then × and ÷, then + and −, from left to right."
    exemple: "5 + 3 × 4: multiplication first, 3 × 4 = 12, then 5 + 12 = 17. With brackets, (5 + 3) × 4 = 8 × 4 = 32."
    demonstration: "{explication}"
    bravo: "Yes! That's the right answer."
  items:
    - texte: "What is 2 + 5 × 3?"
      nom: "17"
      explication: "Multiplication first: 5 × 3 = 15. Then 2 + 15 = 17."
      pieges:
        - { texte: "21", pourquoi: "This was worked out left to right, 2 + 5 = 7 then 7 × 3: multiplication comes before addition." }
        - { texte: "30", pourquoi: "2 × 5 × 3: the first sign is a +, not a ×." }
    - texte: "What is 20 − 12 ÷ 4?"
      nom: "17"
      explication: "Division first: 12 ÷ 4 = 3. Then 20 − 3 = 17."
      pieges:
        - { texte: "2", pourquoi: "This is (20 − 12) ÷ 4: without brackets, division comes before subtraction." }
        - { texte: "8", pourquoi: "20 − 12 = 8: the division by 4 was forgotten." }
    - texte: "What is (7 + 3) × 5?"
      nom: "50"
      explication: "Brackets first: 7 + 3 = 10. Then 10 × 5 = 50."
      pieges:
        - { texte: "22", pourquoi: "7 + 3 × 5: the brackets mean 7 + 3 must be worked out first." }
        - { texte: "15", pourquoi: "7 + 3 + 5: the last sign is a ×." }
    - texte: "What is 6 × 4 − 2 × 5?"
      nom: "14"
      explication: "Both multiplications first: 6 × 4 = 24 and 2 × 5 = 10. Then 24 − 10 = 14."
      pieges:
        - { texte: "110", pourquoi: "This was worked out left to right, 24 − 2 = 22 then 22 × 5: multiplications come first." }
        - { texte: "60", pourquoi: "6 × (4 − 2) × 5: the subtraction was done before the multiplications." }
    - texte: "What is 18 ÷ 3 × 2?"
      nom: "12"
      explication: "× and ÷ have the same priority: go from left to right. 18 ÷ 3 = 6, then 6 × 2 = 12."
      pieges:
        - { texte: "3", pourquoi: "18 ÷ (3 × 2): multiplication does not come before division, go from left to right." }
        - { texte: "6", pourquoi: "Stopped at 18 ÷ 3 = 6: the × 2 is still to do." }
    - texte: "Fill in: 4 × 5 + 3 × 2 = … + 6 = 26"
      nom: "20"
      explication: "4 × 5 = 20 and 3 × 2 = 6, then 20 + 6 = 26."
      pieges:
        - { texte: "23", pourquoi: "4 × 5 + 3 = 23: the + does not come before the second ×." }
        - { texte: "9", pourquoi: "4 + 5 = 9: the sign between 4 and 5 is a ×." }
    - texte: "Where do brackets go so that 2 + 3 × 4 makes 20?"
      nom: "(2 + 3) × 4"
      explication: "(2 + 3) × 4 = 5 × 4 = 20. Without brackets, 2 + 3 × 4 = 2 + 12 = 14."
      pieges:
        - { texte: "2 + (3 × 4)", pourquoi: "These brackets change nothing: 3 × 4 already comes first, giving 14." }
        - { texte: "(2 + 3 × 4)", pourquoi: "Brackets round everything do not change the order inside: 14." }
    - texte: "Why is 10 − 2 × 3 = 4 and not 24?"
      nom: "Because multiplication comes before subtraction."
      explication: "2 × 3 = 6 first, then 10 − 6 = 4. To get 24, you would have to write (10 − 2) × 3."
      pieges:
        - { texte: "Because you work from right to left.", pourquoi: "It is not about reading direction: 10 − 4 + 1 is worked out left to right and gives 7." }
        - { texte: "Because 24 is too big.", pourquoi: "A result can be big: the order of operations is what decides." }
    - texte: "At the cinema: 3 adult tickets at €9 and 2 child tickets at €6. Which calculation gives the total price?"
      nom: "3 × 9 + 2 × 6"
      explication: "The order of operations does both products first: 27 + 12 = €39."
      pieges:
        - { texte: "(3 + 2) × (9 + 6)", pourquoi: "This charges €15 for each of the 5 tickets: €75." }
        - { texte: "3 + 2 × 9 + 6", pourquoi: "With the order of operations this is 3 + 18 + 6 = 27: the numbers are not grouped as in the story." }
