id: heure-entiere
titre: Lire l'heure (heures entières)
niveau: CP
prerequis: [denombrer-10]
programme: { source: cycle2, texte: "Lire sur une horloge à aiguilles une heure donnée en heures entières (par exemple trois heures, neuf heures, mais aussi midi)." }
activite: heure
parametres: { minutes: [0] }
idee: "La petite aiguille montre les heures. Quand la grande aiguille est en haut, sur le 12, c'est une heure pile."
phrases:
  consigne: "Regarde la petite aiguille : elle montre l'heure. Puis touche l'heure écrite qui va avec."
  question: "Quelle heure est-il ?"
  indice: "La grande aiguille est sur le 12 : regarde seulement où pointe la petite."
  exemple: "La petite aiguille est la plus courte et la plus épaisse."
  demonstration: "Regarde : il est {heure}."
  bravo: "Oui ! Il est {heure}."

en:
  titre: "Telling the time (o'clock)"
  idee: "The short hand shows the hours. When the long hand is at the top, on the 12, it's exactly o'clock."
  phrases:
    consigne: "Look at the short hand: it shows the hour. Then touch the written time that matches."
    question: "What time is it?"
    indice: "The long hand is on the 12: just look where the short hand points."
    exemple: "The short hand is the shortest and the thickest."
    demonstration: "Look: it's {heure}."
    bravo: "Yes! It's {heure}."
