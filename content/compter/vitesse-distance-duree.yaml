id: vitesse-distance-duree
titre: "Vitesse, distance et durée"
niveau: 4e
prerequis: ["proportionnalite-6e", "durees"]
programme: { source: cycle4, texte: "Utiliser des grandeurs quotients, avec ou sans unités." }
activite: quiz
parametres: {}
idee: "À vitesse constante, la distance est proportionnelle à la durée. Vitesse = distance ÷ durée ; distance = vitesse × durée ; durée = distance ÷ vitesse. 60 km/h : 60 km en 1 heure."
phrases:
  consigne: "Calcule, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Écris la durée en heures (30 min = 0,5 h ; 15 min = 0,25 h), puis choisis : multiplier ou diviser."
  exemple: "Un train roule à 120 km/h pendant 2 h 30 min. 2 h 30 min = 2,5 h, car 30 min est une demi-heure. Distance = 120 × 2,5 = 300 km."
  demonstration: "{explication}"
  bravo: "Oui ! C'est la bonne réponse."
items:
  - texte: "Une voiture parcourt 150 km en 2 h 30 min. Quelle est sa vitesse moyenne ?"
    nom: "60 km/h"
    explication: "2 h 30 min = 2,5 h. Vitesse = 150 ÷ 2,5 = 60 km/h."
    pieges:
      - { texte: "environ 65 km/h", pourquoi: "C'est 150 ÷ 2,3 : 2 h 30 min ne s'écrit pas 2,3 h, mais 2,5 h." }
      - { texte: "375 km/h", pourquoi: "150 × 2,5 : la vitesse est une distance divisée par une durée." }
  - texte: "Un cycliste roule à 20 km/h pendant 3 h. Quelle distance parcourt-il ?"
    nom: "60 km"
    explication: "Distance = vitesse × durée = 20 × 3 = 60 km."
    pieges:
      - { texte: "23 km", pourquoi: "20 + 3 : chaque heure, il fait 20 km, donc 3 fois 20 km." }
      - { texte: "environ 6,7 km", pourquoi: "20 ÷ 3 : la distance est la vitesse multipliée par la durée." }
  - texte: "Un randonneur marche à 4 km/h. Combien de temps met-il pour faire 10 km ?"
    nom: "2 h 30 min"
    explication: "Durée = 10 ÷ 4 = 2,5 h, et 0,5 h = 30 min : 2 h 30 min."
    pieges:
      - { texte: "2 h 50 min", pourquoi: "0,5 h est une demi-heure, soit 30 min, pas 50 min." }
      - { texte: "40 h", pourquoi: "4 × 10 : la durée est la distance divisée par la vitesse." }
  - texte: "Une voiture roule à 90 km/h pendant 20 min. Quelle distance parcourt-elle ?"
    nom: "30 km"
    explication: "20 min, c'est le tiers d'une heure : 90 ÷ 3 = 30 km."
    pieges:
      - { texte: "1 800 km", pourquoi: "90 × 20 : les 20 sont des minutes, pas des heures." }
      - { texte: "4,5 km", pourquoi: "90 ÷ 20 : 20 min, c'est le tiers d'une heure, on divise par 3." }
  - texte: "Un escargot avance de 6 m en 1 h. De combien avance-t-il en 15 min ?"
    nom: "1,5 m"
    explication: "15 min, c'est le quart d'une heure : 6 ÷ 4 = 1,5 m."
    pieges:
      - { texte: "90 m", pourquoi: "6 × 15 : en 15 min, il avance moins qu'en une heure." }
      - { texte: "0,4 m", pourquoi: "6 ÷ 15 : 15 min est le quart d'une heure, on divise par 4." }
  - texte: "Complète : 45 min = … h"
    nom: "0,75"
    explication: "Une heure compte 60 minutes : 45 ÷ 60 = 0,75 h, trois quarts d'heure."
    pieges:
      - { texte: "0,45", pourquoi: "Une heure a 60 minutes, pas 100 : 45 ÷ 60 = 0,75." }
      - { texte: "4,5", pourquoi: "45 ÷ 10 : on divise par 60, le nombre de minutes dans une heure." }
  - texte: "Quelle vitesse est la plus grande : 30 m/s ou 100 km/h ?"
    nom: "30 m/s"
    explication: "En une heure, il y a 3 600 s : 30 × 3 600 = 108 000 m, soit 108 km. 30 m/s = 108 km/h, plus que 100 km/h."
    pieges:
      - { texte: "100 km/h", pourquoi: "100 est plus grand que 30, mais les unités diffèrent : 30 m/s = 108 km/h." }
      - { texte: "Elles sont égales.", pourquoi: "30 m/s = 108 km/h, ce n'est pas 100 km/h." }
  - texte: "Pourquoi 1 h 30 min ne s'écrit-il pas 1,30 h ?"
    nom: "Parce qu'une heure a 60 minutes : 30 min = 0,5 h."
    explication: "30 min, c'est la moitié de 60 min : 1 h 30 min = 1,5 h."
    pieges:
      - { texte: "Parce qu'on n'écrit jamais une durée avec une virgule.", pourquoi: "1,5 h s'écrit bien avec une virgule : c'est l'écriture décimale de la durée." }
      - { texte: "Parce que les minutes s'écrivent avant les heures.", pourquoi: "L'ordre ne change rien : c'est la base 60 des minutes qui compte." }
  - texte: "Lou court 100 m en 20 s. Quelle est sa vitesse moyenne en mètres par seconde ?"
    nom: "5 m/s"
    explication: "Vitesse = 100 ÷ 20 = 5 m/s : 5 mètres chaque seconde."
    pieges:
      - { texte: "2 000 m/s", pourquoi: "100 × 20 : la vitesse est une distance divisée par une durée." }
      - { texte: "0,2 m/s", pourquoi: "20 ÷ 100 : on a divisé la durée par la distance." }

en:
  titre: "Speed, distance and time"
  idee: "At a steady speed, distance is proportional to time. Speed = distance ÷ time; distance = speed × time; time = distance ÷ speed. 60 km/h: 60 km in 1 hour."
  phrases:
    consigne: "Work it out, then touch the right answer."
    question: "{texte}"
    indice: "Write the time in hours (30 min = 0.5 h; 15 min = 0.25 h), then choose: multiply or divide."
    exemple: "A train travels at 120 km/h for 2 h 30 min. 2 h 30 min = 2.5 h, because 30 min is half an hour. Distance = 120 × 2.5 = 300 km."
    demonstration: "{explication}"
    bravo: "Yes! That's the right answer."
  items:
    - texte: "A car travels 150 km in 2 h 30 min. What is its average speed?"
      nom: "60 km/h"
      explication: "2 h 30 min = 2.5 h. Speed = 150 ÷ 2.5 = 60 km/h."
      pieges:
        - { texte: "about 65 km/h", pourquoi: "That is 150 ÷ 2.3: 2 h 30 min is not 2.3 h but 2.5 h." }
        - { texte: "375 km/h", pourquoi: "150 × 2.5: speed is a distance divided by a time." }
    - texte: "A cyclist rides at 20 km/h for 3 h. How far does she go?"
      nom: "60 km"
      explication: "Distance = speed × time = 20 × 3 = 60 km."
      pieges:
        - { texte: "23 km", pourquoi: "20 + 3: each hour she rides 20 km, so 3 lots of 20 km." }
        - { texte: "about 6.7 km", pourquoi: "20 ÷ 3: distance is speed multiplied by time." }
    - texte: "A walker goes at 4 km/h. How long does he take to walk 10 km?"
      nom: "2 h 30 min"
      explication: "Time = 10 ÷ 4 = 2.5 h, and 0.5 h = 30 min: 2 h 30 min."
      pieges:
        - { texte: "2 h 50 min", pourquoi: "0.5 h is half an hour, which is 30 min, not 50 min." }
        - { texte: "40 h", pourquoi: "4 × 10: time is distance divided by speed." }
    - texte: "A car travels at 90 km/h for 20 min. How far does it go?"
      nom: "30 km"
      explication: "20 min is a third of an hour: 90 ÷ 3 = 30 km."
      pieges:
        - { texte: "1,800 km", pourquoi: "90 × 20: the 20 is minutes, not hours." }
        - { texte: "4.5 km", pourquoi: "90 ÷ 20: 20 min is a third of an hour, so divide by 3." }
    - texte: "A snail moves 6 m in 1 h. How far does it move in 15 min?"
      nom: "1.5 m"
      explication: "15 min is a quarter of an hour: 6 ÷ 4 = 1.5 m."
      pieges:
        - { texte: "90 m", pourquoi: "6 × 15: in 15 min it moves less than in an hour." }
        - { texte: "0.4 m", pourquoi: "6 ÷ 15: 15 min is a quarter of an hour, so divide by 4." }
    - texte: "Fill in: 45 min = … h"
      nom: "0.75"
      explication: "An hour has 60 minutes: 45 ÷ 60 = 0.75 h, three quarters of an hour."
      pieges:
        - { texte: "0.45", pourquoi: "An hour has 60 minutes, not 100: 45 ÷ 60 = 0.75." }
        - { texte: "4.5", pourquoi: "45 ÷ 10: divide by 60, the number of minutes in an hour." }
    - texte: "Which speed is greater: 30 m/s or 100 km/h?"
      nom: "30 m/s"
      explication: "An hour has 3,600 s: 30 × 3,600 = 108,000 m, that is 108 km. 30 m/s = 108 km/h, more than 100 km/h."
      pieges:
        - { texte: "100 km/h", pourquoi: "100 is bigger than 30, but the units are different: 30 m/s = 108 km/h." }
        - { texte: "They are the same.", pourquoi: "30 m/s = 108 km/h, which is not 100 km/h." }
    - texte: "Why is 1 h 30 min not written 1.30 h?"
      nom: "Because an hour has 60 minutes: 30 min = 0.5 h."
      explication: "30 min is half of 60 min: 1 h 30 min = 1.5 h."
      pieges:
        - { texte: "Because a time is never written with a decimal point.", pourquoi: "1.5 h does use a decimal point: it is the decimal way of writing the time." }
        - { texte: "Because minutes are written before hours.", pourquoi: "The order changes nothing: what matters is that minutes go in sixties." }
    - texte: "Lou runs 100 m in 20 s. What is her average speed in metres per second?"
      nom: "5 m/s"
      explication: "Speed = 100 ÷ 20 = 5 m/s: 5 metres every second."
      pieges:
        - { texte: "2,000 m/s", pourquoi: "100 × 20: speed is a distance divided by a time." }
        - { texte: "0.2 m/s", pourquoi: "20 ÷ 100: the time was divided by the distance." }
