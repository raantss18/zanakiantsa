id: complement-10
titre: Compléments à 10
niveau: CP
prerequis: [additionner-10]
programme: { source: cycle2, texte: "Égalités à trou du type : 10 = 7 + …" }
activite: calcul
parametres: { forme: complement, total_max: 10, total_fixe: 10 }
variantes: ["{a} et combien font {n} ?", "{a} + ? = {n}", "Dans {contenant}, il y a {a} {objets}. Combien faut-il en ajouter pour en avoir {n} ?"]
idee: "Pour aller jusqu'à dix, on cherche combien il manque. On part de ce qu'on a et on compte jusqu'à dix."
phrases:
  consigne: "Compte combien il faut en ajouter pour arriver au nombre demandé. Puis écris-le avec ton doigt, ou touche-le."
  question: "{prenom} veut {n} {objets}. Il y en a {a}. Combien en manque-t-il ?"
  indice: "Compte à partir de {a} jusqu'à {n}."
  exemple: "Montre {a} doigts. Combien de doigts restent baissés ?"
  demonstration: "Regarde : {a} et {b} font {n}."
  bravo: "Oui, {a} plus {b} égale {n}."

en:
  titre: "Number bonds to 10"
  idee: "To get to ten, find how many are missing. Start from what you have and count up to ten."
  phrases:
    consigne: "Count how many more you need to reach the number. Then write it with your finger, or touch it."
    question: "{prenom} wants {n} {objets}. There are {a}. How many are missing?"
    indice: "Count on from {a} up to {n}."
    exemple: "Hold up {a} fingers. How many fingers are still down?"
    demonstration: "Look: {a} and {b} make {n}."
    bravo: "Yes, {a} plus {b} equals {n}."
  variantes: ["{a} and how many make {n}?", "{a} + ? = {n}", "There are {a} {objets} in {contenant}. How many more do we need to have {n}?"]
