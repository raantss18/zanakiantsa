id: centaines-lire
titre: Lire un nombre jusqu'à 1000
niveau: CE1
prerequis: [dizaines-construire]
programme: { source: cycle2, texte: "L’élève dénombre des collections en utilisant des groupes de dix ou de cent ; matériel multibase (plaques de cent cubes, barres de dix cubes, cubes unités)." }
activite: multibase
parametres: { min: 101, max: 999 }
idee: "Une plaque, c'est cent cubes. Une barre, c'est dix cubes. On compte les plaques, puis les barres, puis les cubes seuls."
variantes: ["Plaques, barres et cubes : quel nombre vois-tu ?", "Combien de cubes en tout ?"]
phrases:
  consigne: "Compte les plaques de cent, puis les barres de dix, puis les cubes. Puis touche le nombre."
  question: "Quel nombre est représenté ?"
  indice: "Compte de cent en cent pour les plaques, puis de dix en dix pour les barres."
  exemple: "Il y a {centaines}, {dizaines} et {unites}."
  demonstration: "Regarde : {centaines}, {dizaines} et {unites}, cela fait {n}."
  bravo: "Oui ! {centaines}, {dizaines} et {unites}, cela fait {n}."

en:
  titre: "Reading a number up to 1000"
  idee: "A flat is a hundred cubes. A rod is ten cubes. Count the flats, then the rods, then the single cubes."
  phrases:
    consigne: "Count the flats of a hundred, then the rods of ten, then the cubes. Then touch the number."
    question: "What number is shown?"
    indice: "Count in hundreds for the flats, then in tens for the rods."
    exemple: "There are {centaines}, {dizaines} and {unites}."
    demonstration: "Look: {centaines}, {dizaines} and {unites} make {n}."
    bravo: "Yes! {centaines}, {dizaines} and {unites} make {n}."
  variantes: ["Flats, rods and cubes: what number can you see?", "How many cubes altogether?"]
