  question: "{texte}"
  indice: "Récite les carrés : lequel tombe sur ce nombre ?"
  exemple: "La racine carrée de 49 est 7, car 7 × 7 = 49."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
