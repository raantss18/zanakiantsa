programme: { source: cycle4, texte: "Comprendre et connaitre la définition de la racine carrée d'un nombre positif." }
activite: quiz
parametres: {}
idee: "La racine carrée de 49, c'est le nombre positif qui, multiplié par lui-même, donne 49 : c'est 7. Un carré d'aire 49 a un côté de 7."
phrases:
