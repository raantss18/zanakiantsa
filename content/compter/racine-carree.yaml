id: racine-carree
titre: "La racine carrée"
niveau: 4e
prerequis: ["puissances-carre"]
programme: { source: cycle4, texte: "Comprendre et connaitre la définition de la racine carrée d'un nombre positif." }
activite: quiz
parametres: {}
idee: "La racine carrée de 49, c'est le nombre positif qui, multiplié par lui-même, donne 49 : c'est 7. Un carré d'aire 49 a un côté de 7."
phrases:
  consigne: "Cherche le nombre qui, multiplié par lui-même, donne ce résultat."
  question: "{texte}"
  indice: "Récite les carrés : lequel tombe sur ce nombre ?"
  exemple: "La racine carrée de 49 est 7, car 7 × 7 = 49."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
  - texte: "Quelle est la racine carrée de 4 ?"
    nom: "2"
    explication: "2 × 2 = 4 : la racine carrée de 4 est 2."
    pieges:
      - { texte: "3", pourquoi: "3 × 3 = 9, pas 4." }
      - { texte: "1", pourquoi: "1 × 1 = 1, pas 4." }
  - texte: "Quelle est la racine carrée de 9 ?"
