en:
  titre: "Square roots"
  idee: "The square root of 49 is the positive number that, multiplied by itself, gives 49: it's 7. A square with area 49 has a side of 7."
  phrases:
    consigne: "Find the number that, multiplied by itself, gives this answer."
    question: "{texte}"
    indice: "Say your squares: which one lands on this number?"
    exemple: "The square root of 49 is 7, because 7 × 7 = 49."
    demonstration: "{explication}"
    bravo: "Yes! The answer is {bonne}."
  items:
    - texte: "What is the square root of 4?"
      nom: "2"
      explication: "2 × 2 = 4: the square root of 4 is 2."
      pieges:
        - { texte: "3", pourquoi: "3 × 3 = 9, not 4." }
        - { texte: "1", pourquoi: "1 × 1 = 1, not 4." }
    - texte: "What is the square root of 9?"
      nom: "3"
      explication: "3 × 3 = 9: the square root of 9 is 3."
      pieges:
        - { texte: "4", pourquoi: "4 is about half of 9. We want the number that, multiplied by itself, gives 9." }
        - { texte: "2", pourquoi: "2 × 2 = 4, not 9." }
    - texte: "What is the square root of 16?"
      nom: "4"
      explication: "4 × 4 = 16: the square root of 16 is 4."
