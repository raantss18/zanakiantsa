    nom: "14"
    explication: "7 × 2 = 14. Deux signes moins donnent un résultat positif."
    pieges:
      - { texte: "−14", pourquoi: "Regarde le signe : deux facteurs négatifs donnent un positif, un seul donne un négatif." }
