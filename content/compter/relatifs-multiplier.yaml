id: relatifs-multiplier
titre: "Multiplier des nombres relatifs"
niveau: 4e
prerequis: ["relatifs-additionner", "tables-8-9"]
programme: { source: cycle4, texte: "Multiplier deux nombres relatifs : d'abord dans le cas où un seul des facteurs est négatif, puis dans le cas où les deux facteurs sont négatifs." }
activite: quiz
parametres: {}
idee: "On multiplie les deux nombres sans leur signe, puis on trouve le signe : un seul facteur négatif donne un négatif, deux facteurs négatifs donnent un positif."
phrases:
  consigne: "Multiplie sans les signes, trouve le signe, puis touche le résultat."
  question: "{texte}"
  indice: "Compte les signes moins : un seul, c'est négatif ; deux, c'est positif."
  exemple: "(−4) × 3 = −12, et (−4) × (−3) = 12."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
