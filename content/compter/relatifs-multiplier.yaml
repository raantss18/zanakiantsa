    pieges:
      - { texte: "−27", pourquoi: "Regarde le signe : deux facteurs négatifs donnent un positif, un seul donne un négatif." }
      - { texte: "−12", pourquoi: "Ça, c'est la somme. Ici, on multiplie." }
  - texte: "8 × (−4) = ?"
    nom: "−32"
    explication: "8 × 4 = 32. Un seul signe moins donne un résultat négatif."
    pieges:
      - { texte: "32", pourquoi: "Regarde le signe : deux facteurs négatifs donnent un positif, un seul donne un négatif." }
      - { texte: "4", pourquoi: "Ça, c'est la somme. Ici, on multiplie." }
  - texte: "(−6) × 7 = ?"
    nom: "−42"
    explication: "6 × 7 = 42. Un seul signe moins donne un résultat négatif."
    pieges:
      - { texte: "42", pourquoi: "Regarde le signe : deux facteurs négatifs donnent un positif, un seul donne un négatif." }
      - { texte: "1", pourquoi: "Ça, c'est la somme. Ici, on multiplie." }
  - texte: "(−5) × (−5) = ?"
    nom: "25"
    explication: "5 × 5 = 25. Deux signes moins donnent un résultat positif."
    pieges:
      - { texte: "−25", pourquoi: "Regarde le signe : deux facteurs négatifs donnent un positif, un seul donne un négatif." }
      - { texte: "−10", pourquoi: "Ça, c'est la somme. Ici, on multiplie." }
  - texte: "9 × (−3) = ?"
    nom: "−27"
    explication: "9 × 3 = 27. Un seul signe moins donne un résultat négatif."
    pieges:
      - { texte: "27", pourquoi: "Regarde le signe : deux facteurs négatifs donnent un positif, un seul donne un négatif." }
      - { texte: "6", pourquoi: "Ça, c'est la somme. Ici, on multiplie." }
  - texte: "(−8) × 6 = ?"
    nom: "−48"
