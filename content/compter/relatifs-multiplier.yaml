    nom: "−12"
    explication: "4 × 3 = 12. Un seul signe moins donne un résultat négatif."
    pieges:
      - { texte: "12", pourquoi: "Regarde le signe : deux facteurs négatifs donnent un positif, un seul donne un négatif." }
      - { texte: "−1", pourquoi: "Ça, c'est la somme. Ici, on multiplie." }
  - texte: "5 × (−6) = ?"
    nom: "−30"
    explication: "5 × 6 = 30. Un seul signe moins donne un résultat négatif."
    pieges:
