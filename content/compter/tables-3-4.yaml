id: tables-3-4
titre: Tables de 3 et 4
niveau: CE1
prerequis: [tables-2-5-10]
programme: { source: cycle2, texte: "Connaitre dans les deux sens les tables de multiplication : A × B = C, où A et B sont des nombres entiers compris entre 0 et 10." }
activite: tables
parametres: { tables: [3, 4] }
variantes: ["Combien font {a} fois {b} ?", "{a} rangées de {b} : combien en tout ?"]
idee: "{a} fois {b}, ce sont {a} rangées de {b}. On peut compter de {b} en {b}."
phrases:
  consigne: "Chaque rangée a le même nombre d'objets : compte de rangée en rangée. Puis touche le résultat."
  question: "{a} × {b} = ?"
  indice: "{a} rangées de {b} : compte de {b} en {b}."
  exemple: "{a} fois {b}, c'est {b} répété {a} fois."
  demonstration: "Regarde : {a} fois {b} égale {n}."
  bravo: "Oui ! {a} fois {b} égale {n}."

en:
  titre: "3 and 4 times tables"
  idee: "{a} times {b} is {a} rows of {b}. You can count in {b}s."
  phrases:
    consigne: "Each row has the same number of things: count row by row. Then touch the answer."
    question: "{a} × {b} = ?"
    indice: "{a} rows of {b}: count in {b}s."
    exemple: "{a} times {b} is {b}, {a} times over."
    demonstration: "Look: {a} times {b} equals {n}."
    bravo: "Yes! {a} times {b} equals {n}."
  variantes: ["What is {a} times {b}?", "{a} rows of {b}: how many altogether?"]
