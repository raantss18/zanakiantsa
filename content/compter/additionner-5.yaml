id: additionner-5
titre: Additions jusqu'à 5
niveau: CP
prerequis: [composer-10]
programme: { source: cycle2, texte: "Connaitre dans les deux sens les tables d’addition (A + B = C, A et B entre 0 et 10)." }
activite: calcul
parametres: { forme: somme, total_max: 5 }
idee: "Ajouter, c'est mettre ensemble. On compte ceux du début, puis on continue avec ceux qui arrivent."
phrases:
  consigne: "Écris le résultat avec ton doigt."
  question: "{prenom} a {a} {objets}. Il en arrive {b}. Combien en tout ?"
  indice: "Tu peux compter sur tes doigts : {a}, puis {b} de plus."
  exemple: "Pense à {a} {objets} et encore {b} {objets}."
  demonstration: "Regarde : {a} et {b} font {n}."
  bravo: "Oui, {a} plus {b} égale {n}."
