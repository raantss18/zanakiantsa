        - { texte: "x² + 7x + 49", pourquoi: "The middle term is twice the product: 2 × x × 7." }
    - texte: "Expand (x + 2)²"
      nom: "x² + 4x + 4"
      explication: "(a + b)² = a² + 2ab + b² : x² + 2 × x × 2 + 2² = x² + 4x + 4."
      pieges:
        - { texte: "x² + 4", pourquoi: "The middle term 2ab is missing: (a + b)² is not a² + b²." }
        - { texte: "x² + 2x + 4", pourquoi: "The middle term is twice the product: 2 × x × 2." }
    - texte: "Expand (x + 6)²"
      nom: "x² + 12x + 36"
      explication: "(a + b)² = a² + 2ab + b² : x² + 2 × x × 6 + 6² = x² + 12x + 36."
      pieges:
        - { texte: "x² + 36", pourquoi: "The middle term 2ab is missing: (a + b)² is not a² + b²." }
        - { texte: "x² + 6x + 36", pourquoi: "The middle term is twice the product: 2 × x × 6." }
    - texte: "Expand (x − 4)(x + 4)"
      nom: "x² − 16"
      explication: "(a − b)(a + b) = a² − b² : x² − 4² = x² − 16."
      pieges:
        - { texte: "x² + 16", pourquoi: "The minus sign stays: (a − b)(a + b) = a² − b²." }
