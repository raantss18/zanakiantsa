        - { texte: "x² + 5x + 25", pourquoi: "The middle term is twice the product: 2 × x × 5." }
    - texte: "Expand (x + 4)²"
      nom: "x² + 8x + 16"
      explication: "(a + b)² = a² + 2ab + b² : x² + 2 × x × 4 + 4² = x² + 8x + 16."
      pieges:
        - { texte: "x² + 16", pourquoi: "The middle term 2ab is missing: (a + b)² is not a² + b²." }
        - { texte: "x² + 4x + 16", pourquoi: "The middle term is twice the product: 2 × x × 4." }
    - texte: "Expand (x + 7)²"
