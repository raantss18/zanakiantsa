id: denombrer-10
titre: Compter jusqu'à 10
niveau: GS
prerequis: [denombrer-6]
programme: { source: cycle1, texte: "Dénombrer une collection d’objets (jusqu’à dix, voire au-delà)." }
activite: denombrer
parametres: { min: 6, max: 10, objet: 2 }
phrases:
  consigne: "Touche chaque {objet} pour compter."
  question: "Combien de {objets} ?"
