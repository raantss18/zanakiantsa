id: denombrer-10
titre: Compter jusqu'à 10
niveau: GS
prerequis: [denombrer-6]
programme: { source: cycle1, texte: "Dénombrer une collection d’objets (jusqu’à dix, voire au-delà)." }
activite: denombrer
parametres: { min: 6, max: 10, objet: 2 }
variantes: ["Combien vois-tu de {objets} ?", "Compte les {objets}, un par un."]
idee: "On compte jusqu'à dix en touchant chaque {objet} une seule fois. Le dernier nombre dit combien il y en a en tout."
phrases:
  consigne: "Touche chaque {objet} une seule fois en comptant. Le dernier nombre dit, c'est combien il y en a : touche-le."
  question: "Combien de {objets} ?"
  indice: "Touche les {objets} {un} par {un}, sans en oublier."
  exemple: "Le dernier nombre dit, c'est le nombre de {objets}."
  demonstration: "Regarde : je compte avec toi. Il y a {n} {objets}."
  bravo: "Oui, il y a {n} {objets}."
