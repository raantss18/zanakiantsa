# Animation de méthode, jouée à la première ouverture du jour (ADR 0033).
intro:
  - texte: "Pour compter, on touche chaque objet une seule fois."
    images: ["1f446", "1f34e", "1f34e", "1f34e"]
  - texte: "Le dernier nombre qu'on dit, c'est combien il y en a."
    images: ["1f34e", "1f34e", "1f34e"]
    grand: "3"
  - texte: "Ajouter, c'est mettre ensemble."
    images: ["1f34e", "1f34e", "1f34c"]
    grand: "2 + 1 = 3"

en:
  titre: "Counting and calculating"
  nom: "Numbers"
  noms: {moyens: "Maths", grands: "Mathematics"}
  resume: "Counting, making numbers, adding, subtracting, times tables, sharing, telling the time, column methods digit by digit, large numbers, division, fractions, decimals, measures and time, area, proportion, percentages, angles, factors and prime numbers, order of operations, negative numbers, powers, algebra, squares and roots, equations, Pythagoras, the intercept theorem, trigonometry, speed, linear functions, scientific notation; at sixth-form level, functions, vectors, statistics, probability, quadratics, sequences, derivatives, logarithms, the binomial distribution, equations of lines, reference functions, expected value, the exponential function, convexity, differential equations."
  intro:
    - texte: "To count, touch each thing only once."
      images: ["1f446", "1f34e", "1f34e", "1f34e"]
    - texte: "The last number you say is how many there are."
      images: ["1f34e", "1f34e", "1f34e"]
      grand: "3"
    - texte: "Adding means putting together."
      images: ["1f34e", "1f34e", "1f34c"]
      grand: "2 + 1 = 3"
