id: puissances-carre
titre: "Les carrés"
niveau: 5e
prerequis: ["tables-8-9"]
programme: { source: cycle4, texte: "Connaitre les carrés des entiers de 0 à 12." }
activite: quiz
parametres: {}
idee: "Le carré d'un nombre, c'est ce nombre multiplié par lui-même : 5² = 5 × 5 = 25."
phrases:
  consigne: "Multiplie le nombre par lui-même, puis touche le résultat."
  question: "{texte}"
  indice: "Le petit 2 dit : multiplie le nombre par lui-même."
  exemple: "7² = 7 × 7 = 49, pas 7 × 2."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
  - texte: "Combien fait 2² ?"
    nom: "4"
    explication: "2² = 2 × 2 = 4."
    pieges:
      - { texte: "6", pourquoi: "2², c'est 2 × 2, sans rien ajouter." }
      - { texte: "5", pourquoi: "Calcule le nombre multiplié par lui-même." }
  - texte: "Combien fait 3² ?"
    nom: "9"
    explication: "3² = 3 × 3 = 9."
    pieges:
      - { texte: "6", pourquoi: "6, c'est 3 × 2. Le carré, c'est 3 × 3." }
      - { texte: "12", pourquoi: "3², c'est 3 × 3, sans rien ajouter." }
