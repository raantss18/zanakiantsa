id: composer-10
titre: Compléter jusqu'à un nombre
niveau: GS
prerequis: [constituer-10]
programme: { source: cycle1, texte: "Composer et décomposer des nombres inférieurs ou égaux à dix, voire au-delà." }
activite: composer
parametres: { cible_min: 4, cible_max: 10, depart_min: 1, depart_max: 6 }
idee: "Il y en a déjà quelques-uns. On compte ceux qui sont là, puis on continue à compter en ajoutant."
phrases:
  consigne: "Il y a déjà {a} {objets}. Touche pour en ajouter jusqu'à en avoir {n}, puis touche ✔."
  question: "As-tu {n} {objets} ? Appuie sur ✔."
  indice: "Compte à partir de {a} : {a}, puis le suivant…"
  exemple: "Ajoute {un} {objet} à la fois et compte jusqu'à {n}."
  demonstration: "Regarde : {a}, puis j'ajoute {b}. {a} et {b} font {n}."
  bravo: "Oui ! {a} et {b} font {n}."

en:
  titre: "Adding up to a number"
  idee: "There are already a few. Count the ones that are there, then carry on counting as you add more."
  phrases:
    consigne: "There are already {a} {objets}. Touch to add more until you have {n}, then touch ✔."
    question: "Do you have {n} {objets}? Press ✔."
    indice: "Count on from {a}: {a}, then the next one…"
    exemple: "Add one {objet} at a time and count up to {n}."
    demonstration: "Look: {a}, then I add {b}. {a} and {b} make {n}."
    bravo: "Yes! {a} and {b} make {n}."
