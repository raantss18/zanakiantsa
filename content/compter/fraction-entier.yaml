id: fraction-entier
titre: "Une fraction d'un nombre"
niveau: 6e
prerequis: ["fractions-quantite"]
programme: { source: cycle3, texte: "Utiliser une multiplication pour appliquer une fraction à un nombre entier." }
activite: quiz
parametres: {}
idee: "Trois quarts de 20 : on divise 20 par 4, puis on multiplie par 3. Le dénominateur partage, le numérateur compte les parts."
phrases:
  consigne: "Calcule, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Divise par le dénominateur, puis multiplie par le numérateur."
  exemple: "Trois quarts de 20 : 20 ÷ 4 = 5, puis 5 × 3 = 15."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
  - texte: "Combien font 3/4 de 20 ?"
    nom: "15"
    explication: "20 ÷ 4 = 5, puis 5 × 3 = 15."
    pieges:
      - { texte: "5", pourquoi: "5, c'est une seule part : 1/4 de 20. Il en faut 3." }
      - { texte: "60", pourquoi: "20 × 3 : il faut encore diviser par 4." }
