id: decimaux-comparer
titre: "Comparer des nombres décimaux"
niveau: CM2
prerequis: ["decimaux-droite"]
programme: { source: cycle3, texte: "Comparer, encadrer, intercaler, ordonner par ordre croissant ou décroissant des nombres décimaux donnés par leur écriture à virgule en utilisant les symboles =, < et >" }
activite: quiz
parametres: {}
idee: "On compare d'abord les parties entières. Si elles sont égales, on compare les dixièmes, puis les centièmes, puis les millièmes. 2,5 est plus grand que 2,45."
phrases:
  consigne: "Calcule, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Écris les nombres avec autant de chiffres après la virgule : 2,50 et 2,45."
  exemple: "2,5 ou 2,45 ? Parties entières : 2 et 2. Dixièmes : 5 et 4. 5 est supérieur à 4, donc 2,5 est supérieur à 2,45, même si 45 est plus grand que 5."
  demonstration: "{explication}"
  bravo: "Oui ! C'est la bonne réponse."
items:
  - texte: "Quel nombre est le plus grand : 2,5 ou 2,45 ?"
    nom: "2,5"
    explication: "2,5 = 2,50. Dixièmes : 5 est supérieur à 4. Donc 2,5 est le plus grand."
    pieges:
      - { texte: "2,45", pourquoi: "45 est plus grand que 5, mais ce sont des centièmes : 2,45 est inférieur à 2,50." }
      - { texte: "Ils sont égaux.", pourquoi: "Les parties entières sont égales, mais pas les dixièmes : 5 et 4." }
  - texte: "Quel nombre est le plus petit : 0,8 ; 0,75 ; 0,708 ?"
    nom: "0,708"
    explication: "On écrit 0,800 ; 0,750 ; 0,708. Le plus petit est 0,708."
    pieges:
      - { texte: "0,8", pourquoi: "Le plus court n'est pas le plus petit : 0,8 = 0,800 est le plus grand." }
      - { texte: "0,75", pourquoi: "0,750 est supérieur à 0,708 : 5 centièmes, c'est plus que 0 centième." }
  - texte: "Quel nombre est compris entre 3,1 et 3,2 ?"
    nom: "3,15"
    explication: "3,10 est inférieur à 3,15, et 3,15 est inférieur à 3,20."
    pieges:
      - { texte: "3,25", pourquoi: "3,25 est supérieur à 3,2 : il est après 3,2." }
      - { texte: "3,05", pourquoi: "3,05 est inférieur à 3,1 : 0 dixième, c'est moins que 1 dixième." }
  - texte: "Quelle liste va du plus petit au plus grand ?"
    nom: "1,03 ; 1,3 ; 1,33"
    explication: "On écrit 1,03 ; 1,30 ; 1,33. Dans cet ordre, ils vont du plus petit au plus grand."
    pieges:
      - { texte: "1,3 ; 1,03 ; 1,33", pourquoi: "1,03 a 0 dixième : il est plus petit que 1,3." }
      - { texte: "1,33 ; 1,3 ; 1,03", pourquoi: "C'est l'ordre décroissant : du plus grand au plus petit." }
  - texte: "Complète : 4,07 est … 4,7."
    nom: "inférieur à"
    explication: "Mêmes unités. Dixièmes : 0 et 7. 0 est inférieur à 7, donc 4,07 est inférieur à 4,7."
    pieges:
      - { texte: "supérieur à", pourquoi: "0 dixième, c'est moins que 7 dixièmes : 4,07 est plus petit." }
      - { texte: "égal à", pourquoi: "Le 0 juste après la virgule compte : 4,07 n'est pas égal à 4,7." }
  - texte: "Quel nombre est le plus grand : 12,9 ou 9,12 ?"
    nom: "12,9"
    explication: "On compare d'abord les parties entières : 12 est supérieur à 9."
    pieges:
      - { texte: "9,12", pourquoi: "On compare d'abord les parties entières : 12 est plus grand que 9." }
      - { texte: "Ils sont égaux.", pourquoi: "Ce sont les mêmes chiffres, mais pas aux mêmes places." }
  - texte: "Entre quels nombres entiers qui se suivent se trouve 6,48 ?"
    nom: "6 et 7"
    explication: "6,48 est supérieur à 6 et inférieur à 7 : 6 et 7 se suivent."
    pieges:
      - { texte: "6,4 et 6,5", pourquoi: "C'est un bon encadrement, mais par des décimaux : on demande deux entiers." }
      - { texte: "48 et 49", pourquoi: "La partie entière de 6,48 est 6 : 48, ce sont des centièmes." }
  - texte: "On compare 5,306 et 5,36. On écrit 5,36 = 5,360. On compare 306 millièmes et … millièmes. Quel nombre manque ?"
    nom: "360"
    explication: "5,36 = 5,360 : 36 centièmes = 360 millièmes. 306 est inférieur à 360, donc 5,306 est inférieur à 5,36."
    pieges:
      - { texte: "36", pourquoi: "On compare des millièmes : 36 centièmes = 360 millièmes." }
      - { texte: "3 600", pourquoi: "5,360 a trois chiffres après la virgule : 360 millièmes." }
  - texte: "Pourquoi 0,9 est-il plus grand que 0,123 ?"
    nom: "Parce que 9 dixièmes, c'est plus que 1 dixième."
    explication: "On compare rang par rang : aux dixièmes, 9 et 1. 0,900 est supérieur à 0,123."
    pieges:
      - { texte: "Il n'est pas plus grand : 123 est plus grand que 9.", pourquoi: "On ne compare pas 123 et 9 : 0,900 est supérieur à 0,123." }
      - { texte: "Parce qu'il a moins de chiffres.", pourquoi: "Le nombre de chiffres après la virgule ne décide pas : on compare rang par rang." }

en:
  titre: "Comparing decimals"
  idee: "First compare the whole-number parts. If they are equal, compare the tenths, then the hundredths, then the thousandths. 2.5 is bigger than 2.45."
  phrases:
    consigne: "Work it out, then touch the right answer."
    question: "{texte}"
    indice: "Write the numbers with the same number of digits after the point: 2.50 and 2.45."
    exemple: "2.5 or 2.45? Whole parts: 2 and 2. Tenths: 5 and 4. 5 is greater than 4, so 2.5 is greater than 2.45, even though 45 is bigger than 5."
    demonstration: "{explication}"
    bravo: "Yes! That's the right answer."
  items:
    - texte: "Which number is bigger: 2.5 or 2.45?"
      nom: "2.5"
      explication: "2.5 = 2.50. Tenths: 5 is greater than 4. So 2.5 is bigger."
      pieges:
        - { texte: "2.45", pourquoi: "45 is bigger than 5, but those are hundredths: 2.45 is less than 2.50." }
        - { texte: "They are equal.", pourquoi: "The whole parts are equal, but not the tenths: 5 and 4." }
    - texte: "Which number is the smallest: 0.8; 0.75; 0.708?"
      nom: "0.708"
      explication: "Write 0.800; 0.750; 0.708. The smallest is 0.708."
      pieges:
        - { texte: "0.8", pourquoi: "The shortest is not the smallest: 0.8 = 0.800 is the biggest." }
        - { texte: "0.75", pourquoi: "0.750 is greater than 0.708: 5 hundredths is more than 0 hundredths." }
    - texte: "Which number is between 3.1 and 3.2?"
      nom: "3.15"
      explication: "3.10 is less than 3.15, and 3.15 is less than 3.20."
      pieges:
        - { texte: "3.25", pourquoi: "3.25 is greater than 3.2: it comes after 3.2." }
        - { texte: "3.05", pourquoi: "3.05 is less than 3.1: 0 tenths is less than 1 tenth." }
    - texte: "Which list goes from smallest to biggest?"
      nom: "1.03; 1.3; 1.33"
      explication: "Write 1.03; 1.30; 1.33. In that order they go from smallest to biggest."
      pieges:
        - { texte: "1.3; 1.03; 1.33", pourquoi: "1.03 has 0 tenths: it is smaller than 1.3." }
        - { texte: "1.33; 1.3; 1.03", pourquoi: "That is decreasing order: from biggest to smallest." }
    - texte: "Fill the gap: 4.07 is … 4.7."
      nom: "less than"
      explication: "Same ones. Tenths: 0 and 7. 0 is less than 7, so 4.07 is less than 4.7."
      pieges:
        - { texte: "greater than", pourquoi: "0 tenths is less than 7 tenths: 4.07 is smaller." }
        - { texte: "equal to", pourquoi: "The 0 just after the point counts: 4.07 is not equal to 4.7." }
    - texte: "Which number is bigger: 12.9 or 9.12?"
      nom: "12.9"
      explication: "Compare the whole parts first: 12 is greater than 9."
      pieges:
        - { texte: "9.12", pourquoi: "Compare the whole parts first: 12 is bigger than 9." }
        - { texte: "They are equal.", pourquoi: "They have the same digits, but not in the same places." }
    - texte: "Between which two consecutive whole numbers is 6.48?"
      nom: "6 and 7"
      explication: "6.48 is greater than 6 and less than 7: 6 and 7 are consecutive."
      pieges:
        - { texte: "6.4 and 6.5", pourquoi: "That's a good range, but with decimals: we want two whole numbers." }
        - { texte: "48 and 49", pourquoi: "The whole-number part of 6.48 is 6: 48 are hundredths." }
    - texte: "Compare 5.306 and 5.36. Write 5.36 = 5.360. Compare 306 thousandths and … thousandths. Which number is missing?"
      nom: "360"
      explication: "5.36 = 5.360: 36 hundredths = 360 thousandths. 306 is less than 360, so 5.306 is less than 5.36."
      pieges:
        - { texte: "36", pourquoi: "We are comparing thousandths: 36 hundredths = 360 thousandths." }
        - { texte: "3,600", pourquoi: "5.360 has three digits after the point: 360 thousandths." }
    - texte: "Why is 0.9 bigger than 0.123?"
      nom: "Because 9 tenths is more than 1 tenth."
      explication: "Compare place by place: in the tenths, 9 and 1. 0.900 is greater than 0.123."
      pieges:
        - { texte: "It isn't bigger: 123 is bigger than 9.", pourquoi: "Don't compare 123 and 9: 0.900 is greater than 0.123." }
        - { texte: "Because it has fewer digits.", pourquoi: "The number of digits after the point doesn't decide: compare place by place." }
