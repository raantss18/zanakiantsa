id: groupes
titre: Des paquets pareils (sens de la multiplication)
niveau: CP
prerequis: [dizaines-construire]
programme: { source: cycle2, texte: "Résoudre des problèmes multiplicatifs en une étape (champ numérique inférieur ou égal à 30) : rechercher la valeur d’un tout composé de plusieurs parties de même valeur ; l’élève peut aussi utiliser des additions itérées." }
activite: groupes
parametres: { groupes_max: 5, par_min: 2, par_max: 6, total_max: 30 }
variantes: ["{a} paquets de {b} {objets} : combien en tout ?", "Il y a {a} boîtes. Dans chaque boîte, {b} {objets}. Combien en tout ?"]
idee: "Quand tous les paquets ont le même nombre, on peut compter paquet par paquet : c'est la multiplication."
phrases:
  consigne: "Regarde les paquets : ils ont tous le même nombre."
  question: "{prenom} a {a} paquets de {b} {objets}. Combien en tout ?"
  indice: "Compte un paquet, puis ajoute les autres : {b}, puis encore {b}…"
  exemple: "Tu peux compter tous les objets un par un."
  demonstration: "Regarde : {a} paquets de {b}, cela fait {n}."
  bravo: "Oui ! {a} fois {b}, cela fait {n}."
