id: additionner-10
titre: Additions jusqu'à 10
niveau: CP
prerequis: [additionner-5]
programme: { source: cycle2, texte: "Connaitre dans les deux sens les tables d’addition (A + B = C, A et B entre 0 et 10)." }
activite: calcul
parametres: { forme: somme, total_max: 10 }
variantes: ["Combien font {a} et {b} ?", "{a} + {b} = ?", "{prenom} trouve {a} {objets}, puis encore {b}. Combien en tout ?", "Dans {contenant}, il y a {a} {objets}. On en ajoute {b}. Combien maintenant ?"]
idee: "Ajouter, c'est mettre ensemble. Pars du premier nombre et avance encore du deuxième."
phrases:
  consigne: "Ajoute les deux nombres. Puis écris le résultat avec ton doigt, ou touche le bon nombre."
  question: "{prenom} a {a} {objets}. Il en arrive {b}. Combien en tout ?"
  indice: "Pars du plus grand nombre et compte le petit en plus."
  exemple: "Pour {a} plus {b} : pars de {a} et avance de {b}."
  demonstration: "Regarde : {a} et {b} font {n}."
  bravo: "Oui, {a} plus {b} égale {n}."

en:
  titre: "Adding up to 10"
  idee: "Adding means putting together. Start from the first number and count on by the second."
  phrases:
    consigne: "Add the two numbers. Then write the answer with your finger, or touch the right number."
    question: "{prenom} has {a} {objets}. {b} more arrive. How many altogether?"
    indice: "Start from the bigger number and count on the smaller one."
    exemple: "For {a} plus {b}: start at {a} and count on {b}."
    demonstration: "Look: {a} and {b} make {n}."
    bravo: "Yes, {a} plus {b} equals {n}."
  variantes: ["What is {a} and {b}?", "{a} + {b} = ?", "{prenom} finds {a} {objets}, then {b} more. How many altogether?", "There are {a} {objets} in {contenant}. We add {b}. How many now?"]
