id: dizaines-lire
titre: Lire un nombre en dizaines et unités
niveau: CP
prerequis: [complement-10]
programme: { source: cycle2, texte: "Face à une collection composée de trois barres de dix cubes et quatre cubes isolés, l’élève reconnait qu’il y a trente-quatre cubes. Il verbalise sous la forme : « Trois dizaines et quatre unités, cela fait trente-quatre »." }
activite: batonnets
parametres: { mode: lire, min: 11, max: 59 }
variantes: ["Compte les bâtonnets : combien en tout ?", "Paquets de dix et bâtonnets seuls : quel nombre vois-tu ?"]
idee: "Un paquet, c'est dix bâtonnets attachés. On compte les paquets de dix en dix, puis les bâtonnets seuls."
phrases:
  consigne: "Un paquet, c'est dix bâtonnets. Compte les paquets de dix en dix, puis les bâtonnets seuls. Puis touche le nombre."
  question: "Combien y a-t-il de bâtonnets ?"
  indice: "Compte de dix en dix pour les paquets : dix, vingt, trente… puis ajoute les bâtonnets seuls."
  exemple: "Il y a {dizaines} et {unites}."
  demonstration: "Regarde : {dizaines} et {unites}, cela fait {n}."
  bravo: "Oui ! {dizaines} et {unites}, cela fait {n}."

en:
  titre: "Reading a number in tens and ones"
  idee: "A bundle is ten sticks tied together. Count the bundles in tens, then the single sticks."
  phrases:
    consigne: "A bundle is ten sticks. Count the bundles in tens, then the single sticks. Then touch the number."
    question: "How many sticks are there?"
    indice: "Count in tens for the bundles: ten, twenty, thirty… then add the single sticks."
    exemple: "There are {dizaines} and {unites}."
    demonstration: "Look: {dizaines} and {unites} make {n}."
    bravo: "Yes! {dizaines} and {unites} make {n}."
  variantes: ["Count the sticks: how many altogether?", "Bundles of ten and single sticks: what number can you see?"]
