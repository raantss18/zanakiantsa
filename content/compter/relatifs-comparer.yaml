    pieges:
      - { texte: "−5", pourquoi: "−5 est plus à gauche que 0 sur la droite graduée." }
      - { texte: "−2", pourquoi: "−2 est plus à gauche que 0 sur la droite graduée." }
  - texte: "Lequel est le plus grand : −10, −3 ou −30 ?"
