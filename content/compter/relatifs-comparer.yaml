        - { texte: "−5", pourquoi: "−5 is further left than 0 on the number line." }
        - { texte: "−2", pourquoi: "−2 is further left than 0 on the number line." }
    - texte: "Which is the biggest: −10, −3 or −30?"
      nom: "−3"
      explication: "On the number line, the biggest is the furthest right: −3."
      pieges:
        - { texte: "−10", pourquoi: "−10 is further left than −3 on the number line." }
        - { texte: "−30", pourquoi: "−30 is further left than −3 on the number line." }
    - texte: "Which is the biggest: −6, 2 or −8?"
