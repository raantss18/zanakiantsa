id: addition-posee
titre: L'addition posée en colonnes
niveau: CE1
prerequis: [dizaines-lire]
programme: { source: cycle2, texte: "Poser et effectuer des additions en colonnes : l’élève positionne les unités sous les unités, les dizaines sous les dizaines, et en calcule le résultat. Par exemple, 45 + 37." }
activite: posee
parametres: { op: "+", min: 12, max: 79, retenue: true }
idee: "On pose les unités sous les unités, les dizaines sous les dizaines. On commence par les unités : si on dépasse dix, on retient une dizaine."
variantes: ["Combien font {a} + {b} ?", "Calcule {a} plus {b}, en colonnes."]
phrases:
  consigne: "Écris le résultat chiffre par chiffre avec les touches, en commençant par les unités, à droite. Si cela fait dix ou plus, écris la retenue en haut de la colonne suivante."
  question: "{a} + {b} = ?"
  indice: "Une colonne à la fois, de droite à gauche. Si une colonne fait dix ou plus, la dizaine part en retenue sur la colonne suivante."
  exemple: "N'oublie pas d'ajouter la retenue avec les dizaines."
  demonstration: "Regarde : {a} + {b} = {n}."
  bravo: "Oui ! {a} + {b} = {n}."

en:
  titre: "Column addition"
  idee: "Put ones under ones and tens under tens. Start with the ones: if you go past ten, carry one ten."
  phrases:
    consigne: "Write the answer digit by digit with the keys, starting with the ones, on the right. If a column makes ten or more, write the carry at the top of the next column."
    question: "{a} + {b} = ?"
    indice: "One column at a time, from right to left. If a column makes ten or more, the ten is carried to the next column."
    exemple: "Don't forget to add the carry to the tens."
    demonstration: "Look: {a} + {b} = {n}."
    bravo: "Yes! {a} + {b} = {n}."
  variantes: ["What is {a} + {b}?", "Work out {a} plus {b} in columns."]
