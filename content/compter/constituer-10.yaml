id: constituer-10
titre: Mettre le bon nombre
niveau: GS
prerequis: [denombrer-6]
programme: { source: cycle1, texte: "Constituer une collection d’un cardinal donné (jusqu’à dix, voire au-delà)." }
activite: composer
parametres: { cible_min: 3, cible_max: 10, depart_min: 0, depart_max: 0 }
idee: "Pour avoir un nombre de {objets}, on en ajoute un à la fois en comptant. On s'arrête quand on dit le bon nombre."
phrases:
  consigne: "Touche pour mettre des {objets} dans {contenant}, un par un, jusqu'à {n}. Puis touche ✔."
  question: "As-tu mis {n} {objets} ? Appuie sur ✔."
  indice: "Compte les {objets} dans {contenant}, {un} par {un}."
  exemple: "Trop ? Touche {contenant} pour en enlever."
  demonstration: "Regarde : un, deux… jusqu'à {n}. Voilà {n} {objets}."
  bravo: "Oui, il y a {n} {objets} dans {contenant}."

en:
  titre: "Making the right number"
  idee: "To get a number of {objets}, add them one at a time as you count. Stop when you say the right number."
  phrases:
    consigne: "Touch to put {objets} in {contenant}, one by one, up to {n}. Then touch ✔."
    question: "Have you put in {n} {objets}? Press ✔."
    indice: "Count the {objets} in {contenant}, one by one."
    exemple: "Too many? Touch {contenant} to take some out."
    demonstration: "Look: one, two… up to {n}. Here are {n} {objets}."
    bravo: "Yes, there are {n} {objets} in {contenant}."
