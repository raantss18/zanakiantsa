  - texte: "Rends irréductible la fraction 24/36."
    nom: "2/3"
    explication: "24 et 36 se divisent tous les deux par 12 : 24/36 = 2/3."
    pieges:
      - { texte: "12/18", pourquoi: "C’est plus simple, mais on peut encore simplifier : divise par 6." }
