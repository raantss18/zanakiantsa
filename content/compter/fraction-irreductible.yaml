id: fraction-irreductible
titre: "Fractions irréductibles"
niveau: 3e
prerequis: ["fraction-entier"]
programme: { source: cycle4, texte: "Rendre irréductible une fraction." }
activite: quiz
parametres: {}
idee: "Une fraction est irréductible quand on ne peut plus diviser le numérateur et le dénominateur par un même nombre. 12/18 = 2/3, car 12 et 18 se divisent par 6."
phrases:
  consigne: "Simplifie jusqu’au bout, puis touche la réponse."
  question: "{texte}"
  indice: "Cherche le plus grand nombre qui divise le haut et le bas."
  exemple: "24/36 : on divise par 12, on obtient 2/3."
  demonstration: "{explication}"
  bravo: "Oui ! La réponse est {bonne}."
items:
  - texte: "Rends irréductible la fraction 12/18."
    nom: "2/3"
    explication: "12 et 18 se divisent tous les deux par 6 : 12/18 = 2/3."
    pieges:
      - { texte: "6/9", pourquoi: "C’est plus simple, mais on peut encore simplifier : divise par 3." }
      - { texte: "3/2", pourquoi: "Le numérateur reste en haut : seul le dénominateur va en bas." }
  - texte: "Rends irréductible la fraction 15/35."
    nom: "3/7"
