en:
  titre: "Simplest form of a fraction"
  idee: "A fraction is in its simplest form when you can no longer divide the numerator and denominator by the same number. 12/18 = 2/3, because 12 and 18 can both be divided by 6."
  phrases:
    consigne: "Simplify all the way, then touch the answer."
    question: "{texte}"
    indice: "Find the biggest number that divides the top and the bottom."
    exemple: "24/36: divide by 12, and you get 2/3."
    demonstration: "{explication}"
    bravo: "Yes! The answer is {bonne}."
  items:
    - texte: "Write 12/18 in its simplest form."
      nom: "2/3"
      explication: "12 and 18 can both be divided by 6: 12/18 = 2/3."
      pieges:
        - { texte: "6/9", pourquoi: "That is simpler, but you can simplify more: divide by 3." }
        - { texte: "3/2", pourquoi: "The numerator stays on top: only the denominator goes at the bottom." }
    - texte: "Write 15/35 in its simplest form."
      nom: "3/7"
      explication: "15 and 35 can both be divided by 5: 15/35 = 3/7."
      pieges:
        - { texte: "7/3", pourquoi: "The numerator stays on top: only the denominator goes at the bottom." }
