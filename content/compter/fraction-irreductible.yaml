    pieges:
      - { texte: "2/9", pourquoi: "Le numérateur reste en haut : seul le dénominateur va en bas." }
      - { texte: "56/7", pourquoi: "On divise le haut et le bas par le même nombre ; on ne soustrait pas." }
  - texte: "Rends irréductible la fraction 20/45."
    nom: "4/9"
    explication: "20 et 45 se divisent tous les deux par 5 : 20/45 = 4/9."
    pieges:
      - { texte: "9/4", pourquoi: "Le numérateur reste en haut : seul le dénominateur va en bas." }
      - { texte: "15/40", pourquoi: "On divise le haut et le bas par le même nombre ; on ne soustrait pas." }
  - texte: "Rends irréductible la fraction 18/42."
    nom: "3/7"
    explication: "18 et 42 se divisent tous les deux par 6 : 18/42 = 3/7."
    pieges:
      - { texte: "9/21", pourquoi: "C’est plus simple, mais on peut encore simplifier : divise par 3." }
