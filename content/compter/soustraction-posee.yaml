id: soustraction-posee
titre: La soustraction posée en colonnes
niveau: CE1
prerequis: [addition-posee, casser-dizaine]
programme: { source: cycle2, texte: "Un algorithme de la soustraction posée est introduit en période 3 au plus tard (« par cassage » ou « par compensation »)." }
activite: posee
parametres: { op: "-", min: 21, max: 98, retenue: true }
idee: "On commence par les unités. Si on ne peut pas enlever, on casse une dizaine : elle devient dix unités."
variantes: ["Combien font {a} − {b} ?", "Calcule {a} moins {b}, en colonnes."]
phrases:
  consigne: "Écris le résultat chiffre par chiffre avec les touches, en commençant par les unités, à droite. Si tu ne peux pas enlever, casse une dizaine : écris combien il en reste en haut."
  question: "{a} − {b} = ?"
  indice: "Une colonne à la fois, de droite à gauche. Si le chiffre du haut est plus petit, casse une dizaine."
  exemple: "Après avoir cassé une dizaine, il en reste une de moins en haut."
  demonstration: "Regarde : {a} − {b} = {n}."
  bravo: "Oui ! {a} − {b} = {n}."
