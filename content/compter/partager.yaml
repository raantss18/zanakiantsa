id: partager
titre: Partager équitablement
niveau: CP
prerequis: [groupes]
programme: { source: cycle2, texte: "Rechercher la valeur d’une part dans un partage équitable, en s’appuyant sur des objets qu’il distribue un à un, équitablement, dans chacune des parts." }
activite: partage
parametres: { parts_max: 4, par_max: 5 }
variantes: ["{a} enfants se partagent {n} {objets}. Combien chacun ?"]
idee: "Partager équitablement, c'est donner un objet à chacun, chacun son tour, jusqu'à ce qu'il n'en reste plus."
phrases:
  consigne: "Touche un enfant pour lui donner un objet, chacun son tour. C'est réussi quand tous en ont autant et qu'il n'en reste plus."
  question: "Partage les {n} {objets} entre {a} enfants : chacun doit en avoir autant."
  indice: "Donne un objet à chaque enfant, puis recommence, jusqu'à ce qu'il n'en reste plus."
  exemple: "Chacun son tour : le premier, le deuxième, puis encore le premier…"
  demonstration: "Regarde : un par un, chacun son tour. Chacun en a {b}."
  bravo: "Oui ! C'est juste : chacun en a {b}."
