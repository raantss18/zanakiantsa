id: premiere-lettre
titre: "Avec quelle lettre commence le mot ?"
niveau: GS
prerequis: [lettres-capitales, debut]
programme: { source: c1, texte: "Connaitre le nom des lettres de l’alphabet et leur valeur sonore hormis les occlusives." }
activite: lettre
parametres: { mode: initiale }
idee: "On peut faire durer le premier son d'un mot : fffusée, sssapin. Ce son, une lettre l'écrit."
phrases:
  consigne: "Dis le mot en faisant durer son premier son. Puis touche la lettre de ce son."
  question: "Par quelle lettre commence « {texte} » ?"
  indice: "Dis le mot en traînant le début : on entend le son de la lettre."
  exemple: "Essaie une autre lettre."
  demonstration: "Regarde : « {texte} » commence par « {lettre} »."
  bravo: "Oui ! « {texte} » commence par « {lettre} »."
