id: lettres-cursives
titre: "Reconnaître les lettres attachées"
niveau: GS
prerequis: [lettres-minuscules]
programme: { source: c1, texte: "Distinguer des lettres visuellement proches (b/d, c/e/o, p/q) grâce à leur écriture cursive et les nommer correctement." }
activite: lettre
parametres: { mode: cursive, lettres: ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z"] }
idee: "L'écriture attachée, ou cursive, est celle qu'on écrit à la main à l'école. Chaque lettre a sa forme attachée."
phrases:
  consigne: "Regarde la lettre, puis touche la même lettre en écriture attachée."
  question: "Où est « {lettre} » en écriture attachée ?"
  indice: "Regarde le début et la fin de la lettre : ronde, avec une boucle, avec une barre ?"
  exemple: "Essaie une autre lettre."
  demonstration: "Regarde : « {lettre} » en écriture attachée."
  bravo: "Oui ! C'est « {lettre} » en écriture attachée."

en:
  langue: fr
  titre: "French: recognising joined-up letters"
  idee: "Joined-up writing, or cursive, is how we write by hand at school. Every letter has its joined-up shape."
  phrases:
    consigne: "Look at the letter, then touch the same letter in joined-up writing."
    question: "Where is « {lettre} » in joined-up writing?"
    indice: "Look at the start and the end of the letter: is it round, with a loop, with a line?"
    exemple: "Try another letter."
    demonstration: "Look: « {lettre} » in joined-up writing."
    bravo: "Yes! That's « {lettre} » in joined-up writing."
