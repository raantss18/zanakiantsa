id: accord-sujet-verbe
titre: "L’accord sujet-verbe"
niveau: 5e
prerequis: ["present"]
programme: { source: cycle4, texte: "Maitriser les cas complexes de l’accord sujet-verbe (sujet séparé du verbe par un complément, sujet comportant plusieurs noms)." }
activite: quiz
parametres: {}
idee: "Le verbe s’accorde avec son sujet, même quand un complément les sépare : « Les fleurs du jardin poussent. » Deux noms reliés par « et » font un pluriel."
phrases:
  consigne: "Trouve le vrai sujet, puis touche la bonne forme."
  question: "{texte}"
  indice: "Demande « qui est-ce qui … ? » avant le verbe."
  exemple: "« Le chat des voisins dort » : c’est le chat qui dort."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Accorde le verbe au présent : Les fleurs du jardin (pousser) vite."
    nom: "poussent"
    explication: "Le sujet est « les fleurs », pas « jardin » : le complément « du jardin » n’accorde pas le verbe."
    pieges:
      - { texte: "pousse", pourquoi: "Le sujet est « les fleurs », pas « jardin » : le complément « du jardin » n’accorde pas le verbe." }
      - { texte: "pousses", pourquoi: "Ça, c’est la forme avec « tu » : le sujet n’est pas à cette personne." }
  - texte: "Accorde le verbe au présent : Le chat des voisins (dormir) au soleil."
    nom: "dort"
    explication: "Le sujet est « le chat » : « des voisins » est un complément du nom."
    pieges:
      - { texte: "dorment", pourquoi: "Le sujet est « le chat » : « des voisins » est un complément du nom." }
      - { texte: "dors", pourquoi: "Ça, c’est la forme avec « tu » : le sujet n’est pas à cette personne." }
  - texte: "Accorde le verbe au présent : Paul et sa sœur (jouer) dehors."
    nom: "jouent"
    explication: "Deux noms sujets reliés par « et » : le verbe se met au pluriel."
    pieges:
      - { texte: "joue", pourquoi: "Deux noms sujets reliés par « et » : le verbe se met au pluriel." }
      - { texte: "joues", pourquoi: "Ça, c’est la forme avec « tu » : le sujet n’est pas à cette personne." }
  - texte: "Accorde le verbe au présent : Les élèves de la classe (écouter) la maîtresse."
    nom: "écoutent"
    explication: "Le sujet est « les élèves », pas « la classe »."
    pieges:
      - { texte: "écoute", pourquoi: "Le sujet est « les élèves », pas « la classe »." }
      - { texte: "écoutes", pourquoi: "Ça, c’est la forme avec « tu » : le sujet n’est pas à cette personne." }
  - texte: "Accorde le verbe au présent : La couleur de ces fruits (changer) en été."
    nom: "change"
    explication: "Le sujet est « la couleur », singulier : « de ces fruits » est un complément."
    pieges:
      - { texte: "changent", pourquoi: "Le sujet est « la couleur », singulier : « de ces fruits » est un complément." }
      - { texte: "changes", pourquoi: "Ça, c’est la forme avec « tu » : le sujet n’est pas à cette personne." }
  - texte: "Accorde le verbe au présent : Toi et moi (partir) demain."
    nom: "partons"
    explication: "« Toi et moi », c’est « nous » : le verbe se met à la 1re personne du pluriel."
    pieges:
      - { texte: "partent", pourquoi: "« Toi et moi », c’est « nous » : le verbe se met à la 1re personne du pluriel." }
      - { texte: "partez", pourquoi: "Ça, c’est la forme avec « vous » : le sujet n’est pas à cette personne." }
  - texte: "Accorde le verbe au présent : Les livres que je lis (être) passionnants."
    nom: "sont"
    explication: "Le sujet est « les livres », pluriel."
    pieges:
      - { texte: "est", pourquoi: "Le sujet est « les livres », pluriel." }
      - { texte: "êtes", pourquoi: "Ça, c’est la forme avec « vous » : le sujet n’est pas à cette personne." }
  - texte: "Accorde le verbe au présent : Le bruit des vagues (calmer) les enfants."
    nom: "calme"
    explication: "Le sujet est « le bruit », singulier."
    pieges:
      - { texte: "calment", pourquoi: "Le sujet est « le bruit », singulier." }
      - { texte: "calmes", pourquoi: "Ça, c’est la forme avec « tu » : le sujet n’est pas à cette personne." }

en:
  langue: "fr"
  titre: "French: making the verb agree with its subject"
  idee: "The verb agrees with its subject, even when other words come in between: « Les fleurs du jardin poussent. » Two nouns joined by « et » make a plural."
  phrases:
    consigne: "Find the real subject, then touch the right form."
    question: "{texte}"
    indice: "Ask « qui est-ce qui … ? » in front of the verb: who or what is doing it?"
    exemple: "« Le chat des voisins dort »: it's « le chat » that is sleeping."
    demonstration: "{explication}"
    bravo: "Yes! It's « {bonne} »."
  items:
    - texte: "Make the verb agree, in the present tense: « Les fleurs du jardin (pousser) vite. »"
      nom: "poussent"
      explication: "The subject is « les fleurs », not « jardin »: the complement « du jardin » doesn't change the verb."
      pieges:
        - texte: "pousse"
          pourquoi: "The subject is « les fleurs », not « jardin »: the complement « du jardin » doesn't change the verb."
        - texte: "pousses"
          pourquoi: "That's the form for « tu »: the subject isn't « tu »."
    - texte: "Make the verb agree, in the present tense: « Le chat des voisins (dormir) au soleil. »"
      nom: "dort"
      explication: "The subject is « le chat »: « des voisins » just adds to the noun."
      pieges:
        - texte: "dorment"
          pourquoi: "The subject is « le chat »: « des voisins » just adds to the noun."
        - texte: "dors"
          pourquoi: "That's the form for « tu »: the subject isn't « tu »."
    - texte: "Make the verb agree, in the present tense: « Paul et sa sœur (jouer) dehors. »"
      nom: "jouent"
      explication: "Two subject nouns joined by « et »: the verb goes into the plural."
      pieges:
        - texte: "joue"
          pourquoi: "Two subject nouns joined by « et »: the verb goes into the plural."
        - texte: "joues"
          pourquoi: "That's the form for « tu »: the subject isn't « tu »."
    - texte: "Make the verb agree, in the present tense: « Les élèves de la classe (écouter) la maîtresse. »"
      nom: "écoutent"
      explication: "The subject is « les élèves », not « la classe »."
      pieges:
        - texte: "écoute"
          pourquoi: "The subject is « les élèves », not « la classe »."
        - texte: "écoutes"
          pourquoi: "That's the form for « tu »: the subject isn't « tu »."
    - texte: "Make the verb agree, in the present tense: « La couleur de ces fruits (changer) en été. »"
      nom: "change"
      explication: "The subject is « la couleur », singular: « de ces fruits » is a complement."
      pieges:
        - texte: "changent"
          pourquoi: "The subject is « la couleur », singular: « de ces fruits » is a complement."
        - texte: "changes"
          pourquoi: "That's the form for « tu »: the subject isn't « tu »."
    - texte: "Make the verb agree, in the present tense: « Toi et moi (partir) demain. »"
      nom: "partons"
      explication: "« Toi et moi » means « nous »: the verb goes into the first person plural."
      pieges:
        - texte: "partent"
          pourquoi: "« Toi et moi » means « nous »: the verb goes into the first person plural."
        - texte: "partez"
          pourquoi: "That's the form for « vous »: the subject isn't « vous »."
    - texte: "Make the verb agree, in the present tense: « Les livres que je lis (être) passionnants. »"
      nom: "sont"
      explication: "The subject is « les livres », plural."
      pieges:
        - texte: "est"
          pourquoi: "The subject is « les livres », plural."
        - texte: "êtes"
          pourquoi: "That's the form for « vous »: the subject isn't « vous »."
    - texte: "Make the verb agree, in the present tense: « Le bruit des vagues (calmer) les enfants. »"
      nom: "calme"
      explication: "The subject is « le bruit », singular."
      pieges:
        - texte: "calment"
          pourquoi: "The subject is « le bruit », singular."
        - texte: "calmes"
          pourquoi: "That's the form for « tu »: the subject isn't « tu »."
