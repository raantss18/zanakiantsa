id: imparfait
titre: "L’imparfait"
niveau: CM1
prerequis: ["present"]
programme: { source: cycle3, texte: "Conjugaisons à mémoriser et à maîtriser : présent de l’indicatif, imparfait, futur [...] des verbes du premier et du deuxième groupe et des verbes irréguliers du troisième groupe (faire, aller, dire, venir, pouvoir, voir, vouloir, prendre)." }
activite: quiz
parametres: {}
idee: "L’imparfait raconte ce qui durait dans le passé. Sa marque de temps est -ai- ou -i- : je faisais, nous faisions."
phrases:
  consigne: "Lis le verbe et la personne, puis touche la bonne forme."
  question: "{texte}"
  indice: "Cherche la marque de l’imparfait : -ai- ou -i-."
  exemple: "Faire, avec « nous », à l’imparfait : nous faisions."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Conjugue « aller » à l’imparfait, avec « je »."
    nom: "j’allais"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : j’allais."
    pieges:
      - { texte: "je vais", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "j’irai", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « faire » à l’imparfait, avec « nous »."
    nom: "nous faisions"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : nous faisions."
    pieges:
      - { texte: "nous faisons", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "nous ferons", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « prendre » à l’imparfait, avec « ils »."
    nom: "ils prenaient"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : ils prenaient."
    pieges:
      - { texte: "ils prennent", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "ils prendront", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « dire » à l’imparfait, avec « tu »."
    nom: "tu disais"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : tu disais."
    pieges:
      - { texte: "tu dis", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "tu diras", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « venir » à l’imparfait, avec « vous »."
    nom: "vous veniez"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : vous veniez."
    pieges:
      - { texte: "vous venez", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "vous viendrez", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « pouvoir » à l’imparfait, avec « elle »."
    nom: "elle pouvait"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : elle pouvait."
    pieges:
      - { texte: "elle peut", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "elle pourra", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « voir » à l’imparfait, avec « nous »."
    nom: "nous voyions"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : nous voyions."
    pieges:
      - { texte: "nous voyons", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "nous verrons", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « vouloir » à l’imparfait, avec « je »."
    nom: "je voulais"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : je voulais."
    pieges:
      - { texte: "je veux", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "je voudrai", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « finir » à l’imparfait, avec « ils »."
    nom: "ils finissaient"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : ils finissaient."
    pieges:
      - { texte: "ils finissent", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "ils finiront", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « manger » à l’imparfait, avec « tu »."
    nom: "tu mangeais"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : tu mangeais."
    pieges:
