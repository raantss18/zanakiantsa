id: imparfait
titre: "L’imparfait"
niveau: CM1
prerequis: ["present"]
programme: { source: cycle3, texte: "Conjugaisons à mémoriser et à maîtriser : présent de l’indicatif, imparfait, futur [...] des verbes du premier et du deuxième groupe et des verbes irréguliers du troisième groupe (faire, aller, dire, venir, pouvoir, voir, vouloir, prendre)." }
activite: quiz
parametres: {}
idee: "L’imparfait raconte ce qui durait dans le passé. Sa marque de temps est -ai- ou -i- : je faisais, nous faisions."
phrases:
  consigne: "Lis le verbe et la personne, puis touche la bonne forme."
  question: "{texte}"
  indice: "Cherche la marque de l’imparfait : -ai- ou -i-."
  exemple: "Faire, avec « nous », à l’imparfait : nous faisions."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Conjugue « aller » à l’imparfait, avec « je »."
    nom: "j’allais"
    explication: "À l’imparfait, la marque de temps est -ai- ou -i- : j’allais."
    pieges:
      - { texte: "je vais", pourquoi: "Ça, c’est le présent. À l’imparfait, on entend -ai- ou -i- : « il faisait », « nous faisions »." }
      - { texte: "j’irai", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
