id: conditionnel
titre: "Le conditionnel présent"
niveau: 6e
prerequis: ["futur"]
programme: { source: cycle3, texte: "Conjugaisons à mémoriser et à maîtriser : impératif présent, conditionnel présent des verbes être et avoir, des verbes des premier et deuxième groupes, des verbes irréguliers du troisième groupe." }
activite: quiz
parametres: {}
idee: "Le conditionnel, c’est la marque -r- du futur avec les terminaisons de l’imparfait : je voudrais, nous pourrions."
phrases:
  consigne: "Lis le verbe et la personne, puis touche la bonne forme."
  question: "{texte}"
  indice: "Il faut à la fois la marque -r- et une terminaison de l’imparfait."
  exemple: "Vouloir, avec « je », au conditionnel : je voudrais (au futur : je voudrai)."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Conjugue « aller » au conditionnel présent, avec « je »."
    nom: "j’irais"
    explication: "Le conditionnel a la marque -r- du futur et les terminaisons de l’imparfait : j’irais."
    pieges:
      - { texte: "j’irai", pourquoi: "Ça, c’est le futur. Le conditionnel prend les terminaisons de l’imparfait : -ais, -ait, -ions…" }
      - { texte: "j’allais", pourquoi: "Ça, c’est l’imparfait : il manque la marque -r-." }
