id: voix-passive
titre: "La voix passive"
niveau: 4e
prerequis: ["accord-sujet-verbe", "participe-passe-etre"]
programme: { source: cycle4, texte: "Comprendre la construction de la voix passive." }
activite: quiz
parametres: {}
idee: "À la voix passive, le COD devient sujet et subit l’action : « La souris est mangée par le chat. » Le verbe être prend le temps du verbe actif, et le participe s’accorde."
phrases:
  consigne: "Transforme la phrase dans ta tête, puis touche la bonne réponse."
  question: "{texte}"
  indice: "Le COD devient sujet ; « être » au même temps ; le sujet devient « par… »."
  exemple: "« Le chat mange la souris » → « La souris est mangée par le chat »."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Mets à la voix passive : « Le chat mange la souris. »"
    nom: "La souris est mangée par le chat."
    explication: "Le COD devient sujet, le sujet devient complément d’agent (« par… »), et le verbe prend être au même temps : « La souris est mangée par le chat. »"
    pieges:
      - { texte: "Le chat est mangé par la souris.", pourquoi: "Le sens est inversé : c’est le COD de la phrase active qui devient sujet." }
      - { texte: "La souris est mangé par le chat.", pourquoi: "Le participe passé s’accorde avec le nouveau sujet, comme avec l’auxiliaire être." }
