id: futur
titre: "Le futur"
niveau: CM1
prerequis: ["imparfait"]
programme: { source: cycle3, texte: "Savoir isoler et connaître les marques de temps de l’imparfait (-ai-, -i-) ; du futur (-r-)." }
activite: quiz
parametres: {}
idee: "Le futur dit ce qui arrivera. On entend la marque -r- : je ferai, nous viendrons. Certains verbes changent de radical : aller donne j’irai."
phrases:
  consigne: "Lis le verbe et la personne, puis touche la bonne forme."
  question: "{texte}"
  indice: "Cherche la marque -r- du futur."
  exemple: "Venir, avec « vous », au futur : vous viendrez."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Conjugue « aller » au futur, avec « je »."
    nom: "j’irai"
    explication: "Au futur, on entend la marque -r- avant la terminaison : j’irai."
    pieges:
      - { texte: "j’irais", pourquoi: "Ça, c’est le conditionnel. Au futur, avec « je », la terminaison est -ai, sans s." }
      - { texte: "je vais", pourquoi: "Ça, c’est le présent. Le futur a la marque -r- : « tu diras »." }
  - texte: "Conjugue « faire » au futur, avec « nous »."
    nom: "nous ferons"
    explication: "Au futur, on entend la marque -r- avant la terminaison : nous ferons."
    pieges:
      - { texte: "nous ferions", pourquoi: "Ça, c’est le conditionnel : il finit par -ais, -ait, -ions, -iez, -aient." }
      - { texte: "nous faisons", pourquoi: "Ça, c’est le présent. Le futur a la marque -r- : « tu diras »." }
