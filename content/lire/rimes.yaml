  question: "Quel mot rime avec « {texte} » ?"
  indice: "Dis les mots à voix haute et écoute comment ils finissent."
  exemple: "Essaie une autre image."
  demonstration: "Regarde : {explication}"
  bravo: "Oui ! {explication}"
