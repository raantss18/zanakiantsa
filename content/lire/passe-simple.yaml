id: passe-simple
titre: "Le passé simple"
niveau: CM2
prerequis: ["imparfait"]
programme: { source: cycle3, texte: "Conjugaisons à mémoriser et à maîtriser : passé simple, plus-que-parfait des verbes être et avoir, des verbes des premier et deuxième groupes, des verbes irréguliers du troisième groupe : faire, aller, dire, venir, pouvoir, voir, vouloir, prendre." }
activite: quiz
parametres: {}
idee: "Le passé simple est le temps des récits : il raconte une action brève du passé. Il fit, ils prirent, elle alla."
phrases:
  consigne: "Lis le verbe et la personne, puis touche la bonne forme."
  question: "{texte}"
  indice: "Le passé simple est en un seul mot, et ce n’est pas l’imparfait."
  exemple: "Faire, avec « ils », au passé simple : ils firent."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Conjugue « aller » au passé simple, avec « elle »."
    nom: "elle alla"
    explication: "Au passé simple : elle alla."
    pieges:
      - { texte: "elle allait", pourquoi: "Ça, c’est l’imparfait : il dit ce qui durait. Le passé simple dit une action d’un moment, dans un récit." }
      - { texte: "elle est allée", pourquoi: "Ça, c’est le passé composé, en deux mots : auxiliaire + participe passé." }
  - texte: "Conjugue « faire » au passé simple, avec « ils »."
    nom: "ils firent"
    explication: "Au passé simple : ils firent."
    pieges:
      - { texte: "ils faisaient", pourquoi: "Ça, c’est l’imparfait : il dit ce qui durait. Le passé simple dit une action d’un moment, dans un récit." }
