id: tracer-cursive
titre: "Tracer les lettres attachées"
niveau: GS
prerequis: [tracer-capitales, lettres-cursives]
programme: { source: c1, texte: "Tracer des lettres en écriture cursive, les enchainer." }
# Sens du tracé (ADR 0049) : éduscol, « La forme des lettres », 2015 — le rond part en haut à droite et tourne vers la
# gauche ; les autres lettres avancent de gauche à droite.
activite: tracer
parametres: { style: cursive, lettres: ["a", "c", "e", "i", "l", "m", "n", "o", "r", "s", "t", "u"] }
idee: "Les lettres attachées se tracent sans lever le doigt, d'un seul geste."
phrases:
  consigne: "Repasse sur la lettre grise d'un seul geste, sans lever le doigt et sans déborder, de gauche à droite. S'il y a un point vert, commence là. C'est réussi quand toute la lettre est recouverte, dans le bon sens."
  question: "Écris « {lettre} » en lettre attachée."
  indice: "Suis la lettre grise d'un seul geste, de gauche à droite. Un rond commence en haut à droite et tourne vers la gauche."
  exemple: "Tu peux effacer et recommencer."
  demonstration: "Regarde la lettre « {lettre} » attachée."
  bravo: "Bravo ! Tu as écrit « {lettre} » en lettre attachée."

en:
  langue: fr
  titre: "French: writing joined-up letters"
  idee: "Joined-up letters are traced without lifting your finger, all in one go."
  phrases:
    consigne: "Trace over the grey letter in one go, without lifting your finger and staying inside the lines, from left to right. If there is a green dot, start there. You've done it when the whole letter is covered, the right way round."
    question: "Write « {lettre} » as a joined-up letter."
    indice: "Follow the grey letter in one go, from left to right. A round shape starts at the top right and goes round to the left."
    exemple: "You can rub it out and start again."
    demonstration: "Look at the joined-up letter « {lettre} »."
    bravo: "Well done! You wrote « {lettre} » as a joined-up letter."
