id: syllabes
titre: Compter les syllabes d'un mot
niveau: MS
prerequis: []
programme: { source: c1, texte: "À l’oral et sans support écrit, dénombrer les syllabes de mots familiers, comparer les mots selon le nombre de syllabes." }
activite: syllabes
parametres: {}
idee: "Une syllabe, c'est un morceau de mot qu'on dit d'un coup. On tape une fois dans les mains pour chaque morceau."
phrases:
  consigne: "Tape dans tes mains pour chaque morceau du mot."
  question: "Combien de syllabes dans « {texte} » ?"
  indice: "Écoute le mot en morceaux, et compte avec tes doigts."
  exemple: "Touche le bouton des mains pour entendre les morceaux."
  demonstration: "Écoute : {explication}. Cela fait {rep}."
  bravo: "Oui ! {explication}."
