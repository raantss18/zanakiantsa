  question: "Lis ce mot."
  indice: "Lis une syllabe à la fois, puis attache-les."
  exemple: "Essaie une autre image."
  demonstration: "Regarde : c'est {bonne}."
  bravo: "Oui ! Tu as lu « {texte} »."
