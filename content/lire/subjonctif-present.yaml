    nom: "viennes"
    explication: "Après « il faut que », « je veux que », « je souhaite que », « je doute que », on emploie le subjonctif : viennes."
    pieges:
      - { texte: "viens", pourquoi: "Ça, c’est l’indicatif présent. Après « il faut que », « je veux que »… : le subjonctif." }
      - { texte: "viendras", pourquoi: "Ça, c’est le futur. Le subjonctif se forme sans la marque -r-." }
