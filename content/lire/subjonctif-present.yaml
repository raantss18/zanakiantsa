id: subjonctif-present
titre: "Le subjonctif présent"
niveau: 4e
prerequis: ["present"]
programme: { source: cycle4, texte: "Identifier les valeurs du mode subjonctif." }
activite: quiz
parametres: {}
idee: "Le subjonctif exprime un souhait, une obligation, un doute : « Il faut que tu viennes. » Il suit souvent « que »."
phrases:
  consigne: "Lis le début de la phrase, puis touche la bonne forme."
  question: "{texte}"
  indice: "Après « il faut que », « je veux que » : le subjonctif."
  exemple: "« Il faut que tu viennes », et non « que tu viens »."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
