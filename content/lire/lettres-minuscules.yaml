id: lettres-minuscules
titre: "Associer capitales et minuscules"
niveau: GS
prerequis: [lettres-capitales]
programme: { source: c1, texte: "Connaitre les différentes graphies d’une même lettre (majuscule lettre capitale ; minuscules scriptes ; cursives)." }
activite: lettre
parametres: { mode: casse, lettres: ["a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z"] }
idee: "Chaque lettre s'écrit de plusieurs façons : en grande capitale et en petite minuscule. Elles ont le même nom."
phrases:
  consigne: "Regarde la grande lettre, puis touche la même lettre écrite en petit."
  question: "Où est « {lettre} » en minuscule ?"
  indice: "Dis le nom de la grande lettre, puis cherche la petite qui a le même nom."
  exemple: "Essaie une autre lettre."
  demonstration: "Regarde : la petite lettre « {lettre} »."
  bravo: "Oui ! C'est « {lettre} » en minuscule."

en:
  langue: fr
  titre: "French: matching capital and small letters"
  idee: "Every letter can be written in different ways: as a big capital and as a small letter. They have the same name."
  phrases:
    consigne: "Look at the big letter, then touch the same letter written small."
    question: "Where is small « {lettre} »?"
    indice: "Say the name of the big letter, then look for the small one with the same name."
    exemple: "Try another letter."
    demonstration: "Look: the small letter « {lettre} »."
    bravo: "Yes! That's small « {lettre} »."
