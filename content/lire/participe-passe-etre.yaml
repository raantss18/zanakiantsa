id: participe-passe-etre
titre: "Le participe passé avec être"
niveau: CM1
prerequis: ["present"]
programme: { source: cycle3, texte: "Accorder le participe passé avec le sujet dans le cas de l’emploi avec l’auxiliaire être." }
activite: quiz
parametres: {}
idee: "Avec l’auxiliaire être, le participe passé s’accorde avec le sujet, comme un adjectif : elle est partie, ils sont partis."
phrases:
  consigne: "Trouve le sujet, puis touche la bonne forme."
  question: "{texte}"
  indice: "Qui est-ce qui « est » ? Le participe prend son genre et son nombre."
  exemple: "Mes sœurs sont allées : féminin pluriel, -ées."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Accorde le participe passé : Elle est (venu) hier."
    nom: "venue"
    explication: "Avec l’auxiliaire être, le participe passé s’accorde avec le sujet « Elle » : venue."
    pieges:
      - { texte: "venus", pourquoi: "Regarde le sujet « Elle » : est-il masculin ou féminin ?" }
      - { texte: "venu", pourquoi: "Avec être, le participe s’accorde avec le sujet « Elle »." }
  - texte: "Accorde le participe passé : Ils sont (arrivé) à l’heure."
    nom: "arrivés"
    explication: "Avec l’auxiliaire être, le participe passé s’accorde avec le sujet « Ils » : arrivés."
    pieges:
