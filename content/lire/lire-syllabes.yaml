id: lire-syllabes
titre: "Lire des syllabes"
niveau: CP
prerequis: [premiere-lettre]
programme: { source: cycle2, texte: "Déchiffrer des syllabes, des mots puis des phrases en fonction de la progression de l’apprentissage des CGP." }
activite: lettre
parametres: { mode: syllabe, consonnes: [m, l, r, s, f, v, n], voyelles: [a, i, o, u, é] }
