id: present
titre: "Le présent"
niveau: CM1
prerequis: ["lire-phrases"]
programme: { source: cycle3, texte: "Conjugaisons à mémoriser et à maîtriser : présent de l’indicatif [...] des verbes du premier et du deuxième groupe et des verbes irréguliers du troisième groupe (faire, aller, dire, venir, pouvoir, voir, vouloir, prendre)." }
activite: quiz
parametres: {}
idee: "Le présent dit ce qui se passe maintenant. Beaucoup de verbes très courants sont irréguliers : je vais, nous faisons, ils prennent."
phrases:
  consigne: "Lis le verbe et la personne, puis touche la bonne forme."
  question: "{texte}"
  indice: "Au présent, il n’y a ni la marque -ai- de l’imparfait, ni la marque -r- du futur."
  exemple: "Faire, avec « nous », au présent : nous faisons."
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Conjugue « aller » au présent, avec « je »."
    nom: "je vais"
    explication: "Au présent : je vais."
    pieges:
      - { texte: "j’allais", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "j’irai", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « faire » au présent, avec « nous »."
    nom: "nous faisons"
    explication: "Au présent : nous faisons."
    pieges:
      - { texte: "nous faisions", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "nous ferons", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « prendre » au présent, avec « ils »."
    nom: "ils prennent"
    explication: "Au présent : ils prennent."
    pieges:
      - { texte: "ils prenaient", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "ils prendront", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « dire » au présent, avec « tu »."
    nom: "tu dis"
    explication: "Au présent : tu dis."
    pieges:
      - { texte: "tu disais", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "tu diras", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « venir » au présent, avec « vous »."
    nom: "vous venez"
    explication: "Au présent : vous venez."
    pieges:
      - { texte: "vous veniez", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "vous viendrez", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « pouvoir » au présent, avec « elle »."
    nom: "elle peut"
    explication: "Au présent : elle peut."
    pieges:
      - { texte: "elle pouvait", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "elle pourra", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « voir » au présent, avec « nous »."
    nom: "nous voyons"
    explication: "Au présent : nous voyons."
    pieges:
      - { texte: "nous voyions", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "nous verrons", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « vouloir » au présent, avec « je »."
    nom: "je veux"
    explication: "Au présent : je veux."
    pieges:
      - { texte: "je voulais", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "je voudrai", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « finir » au présent, avec « ils »."
    nom: "ils finissent"
    explication: "Au présent : ils finissent."
    pieges:
      - { texte: "ils finissaient", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "ils finiront", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « manger » au présent, avec « tu »."
    nom: "tu manges"
    explication: "Au présent : tu manges."
    pieges:
      - { texte: "tu mangeais", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "tu mangeras", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }

en:
  langue: "fr"
  titre: "French: the present tense"
  idee: "The present tense says what is happening now. Lots of very common French verbs are irregular: « je vais », « nous faisons », « ils prennent »."
  phrases:
    consigne: "Read the verb and the person, then touch the right form."
    question: "{texte}"
    indice: "In the present tense there is no imperfect marker « -ai- » and no future marker « -r- »."
    exemple: "« Faire » with « nous », in the present tense: « nous faisons »."
    demonstration: "{explication}"
    bravo: "Yes! It's « {bonne} »."
  items:
    - texte: "Conjugate « aller » in the present tense, with « je »."
      nom: "je vais"
      explication: "In the present tense: « je vais »."
      pieges:
        - texte: "j’allais"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "j’irai"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « faire » in the present tense, with « nous »."
      nom: "nous faisons"
      explication: "In the present tense: « nous faisons »."
      pieges:
        - texte: "nous faisions"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "nous ferons"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « prendre » in the present tense, with « ils »."
      nom: "ils prennent"
      explication: "In the present tense: « ils prennent »."
      pieges:
        - texte: "ils prenaient"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "ils prendront"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « dire » in the present tense, with « tu »."
      nom: "tu dis"
      explication: "In the present tense: « tu dis »."
      pieges:
        - texte: "tu disais"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "tu diras"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « venir » in the present tense, with « vous »."
      nom: "vous venez"
      explication: "In the present tense: « vous venez »."
      pieges:
        - texte: "vous veniez"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "vous viendrez"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « pouvoir » in the present tense, with « elle »."
      nom: "elle peut"
      explication: "In the present tense: « elle peut »."
      pieges:
        - texte: "elle pouvait"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "elle pourra"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « voir » in the present tense, with « nous »."
      nom: "nous voyons"
      explication: "In the present tense: « nous voyons »."
      pieges:
        - texte: "nous voyions"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "nous verrons"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « vouloir » in the present tense, with « je »."
      nom: "je veux"
      explication: "In the present tense: « je veux »."
      pieges:
        - texte: "je voulais"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "je voudrai"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « finir » in the present tense, with « ils »."
      nom: "ils finissent"
      explication: "In the present tense: « ils finissent »."
      pieges:
        - texte: "ils finissaient"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "ils finiront"
          pourquoi: "That's the future tense, with its marker « -r- »."
    - texte: "Conjugate « manger » in the present tense, with « tu »."
      nom: "tu manges"
      explication: "In the present tense: « tu manges »."
      pieges:
        - texte: "tu mangeais"
          pourquoi: "That's the imperfect, with its marker « -ai- » or « -i- »."
        - texte: "tu mangeras"
          pourquoi: "That's the future tense, with its marker « -r- »."
