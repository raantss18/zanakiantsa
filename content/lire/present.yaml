    nom: "je vais"
    explication: "Au présent : je vais."
    pieges:
      - { texte: "j’allais", pourquoi: "Ça, c’est l’imparfait, avec sa marque -ai- ou -i-." }
      - { texte: "j’irai", pourquoi: "Ça, c’est le futur, avec sa marque -r-." }
  - texte: "Conjugue « faire » au présent, avec « nous »."
