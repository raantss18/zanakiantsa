      - { texte: "aurait plu", pourquoi: "Ça, c’est le conditionnel passé ou le futur antérieur : l’auxiliaire doit être au subjonctif." }
  - texte: "Complète au subjonctif passé : Je doute qu’ils (comprendre)."
    nom: "aient compris"
    explication: "Le subjonctif passé : l’auxiliaire au subjonctif présent + le participe passé : aient compris."
    pieges:
