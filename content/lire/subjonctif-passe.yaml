      - { texte: "serait partie", pourquoi: "Ça, c’est le conditionnel passé ou le futur antérieur : l’auxiliaire doit être au subjonctif." }
  - texte: "Complète au subjonctif passé : Bien qu’il (pleuvoir), nous sommes sortis."
    nom: "ait plu"
    explication: "Le subjonctif passé : l’auxiliaire au subjonctif présent + le participe passé : ait plu."
    pieges:
