id: subjonctif-passe
titre: "Le subjonctif passé"
niveau: 3e
prerequis: ["subjonctif-present", "temps-composes"]
programme: { source: cycle4, texte: "Employer et identifier le présent et le passé du subjonctif à l’écrit et à l’oral. Connaitre la morphologie du passé du subjonctif." }
activite: quiz
parametres: {}
idee: "Le subjonctif passé, c’est l’auxiliaire au subjonctif présent + le participe passé : « que tu aies réussi », « qu’elle soit partie »."
phrases:
  consigne: "Lis le début de la phrase, puis touche la bonne forme."
  question: "{texte}"
  indice: "Auxiliaire au subjonctif (aie, ait, soit, soyons…) + participe passé."
  exemple: "« Je suis content que tu aies réussi. »"
  demonstration: "{explication}"
  bravo: "Oui ! C’est {bonne}."
items:
  - texte: "Complète au subjonctif passé : Je suis content que tu (réussir) ton examen."
    nom: "aies réussi"
    explication: "Le subjonctif passé : l’auxiliaire au subjonctif présent + le participe passé : aies réussi."
    pieges:
      - { texte: "as réussi", pourquoi: "Ça, c’est le passé composé de l’indicatif : l’auxiliaire doit être au subjonctif (aie, ait, soit…)." }
      - { texte: "aurais réussi", pourquoi: "Ça, c’est le conditionnel passé ou le futur antérieur : l’auxiliaire doit être au subjonctif." }
  - texte: "Complète au subjonctif passé : Il faut que vous (finir) avant midi."
    nom: "ayez fini"
    explication: "Le subjonctif passé : l’auxiliaire au subjonctif présent + le participe passé : ayez fini."
    pieges:
