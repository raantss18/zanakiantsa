  - texte: "Dans « Les élèves deviennent calmes. », quelle est la fonction de « calmes » ?"
    nom: "attribut du sujet"
    explication: "« deviennent » est un verbe d’état : « calmes » dit comment est le sujet. C’est un attribut du sujet."
    pieges:
