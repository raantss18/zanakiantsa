  - texte: "Dans « Le ciel reste gris. », quelle est la fonction de « gris » ?"
    nom: "attribut du sujet"
    explication: "« reste » est un verbe d’état : « gris » dit comment est le sujet. C’est un attribut du sujet."
    pieges:
