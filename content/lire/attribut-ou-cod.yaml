        - texte: "adverbial phrase"
          pourquoi: "The verb « regardons » is not a state verb: ask « regardons quoi ? »."
    - texte: "In « Les élèves deviennent calmes. », what is the job of « calmes »?"
      nom: "subject complement"
      explication: "« deviennent » is a state verb: « calmes » tells you what the subject is like. It's a subject complement."
      pieges:
        - texte: "direct object (COD)"
          pourquoi: "« deviennent » is a state verb (« être, sembler, paraître, devenir, rester »): what comes after it is a subject complement."
        - texte: "adverbial phrase"
          pourquoi: "« deviennent » is a state verb (« être, sembler, paraître, devenir, rester »): what comes after it is a subject complement."
    - texte: "In « Il range sa chambre. », what is the job of « sa chambre »?"
