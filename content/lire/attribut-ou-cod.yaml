    nom: "complément circonstanciel"
    explication: "« dans le jardin » dit où se passe l’action ; on peut le déplacer ou l’enlever. C’est un complément circonstanciel."
    pieges:
      - { texte: "attribut du sujet", pourquoi: "« dans le jardin » ne répond pas à « quoi ? » mais à « où ? »." }
      - { texte: "complément d’objet direct (COD)", pourquoi: "« dans le jardin » ne répond pas à « quoi ? » mais à « où ? »." }

en:
  langue: "fr"
  titre: "French: subject complement or direct object?"
  idee: "After a state verb (« être, sembler, paraître, devenir, rester »), the word tells you what the subject is like: a subject complement. After another verb, ask “what?”: a direct object (COD)."
  phrases:
    consigne: "Find the verb, then touch the word's job in the sentence."
    question: "{texte}"
    indice: "Is the verb a state verb? If not, ask “verb + what?”."
    exemple: "« Le chat semble fatigué »: « sembler » is a state verb, so « fatigué » is a subject complement."
    demonstration: "{explication}"
    bravo: "Yes! The answer is: {bonne}."
  items:
    - texte: "In « Le chat semble fatigué. », what is the job of « fatigué »?"
      nom: "subject complement"
      explication: "« semble » is a state verb: « fatigué » tells you what the subject is like. It's a subject complement."
      pieges:
        - texte: "direct object (COD)"
          pourquoi: "« semble » is a state verb (« être, sembler, paraître, devenir, rester »): what comes after it is a subject complement."
        - texte: "adverbial phrase"
          pourquoi: "« semble » is a state verb (« être, sembler, paraître, devenir, rester »): what comes after it is a subject complement."
    - texte: "In « Le chat mange une souris. », what is the job of « une souris »?"
      nom: "direct object (COD)"
      explication: "« mange » is not a state verb: you can ask « mange quoi ? » — answer: « une souris ». It's a direct object (COD)."
      pieges:
        - texte: "subject complement"
          pourquoi: "The verb « mange » is not a state verb: ask « mange quoi ? »."
        - texte: "adverbial phrase"
          pourquoi: "The verb « mange » is not a state verb: ask « mange quoi ? »."
    - texte: "In « Mon frère est médecin. », what is the job of « médecin »?"
      nom: "subject complement"
      explication: "« est » is a state verb: « médecin » tells you what the subject is like. It's a subject complement."
      pieges:
        - texte: "direct object (COD)"
          pourquoi: "« est » is a state verb (« être, sembler, paraître, devenir, rester »): what comes after it is a subject complement."
        - texte: "adverbial phrase"
          pourquoi: "« est » is a state verb (« être, sembler, paraître, devenir, rester »): what comes after it is a subject complement."
    - texte: "In « Léa lit un livre. », what is the job of « un livre »?"
      nom: "direct object (COD)"
      explication: "« lit » is not a state verb: you can ask « lit quoi ? » — answer: « un livre ». It's a direct object (COD)."
      pieges:
        - texte: "subject complement"
          pourquoi: "The verb « lit » is not a state verb: ask « lit quoi ? »."
        - texte: "adverbial phrase"
          pourquoi: "The verb « lit » is not a state verb: ask « lit quoi ? »."
    - texte: "In « Ce gâteau paraît délicieux. », what is the job of « délicieux »?"
      nom: "subject complement"
      explication: "« paraît » is a state verb: « délicieux » tells you what the subject is like. It's a subject complement."
      pieges:
        - texte: "direct object (COD)"
          pourquoi: "« paraît » is a state verb (« être, sembler, paraître, devenir, rester »): what comes after it is a subject complement."
        - texte: "adverbial phrase"
          pourquoi: "« paraît » is a state verb (« être, sembler, paraître, devenir, rester »): what comes after it is a subject complement."
    - texte: "In « Nous regardons la mer. », what is the job of « la mer »?"
      nom: "direct object (COD)"
      explication: "« regardons » is not a state verb: you can ask « regardons quoi ? » — answer: « la mer ». It's a direct object (COD)."
      pieges:
