id: lire
titre: Lire et écrire
nom: "Lire et écrire"
# Nom selon la tranche d'âge (ADR 0066) : à 17 ans, plus de « Lire et écrire » sur l'accueil.
noms: {moyens: "Le français", grands: "Français"}
# Pour le site vitrine, une phrase pour les parents (tool/build_site.py).
resume: "Syllabes, lettres capitales et cursives, tracé des lettres au doigt ; puis lecture suivie, conjugaison et grammaire, jusqu’à l’analyse littéraire du lycée."
icone: "1f4d6"
ages: [4, 17]
# Maternelle (version consolidée 2026) : « Passer de l'oral à l'écrit : se préparer à apprendre à lire » p. 12-16 et
# « … à apprendre à écrire » p. 17-20. CP-CE1 : programme de français du cycle 2 (BOENJS du 31 octobre 2024), annexe 3.
# Syllabes comptées à l'oral ; mots ambigus écartés (lion, avion, camion). Consultés le 2026-11-03.
sources:
  c1: "https://eduscol.education.gouv.fr/sites/default/files/document/programme-cycle-1-consolide-127565.pdf"
  cycle2: "https://education.gouv.fr/sites/default/files/ensel135_annexe3.pdf"
  # CM1-6e : programme de français du cycle 3 (BO n° 16 du 17 avril 2025), « Étude de la langue », lu le 2026-11-07.
  cycle3: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf"
  # 5e-3e : programme de français du cycle 4, annexe 1, « Étude de la langue », lu le 2026-11-07.
  cycle4: "https://www.education.gouv.fr/sites/default/files/document/Annexe%201%20%E2%80%93%20Programme%20de%20fran%C3%A7ais%20pour%20le%20cycle%204-480713.pdf"
  # analyse-poeme : Rimbaud, « Le Dormeur du val » (1870 ; auteur mort en 1891, domaine public), texte vérifié le 2026-11-07 sur
  # https://fr.wikisource.org/wiki/Poésies_(Rimbaud)/éd._Vanier,_1895/Le_Dormeur_du_val (Vanier, 1895, page validée).
  # 2de et 1re : programmes de français de seconde (annexe 1) et de première (annexe 2), arrêté du 17 janvier 2019,
  # BO spécial n° 1 du 22 janvier 2019 (https://www.education.gouv.fr/bo/19/Special1/MENE1901575A.htm). Le BO et
  # eduscol refusent la lecture automatique (403) : texte lu le 2026-11-07 dans les copies des annexes ci-dessous.
  # ⚠ La partie « Grammaire » a été modifiée par un arrêté publié au BO n° 40 du 22 octobre 2020 : à recouper.
  lycee2de: "https://www.snes.edu/IMG/pdf/francais_annexe-1_2e_bo-annote.pdf"
  lycee1re: "https://www.snes.edu/IMG/pdf/francais_annexe-2_1egt_bo-2.pdf"
