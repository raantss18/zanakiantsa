ordre: [syllabes, rimes, debut, lettres-capitales, lettres-minuscules, premiere-lettre, lettres-cursives, tracer-capitales, lire-syllabes, tracer-cursive, lire-mots, lire-phrases]

# Animation de méthode, jouée à la première ouverture du jour (ADR 0033).
intro:
  - texte: "Pour lire, on écoute les sons des mots."
    images: ["1f442", "1f4d6"]
  - texte: "Chaque lettre a un nom et un son : la lettre s fait « sss »."
    images: ["1f40d"]
    grand: "s"
  - texte: "On attache les sons : m et a, ça fait « ma » !"
    images: []
    grand: "m a → ma"
