# Animation de méthode, jouée à la première ouverture du jour (ADR 0033).
intro:
  - texte: "Pour lire, on écoute les sons des mots."
    images: ["1f442", "1f4d6"]
  - texte: "Chaque lettre a un nom et un son : la lettre s fait « sss »."
    images: ["1f40d"]
    grand: "s"
  - texte: "On attache les sons : m et a, ça fait « ma » !"
    images: []
    grand: "m a → ma"

en:
  titre: "French — reading, writing and grammar"
  nom: "French"
  noms: {moyens: "French", grands: "French"}
  resume: "French syllables, capital and joined-up letters, tracing letters with a finger; then reading comprehension, French verbs and grammar, up to sixth-form literary analysis."
  intro:
    - texte: "To read French, we listen to the sounds in the words."
      images: ["1f442", "1f4d6"]
    - texte: "Every letter has a name and a sound: the letter « s » goes « sss »."
      images: ["1f40d"]
      grand: "s"
    - texte: "We join the sounds together: « m » and « a » make « ma »!"
      images: []
      grand: "m a → ma"
