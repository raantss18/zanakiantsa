id: robot-tourner
titre: Avancer et pivoter
niveau: GS
prerequis: [fleches]
programme: { source: c1, texte: "Choisir et organiser 3 à 5 instructions simples (avancer, tourner) dans le bon ordre pour conduire un objet ou un robot jusqu’à une case cible sur un quadrillage." }
activite: programmer
parametres: { mode: tourner, grille: 5, min: 3, max: 5 }
idee: "Avancer va tout droit, là où regarde la flèche. Pivoter fait tourner sur place, sans avancer."
phrases:
  consigne: "Avancer : une case tout droit, là où regarde la flèche. Pivoter : tourner sur place. Écris le programme, puis touche le bouton vert."
  question: "Programme le robot pour aller jusqu'à l'objet."
  indice: "Regarde où pointe la petite flèche. Faut-il pivoter avant d'avancer ?"
  exemple: "Pivoter à droite, c'est un quart de tour du côté de ta main droite."
  demonstration: "Regarde ce programme : il conduit jusqu'à l'objet."
  bravo: "Bravo ! Ton programme est juste."

en:
  titre: "Moving forward and turning"
  idee: "Move forward goes straight, the way the arrow is pointing. Turn makes the robot spin on the spot, without moving forward."
  phrases:
    consigne: "Move forward: one square straight ahead, the way the arrow is pointing. Turn: spin on the spot. Write the program, then touch the green button."
    question: "Program the robot to get to the object."
    indice: "Look where the little arrow is pointing. Do you need to turn before moving forward?"
    exemple: "Turning right is a quarter turn towards your right hand."
    demonstration: "Look at this program: it leads to the object."
    bravo: "Well done! Your program is right."
