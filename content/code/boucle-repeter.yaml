id: boucle-repeter
titre: "La boucle : répéter"
niveau: CE2
prerequis: [robot-rochers]
programme: { source: prog, texte: "Construire des algorithmes qui comprennent des instructions simples (action déclenchée par un évènement, séquence d'instructions, boucle, instructions conditionnelles, variable)." }
activite: blocs
parametres: { mode: boucle }
idee: "Quand le robot doit refaire plusieurs fois la même chose, on ne l'écrit qu'une fois, dans un bloc « répéter » : il refait tout ce qu'il y a dedans, autant de fois que demandé."
phrases:
  consigne: "Il y a peu de place : trouve ce qui se répète dans le chemin. Mets ces blocs dans « répéter », règle le nombre de tours, puis touche le bouton vert."
  question: "Conduis le robot jusqu'à l'objet avec une boucle."
  indice: "Regarde le chemin : quel petit morceau revient plusieurs fois ? Combien de fois ?"
  exemple: "Touche « répéter », puis les blocs qui vont dedans, puis « Fermer le bloc »."
  demonstration: "Regarde ce programme : une seule boucle suffit."
  bravo: "Bravo ! Ta boucle est juste."
