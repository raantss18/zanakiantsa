id: compteur
titre: "Le compteur : une variable"
niveau: CM2
prerequis: [condition-si]
# Source : la fiche éduscol « Programmer » (cycles 3 et 4) cite « variable » parmi les instructions simples, sans
# préciser sa forme. La forme choisie ici (un compteur qu'on augmente de 1) est un choix de l'app : non vérifié.
programme: { source: prog, texte: "Construire des algorithmes qui comprennent des instructions simples (action déclenchée par un évènement, séquence d'instructions, boucle, instructions conditionnelles, variable)." }
activite: blocs
parametres: { mode: compteur }
idee: "Un compteur est une petite boîte qui garde un nombre. Il commence à 0. Le bloc « ajouter 1 au compteur » le fait grimper. On peut demander au robot de s'arrêter quand le compteur atteint un nombre."
phrases:
  consigne: "Le robot doit s'arrêter sur la gemme au drapeau : toujours la même gemme en comptant depuis la gauche, mais les gemmes ne sont pas aux mêmes endroits. Fais-le compter, puis touche le bouton vert : ton programme est essayé sur trois parcours."
  question: "Programme le robot avec un compteur : il doit s'arrêter sur la gemme au drapeau, sur les trois parcours."
  indice: "Compte les gemmes jusqu'au drapeau. À chaque pas, si le robot est sur une gemme, ajoute 1 au compteur. Arrête-toi quand le compteur vaut ce nombre."
  exemple: "Mets « répéter jusqu'à compteur = » et règle le nombre. Dedans : « avancer », puis « si gemme ici » avec « ajouter 1 au compteur » dedans."
  demonstration: "Regarde ce programme : il compte les gemmes, et marche sur les trois parcours."
  bravo: "Bravo ! Ton programme marche partout, parce que ton robot sait compter."

en:
  titre: "The counter: a variable"
  idee: "A counter is a little box that keeps a number. It starts at 0. The “add 1 to counter” block makes it go up. We can ask the robot to stop when the counter reaches a number."
  phrases:
    consigne: "The robot must stop on the gem with the flag: always the same gem counting from the left, but the gems are not in the same places. Make it count, then touch the green button: your program is tried on three paths."
    question: "Program the robot with a counter: it must stop on the gem with the flag, on all three paths."
    indice: "Count the gems up to the flag. At each step, if the robot is on a gem, add 1 to the counter. Stop when the counter reaches that number."
    exemple: "Put “repeat until counter =” and set the number. Inside: “move forward”, then “if gem here” with “add 1 to counter” inside it."
    demonstration: "Look at this program: it counts the gems, and works on all three paths."
    bravo: "Well done! Your program works everywhere, because your robot knows how to count."
