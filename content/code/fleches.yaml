id: fleches
titre: Coder un trajet avec des flèches
niveau: GS
prerequis: []
programme: { source: c1, texte: "Coder à l’aide de flèches le déplacement effectué par un objet mobile sur un tableau à cases." }
activite: programmer
parametres: { mode: fleches, grille: 5, min: 2, max: 5 }
idee: "Chaque flèche fait avancer d'une case dans sa direction. Le programme, c'est la liste des flèches dans l'ordre."
phrases:
  consigne: "Touche les flèches dans l'ordre du chemin, une flèche par case, puis le bouton vert. C'est réussi quand tu arrives sur l'objet."
  question: "Écris le chemin pour aller jusqu'à l'objet."
  indice: "Chaque flèche fait avancer d'une case. Compte les cases jusqu'à l'objet."
  exemple: "Efface le dernier bloc avec la touche grise si tu t'es trompé."
  demonstration: "Regarde ce programme : il conduit jusqu'à l'objet."
  bravo: "Bravo ! Ton programme est juste."

en:
  titre: "Coding a route with arrows"
  idee: "Each arrow moves you one square in its direction. The program is the list of arrows, in order."
  phrases:
    consigne: "Touch the arrows in the order of the path, one arrow for each square, then the green button. You've done it when you reach the object."
    question: "Write the path to get to the object."
    indice: "Each arrow moves you one square. Count the squares up to the object."
    exemple: "If you want to change something, rub out the last block with the grey key."
    demonstration: "Look at this program: it leads to the object."
    bravo: "Well done! Your program is right."
