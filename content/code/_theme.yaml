id: code
titre: Programmer un robot
nom: "Le code"
# Nom selon la tranche d'âge (ADR 0066) : à 17 ans, plus de « Lire et écrire » sur l'accueil.
noms: {moyens: "Le code", grands: "Informatique"}
# Pour le site vitrine, une phrase pour les parents (tool/build_site.py).
resume: "Programmer un robot avec des flèches, puis des blocs : boucles, conditions, compteur."
icone: "1f916"
ages: [5, 18]
# Domaine « hors école » (ADR 0069) : les programmes de maths et de technologie parlent de programmation, mais l'âge ne
# garantit pas qu'un enfant en ait déjà fait (supposé, non mesuré). Un grand débutant commence donc par les programmes
# écrits du collège (6e), pas par le robot de maternelle ni par une question sur un code jamais vu ; « Je sais déjà » lui
# permet de sauter ce qu'il connaît.
hors_ecole: true
entree: {petits: GS, moyens: GS, grands: 6e}
# Maternelle (version consolidée 2026) : « Se repérer dans l'espace » p. 54-57 et « Découvrir le monde des objets »
# p. 61. CP (programme de mathématiques du cycle 2, annexe 4) : « Le repérage dans l'espace ». Consultés le 2026-11-03.
# Blocs inspirés de l'idée de ScratchJr (aucun code ni dessin repris, CLAUDE.md règle 7).
sources:
  c1: "https://eduscol.education.gouv.fr/sites/default/files/document/programme-cycle-1-consolide-127565.pdf"
  cycle2: "https://www.education.gouv.fr/sites/default/files/document/Annexe%204%20%E2%80%93%20Programme%20de%20math%C3%A9matiques%20du%20cycle%202-403821.pdf"
  # Fiche éduscol « Programmer » (DNE, juillet 2016), cycles 3 et 4 : boucle, instructions conditionnelles.
  prog: "https://eduscol.education.fr/document/14773/download"
  # 6e : programme de mathématiques du cycle 3, « Initiation à la pensée informatique », Sixième. 5e–3e : programme de
  # mathématiques du cycle 4 (annexe 2), « La pensée informatique », Cinquième à Troisième. Lus le 2026-11-07.
  cycle3: "https://www.education.gouv.fr/sites/default/files/programme-de-math-matiques-pour-le-cycle-3-439827.pdf"
  cycle4: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20math%C3%A9matiques%20pour%20le%20cycle%204-480716.pdf"
  # 2de : programme de mathématiques de seconde générale et technologique, partie « Algorithmique et programmation »
  # (annexe du BO spécial n° 1 du 22 janvier 2019), lu dans cette copie le 2026-11-07 : le site du ministère refuse le
  # téléchargement automatique. ⚠ Un programme de 2de paru au BO n° 14 du 2 avril 2026 n'a pas été lu à la source.
  # Les sorties de chaque programme Python ont été vérifiées en l'exécutant (Python 3.14). Noms des blocs Scratch :
  # traductions officielles de Scratch 3 (github.com/scratchfoundation/scratch-l10n, editor/blocks/fr.json).
  seconde: "https://www.snes.edu/IMG/pdf/maths_annexe_2egt_bo.pdf"
  # 1re et Terminale : programmes de l'enseignement de spécialité « numérique et sciences informatiques » (NSI). 1re :
  # annexe du BO spécial n° 1 du 22 janvier 2019 (PDF du ministère). Terminale : PDF publié par éduscol (programme du
  # BO spécial n° 8 du 25 juillet 2019 : référence non relue dans le PDF, qui ne la cite pas ; annexe du ministère non retrouvée). Les deux lus le
  # 2026-11-07. Chaque programme Python a été exécuté (Python 3.14) et chaque requête SQL testée avec sqlite3 3.54.
  nsi1: "https://cache.media.education.gouv.fr/file/SP1-MEN-22-1-2019/26/8/spe633_annexe_1063268.pdf"
  nsiT: "https://eduscol.education.fr/document/30010/download"
