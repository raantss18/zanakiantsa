id: suite-nombres
titre: "Compter de un en un, de deux en deux, de dix en dix"
niveau: CP
prerequis: [motif-evolutif]
programme: { source: c2, texte: "L'élève sait compter, à l'oral et à l'écrit, de un en un, de deux en deux et de dix en dix en partant de n'importe quel nombre." }
activite: suite
parametres: { pas: [1, 2, 10], max: 100 }
idee: "Une suite de nombres a une règle, comme une suite d'images : on avance toujours du même pas."
phrases:
  consigne: "Lis les nombres un par un et trouve de combien on avance. Puis touche le nombre qui manque."
  question: "Ces nombres vont de {pas} en {pas}. Quel nombre manque ?"
  indice: "Compte de {pas} en {pas} à partir du premier nombre, en montrant chaque case."
  exemple: "Dis la suite à voix haute, du premier au dernier nombre."
  demonstration: "Regarde : de {pas} en {pas}, le nombre qui manque, c'est {n}."
  bravo: "Oui ! De {pas} en {pas}, c'est {n}."
variantes:
  - "Quel nombre se cache sous le point d'interrogation ?"
