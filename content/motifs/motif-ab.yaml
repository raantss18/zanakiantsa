id: motif-ab
titre: "Une suite qui alterne deux images"
niveau: MS
prerequis: []
programme: { source: c1, texte: "Prolonger l’amorce d’un motif répétitif et verbaliser la règle de prolongement utilisée (exemple : ★⚫★⚫)." }
activite: motif
parametres: { base: "AB" }
idee: "Une suite, c'est un petit groupe d'images qui se répète toujours dans le même ordre."
phrases:
  consigne: "Regarde bien la suite d'images et trouve ce qui se répète. Puis touche l'image qui manque."
  question: "Quelle image manque ?"
  indice: "Écoute : une image, puis l'autre, et on recommence."
  exemple: "Dis la suite à voix haute, en montrant chaque image."
  demonstration: "Regarde : c'est cette image qui continue la suite."
  bravo: "Oui ! Tu as trouvé la règle de la suite."
