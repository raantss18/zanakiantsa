id: motif-evolutif
titre: "Une suite qui grandit"
niveau: GS
prerequis: [motif-abc]
programme: { source: c1, texte: "Repérer et décrire oralement la structure d’un motif évolutif (exemple : ABAABBAAABBB). Les motifs évolutifs ne seront travaillés qu’à partir de cinq ans." }
activite: motif
parametres: { base: "AB+" }
phrases:
  consigne: "Regarde bien la suite d'images."
  question: "Quelle image manque ?"
  indice: "Regarde : à chaque tour, on en met un de plus."
  exemple: "Dis la suite à voix haute, en montrant chaque image."
  demonstration: "Regarde : c'est cette image qui continue la suite."
  bravo: "Oui ! Tu as trouvé la règle de la suite."
