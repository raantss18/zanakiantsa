id: motif-evolutif
titre: "Une suite qui grandit"
niveau: GS
prerequis: [motif-abc]
programme: { source: c1, texte: "Repérer et décrire oralement la structure d’un motif évolutif (exemple : ABAABBAAABBB). Les motifs évolutifs ne seront travaillés qu’à partir de cinq ans." }
activite: motif
parametres: { base: "AB+" }
idee: "Cette suite grandit : à chaque tour, on met une image de plus."
phrases:
  consigne: "Regarde bien la suite d'images : elle grandit à chaque tour. Puis touche l'image qui manque."
  question: "Quelle image manque ?"
  indice: "Regarde : à chaque tour, on en met un de plus."
  exemple: "Dis la suite à voix haute, en montrant chaque image."
  demonstration: "Regarde : c'est cette image qui continue la suite."
  bravo: "Oui ! Tu as trouvé la règle de la suite."

en:
  titre: "A pattern that grows"
  idee: "This pattern grows: each time round, we add one more picture."
  phrases:
    consigne: "Look carefully at the row of pictures: it grows each time round. Then touch the missing picture."
    question: "Which picture is missing?"
    indice: "Look: each time round, we add one more."
    exemple: "Say the pattern out loud, pointing to each picture."
    demonstration: "Look: this is the picture that carries on the pattern."
    bravo: "Yes! You found the rule of the pattern."
