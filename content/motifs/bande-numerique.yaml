id: bande-numerique
titre: "Les grands nombres sur la bande"
niveau: CE1
prerequis: [suite-rebours]
programme: { source: c2, texte: "Sur une bande numérique ou une demi-droite graduée de un en un, l'élève intercale et positionne des nombres manquants. […] L'élève sait placer un nombre […] sur une demi-droite graduée de un en un, ou de dix en dix, ou de cent en cent." }
activite: suite
parametres: { pas: [1, 10, 100], min: 100, max: 1000 }
idee: "Avec les grands nombres, c'est pareil : un pas de un change les unités, un pas de dix les dizaines, un pas de cent les centaines."
phrases:
  consigne: "Lis les nombres un par un. Quel nombre manque ?"
  question: "Ces nombres vont de {pas} en {pas}. Quel nombre manque ?"
  indice: "Regarde quel chiffre change d'une case à l'autre, et fais un pas de {pas}."
  exemple: "Dis la suite à voix haute, du premier au dernier nombre."
  demonstration: "Regarde : de {pas} en {pas}, le nombre qui manque, c'est {n}."
  bravo: "Oui ! De {pas} en {pas}, c'est {n}."
variantes:
  - "Quel nombre se cache sous le point d'interrogation ?"
