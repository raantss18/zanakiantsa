id: motif-abb
titre: "Une suite : une image, puis deux"
niveau: MS
prerequis: [motif-ab]
programme: { source: c1, texte: "Prolonger l’amorce d’un motif répétitif (exemple : ★⚫⚫★⚫⚫)." }
activite: motif
parametres: { base: "ABB" }
idee: "Ici, le groupe qui se répète a trois images : une, puis deux fois l'autre."
phrases:
  consigne: "Regarde bien la suite d'images et trouve ce qui se répète. Puis touche l'image qui manque."
  question: "Quelle image manque ?"
  indice: "Regarde : une image, puis deux fois l'autre, et on recommence."
  exemple: "Dis la suite à voix haute, en montrant chaque image."
  demonstration: "Regarde : c'est cette image qui continue la suite."
  bravo: "Oui ! Tu as trouvé la règle de la suite."

en:
  titre: "A pattern: one picture, then two"
  idee: "Here, the group that repeats has three pictures: one, then the other one twice."
  phrases:
    consigne: "Look carefully at the row of pictures and find what repeats. Then touch the missing picture."
    question: "Which picture is missing?"
    indice: "Look: one picture, then the other one twice, and start again."
    exemple: "Say the pattern out loud, pointing to each picture."
    demonstration: "Look: this is the picture that carries on the pattern."
    bravo: "Yes! You found the rule of the pattern."
