id: suite-rebours
titre: "Compter à rebours"
niveau: CP
prerequis: [suite-nombres]
programme: { source: c2, texte: "L'élève sait compter, à l'oral comme à l'écrit, à rebours, de un en un en partant de n'importe quel nombre." }
activite: suite
parametres: { pas: [-1], min: 0, max: 100 }
idee: "Compter à rebours, c'est compter à l'envers, comme pour une fusée : chaque nombre a un de moins."
phrases:
  consigne: "Lis les nombres un par un : ils descendent. Puis touche le nombre qui manque."
  question: "On compte à rebours, de un en un. Quel nombre manque ?"
  indice: "Chaque nombre a un de moins que celui d'avant : recule d'un pas."
  exemple: "Dis la suite à voix haute, comme le compte à rebours d'une fusée."
  demonstration: "Regarde : à rebours, le nombre qui manque, c'est {n}."
  bravo: "Oui ! À rebours, c'est {n}."
variantes:
  - "Quel nombre se cache sous le point d'interrogation ?"

en:
  titre: "Counting backwards"
  idee: "Counting backwards is counting the other way round, like for a rocket launch: each number is one less."
  phrases:
    consigne: "Read the numbers one by one: they go down. Then touch the missing number."
    question: "We're counting backwards, one at a time. Which number is missing?"
    indice: "Each number is one less than the one before: take one step back."
    exemple: "Say the numbers out loud, like a rocket countdown."
    demonstration: "Look: counting backwards, the missing number is {n}."
    bravo: "Yes! Counting backwards, it's {n}."
  variantes:
    - "Which number is hiding under the question mark?"
