id: motifs
titre: Se familiariser avec les motifs organisés
nom: "Les suites"
# Pour le site vitrine, une phrase pour les parents (tool/build_site.py).
resume: "Suites d'images et de nombres : de 1 en 1, de 2 en 2, de 10 en 10, à rebours."
icone: "1f9e9"
ages: [4, 8]
# Programme de l'école maternelle, version consolidée, « Se familiariser avec les motifs organisés », p. 49-51
# (premier pas vers l'algorithmique). Consulté le 2026-11-03.
sources:
  c1: "https://eduscol.education.gouv.fr/sites/default/files/document/programme-cycle-1-consolide-127565.pdf"
  # Programme de mathématiques du cycle 2 (2025), « Connaitre la suite écrite et la suite orale des nombres jusqu'à
  # cent », et la bande numérique au CE1. Consulté le 2026-11-03.
  c2: "https://www.education.gouv.fr/sites/default/files/document/Annexe%204%20%E2%80%93%20Programme%20de%20math%C3%A9matiques%20du%20cycle%202-403821.pdf"
ordre: [motif-ab, motif-abb, motif-abc, motif-evolutif, suite-nombres, suite-rebours, bande-numerique]

# Animation de méthode, jouée à la première ouverture du jour (ADR 0033).
intro:
  - texte: "Une suite, c'est un groupe d'images qui se répète."
    images: ["2b50", "1f319", "2b50", "1f319"]
  - texte: "Dis-la à voix haute : étoile, lune, étoile, lune…"
    images: ["2b50", "1f319"]
  - texte: "Trouve ce qui vient ensuite !"
    images: ["2b50", "1f319", "2b50"]
    grand: "?"
