#
# Vérifiée le 2026-11-07 :
#  - identifiant trouvé via la page de la chaîne (<link rel="canonical">) ou la
#    recherche YouTube filtrée « chaînes » ;
#  - chaque identifiant contrôlé sur le flux RSS officiel
#    https://www.youtube.com/feeds/videos.xml?channel_id=<ID> : titre de la
#    chaîne identique, 15 dernières vidéos lues (titres éducatifs) ;
#  - « pourquoi » et « editeur » tirés de la description « À propos » de la
#    chaîne (et du site procidis.com / learningblocks.tv pour deux d'entre elles) ;
#  - proportion de shorts estimée sur les 15 dernières vidéos du flux
#    (liens /shorts/) : les chaînes à majorité de shorts ont été écartées.
# « dernier » = date du dernier ajout lu dans le flux RSS.
# Domaines echecs et dessin : aucune chaîne retenue (ChessKid = promotion du
# site + streamers ; Art for Kids Hub = majorité de shorts familiaux).

# ages : [min, max] ; un max de 18 veut dire « 18 ans et plus » (pas d'âge maximum, ADR 0057).
# titre_contient : ne garder que les vidéos dont le titre contient ce texte.
