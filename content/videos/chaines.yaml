#    https://www.youtube.com/feeds/videos.xml?channel_id=<ID> : titre de la
#    chaîne identique, 15 dernières vidéos lues (titres éducatifs) ;
#  - « pourquoi » et « editeur » tirés de la description « À propos » de la
